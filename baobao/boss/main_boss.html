<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Eternal Pact - Master Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blood: #8b0000; --gold: #d4af37; }

        /* Nền cơ bản của trang */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Quicksand', sans-serif; 
            background: #000; /* Nền đen để không bị chói mắt */
            overflow: hidden; 
        }
        
        /* Container chứa ảnh nền chờ img/4.png */
        .main-container { 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column;
            background-image: url('../img/4.png'); /* ẢNH NỀN CHỜ KHI CHUYỂN TRANG */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Cấu hình iframe và hiệu ứng mờ */
        #content-page { 
            flex: 1; 
            border: none; 
            width: 100%; 
            background: transparent; 
            transition: opacity 0.4s ease-in-out; /* Hiệu ứng mượt mà */
            opacity: 1;
        }

        /* Bottom Navigation */
        .bottom-nav {
            height: 85px; 
            background: rgba(5, 5, 5, 0.95);
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            padding-bottom: 20px; 
            border-top: 1px solid #222;
            border-radius: 30px 30px 0 0; 
            box-shadow: 0 -10px 30px #000;
            z-index: 10;
        }

        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            text-decoration: none; color: #444; font-size: 10px; font-weight: 700; gap: 4px;
        }

        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        
        .center-btn {
    width: 55px;
    height: 55px;
    background: linear-gradient(135deg, #222, var(--blood));
    border-radius: 50%;
    margin-top: -45px;
    border: 3px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
    box-shadow: 0 5px 15px rgba(139, 0, 0, 0.5);
    cursor: pointer;
    position: relative;
    overflow: visible;
}

/* Vòng lửa */
.center-btn.active::before {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    background:
        conic-gradient(
            #ff4500,
            #ffae00,
            #ffff66,
            #ff4500,
            #ff0000
        );
    filter: blur(8px);
    animation: fireSpin 1s linear infinite;
    z-index: -1;
}

/* Ánh sáng lửa */
.center-btn.active::after {
    content: "";
    position: absolute;
    inset: -15px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255,140,0,.6),
        rgba(255,69,0,.2),
        transparent 70%
    );
    animation: firePulse .8s ease-in-out infinite alternate;
    z-index: -2;
}

@keyframes fireSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
}

@keyframes firePulse {
    from {
        transform: scale(0.95);
        opacity: .6;
    }
    to {
        transform: scale(1.15);
        opacity: 1;
    }
}
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Iframe load các trang chức năng -->
        <iframe src="b_ralenh.html" id="content-page"></iframe>

        <!-- Navi dành riêng cho Master -->
        <div class="bottom-nav" id="nav-bar">
            <a href="javascript:void(0)" onclick="loadSubPage('b_ralenh.html', this)" class="nav-item active">
                <i class="fa-solid fa-house"></i><span>Home</span>
            </a>
            <a href="javascript:void(0)" onclick="loadSubPage('b_banglenh.html', this)" class="nav-item">
                <i class="fa-solid fa-list-ul"></i><span>List</span>
            </a>
           <div class="center-btn"
     onclick="activateFire(this); loadSubPage('b_duyet.html', this)">
    <i class="fa-solid fa-gavel"></i>
</div>
            <a href="javascript:void(0)" onclick="loadSubPage('../bs_dalam.html', this)" class="nav-item">
                <i class="fa-solid fa-images"></i><span>Chung</span>
            </a>
            <a href="javascript:void(0)" onclick="loadSubPage('../bs_about.html', this)" class="nav-item">
                <i class="fa-solid fa-skull"></i><span>About</span>
            </a>
        </div>
    </div>

    <script>
        const contentFrame = document.getElementById('content-page');

        function loadSubPage(url, el) {
            // Nếu nhấn vào trang hiện tại đang mở thì không load lại
            if (contentFrame.src.includes(url)) return;

            // 1. Làm mờ iframe hiện tại để lộ ảnh img/4.png bên dưới
            contentFrame.style.opacity = '0';

            // 2. Thay đổi địa chỉ trang sau một khoảng nghỉ ngắn
            setTimeout(() => {
                contentFrame.src = url;
            }, 300);

            // 3. Cập nhật trạng thái active cho menu
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(el && !el.classList.contains('center-btn')) {
                el.classList.add('active');
            }
        }

        // 4. Khi nội dung trang mới đã tải xong hoàn toàn
        contentFrame.onload = function() {
            // Hiện iframe lên che ảnh nền img/4.png lại
            contentFrame.style.opacity = '1';
        };

        // Thiết lập trạng thái ban đầu
        document.addEventListener('DOMContentLoaded', () => {
            const initialHomeButton = document.querySelector('.bottom-nav .nav-item');
            if (initialHomeButton) {
                initialHomeButton.classList.add('active');
            }
        });
        function activateFire(btn) {
    document.querySelectorAll('.center-btn')
        .forEach(el => el.classList.remove('active'));

    btn.classList.add('active');
}
    </script>
</body>
</html>
