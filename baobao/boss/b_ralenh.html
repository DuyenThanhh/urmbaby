<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Supreme Authority - Master's Decree</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Quicksand:wght@500;700&family=Dancing+Script:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --master-red: #660000;
            --bright-red: #bd0000;
            --gold: #c5a059;
            --gold-glow: rgba(197, 160, 89, 0.5);
            --dark: #050505;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Quicksand', sans-serif;
            background: #000;
            color: #eee;
            overflow-x: hidden;
        }

        /* Nền tối thượng */
        .app-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('../img/3.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 20px;
            padding-bottom: 50px;
        }

        /* Thanh tiến trình uy quyền */
        .progress-container {
            width: 250px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid var(--gold);
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 15px var(--gold-glow);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--gold), var(--bright-red));
            box-shadow: 0 0 10px var(--bright-red);
            transition: width 0.3s ease;
        }

        .progress-text {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 14px;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        /* Header uy nghi */
        .header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        .header .crown-icon {
            color: var(--gold);
            font-size: 24px;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 10px var(--gold));
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 26px;
            color: var(--gold);
            margin: 0;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px #000;
        }

        .header p {
            font-family: 'Dancing Script', cursive;
            font-size: 18px;
            color: var(--bright-red);
            margin: 5px 0;
            opacity: 0.8;
        }

        /* Severity Selector - Kiểu Tab Quyền Lực */
        .severity-wrap {
            display: flex;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid #333;
            border-radius: 15px;
            margin-bottom: 25px;
            padding: 5px;
            box-shadow: inset 0 0 10px #000;
        }

        .sev-btn {
            flex: 1;
            padding: 12px 5px;
            font-size: 11px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            color: #888;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 700;
            letter-spacing: 1px;
        }

        .sev-btn.active {
            background: linear-gradient(135deg, var(--master-red), #330000);
            color: var(--gold);
            box-shadow: 0 0 15px rgba(102, 0, 0, 0.6);
            transform: scale(1.02);
        }

        /* Khung Thánh Chỉ (Decree Form) */
        .decree-form {
            background: rgba(10, 10, 10, 0.85);
            border-radius: 20px;
            padding: 25px;
            border-top: 2px solid var(--gold);
            border-bottom: 2px solid var(--gold);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            position: relative;
        }

        .decree-form::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(197, 160, 89, 0.1);
            border-radius: 15px;
            pointer-events: none;
        }

        .input-group {
            margin-bottom: 22px;
            position: relative;
            animation: slideUp 0.5s ease;
        }

        label {
            font-size: 11px;
            font-weight: 800;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 10px;
            padding-left: 5px;
        }

        /* Input & Textarea phong cách Dark Glass */
        input,
        textarea,
        select {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus,
        textarea:focus {
            border-color: var(--gold);
            background: rgba(20, 0, 0, 0.4);
            box-shadow: 0 0 10px rgba(197, 160, 89, 0.2);
        }

        /* Trạng thái Tuyệt đối */
        .absolute-mode {
            border: 2px solid var(--bright-red) !important;
            animation: pulseRed 2s infinite;
        }

        .reward-box {
            background: rgba(197, 160, 89, 0.05);
            border: 1px dashed var(--gold);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
        }

        /* Nút ban hành tối thượng */
        .btn-issue {
            width: 100%;
            padding: 20px;
            background: linear-gradient(135deg, var(--master-red), #330000);
            color: var(--gold);
            border: 1px solid var(--gold);
            border-radius: 50px;
            font-weight: 800;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: 30px;
            transition: 0.4s;
        }

        .btn-issue:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        /* Lock Overlay phong cách trang trọng */
        #lock-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.98);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #lock-overlay h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            letter-spacing: 5px;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseRed {
            0% {
                box-shadow: 0 0 20px rgba(189, 0, 0, 0.2);
            }

            50% {
                box-shadow: 0 0 40px rgba(189, 0, 0, 0.4);
            }

            100% {
                box-shadow: 0 0 20px rgba(189, 0, 0, 0.2);
            }
        }
    </style>
</head>

<body>

    <div class="app-container">
        <div class="content">
            <div class="header">
                <div class="crown-icon"><i class="fa-solid fa-crown"></i></div>
                <h1>UY QUYỀN CHỦ NHÂN</h1>
                <p>Mọi lời ban ra là một xiềng xích...</p>
            </div>

            <!-- CHỌN MỨC ĐỘ TRỊ VÌ -->
            <div class="severity-wrap">
                <div class="sev-btn active" onclick="updateForm('low', this)">KHUYÊN BẢO</div>
                <div class="sev-btn" onclick="updateForm('strict', this)">ÁP CHẾ</div>
                <div class="sev-btn" onclick="updateForm('absolute', this)">XIỀNG XÍCH</div>
            </div>

            <!-- NỘI DUNG THÁNH CHỈ -->
            <div class="decree-form" id="dynamic-form">
                <!-- JS render nội dung ở đây -->
            </div>

            <button class="btn-issue" onclick="issueCommand()">
                <i class="fa-solid fa-scroll"></i> KHAI ẤN & BAN LỆNH
            </button>
        </div>
    </div>

    <!-- MÀN HÌNH NIÊM PHONG -->
    <div id="lock-overlay">
        <div style="position:relative">
            <i class="fa-solid fa-circle-notch fa-spin"
                style="font-size:100px; color:var(--master-red); opacity:0.3;"></i>
            <i class="fa-solid fa-scroll"
                style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:40px; color:var(--gold);"></i>
        </div>
        <h2 id="lock-status-text" style="margin-top: 30px;">ĐANG SOẠN THÁNH CHỈ...</h2>

        <div class="progress-container">
            <div id="p-bar" class="progress-bar"></div>
        </div>
        <div id="p-text" class="progress-text">0%</div>

        <p style="color:var(--gold); font-size:12px; letter-spacing:2px; opacity:0.6; margin-top: 20px;">
            LỜI NÓI ĐÃ TRỞ THÀNH LUẬT LỆ
        </p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";
        const firebaseConfig = {
            apiKey: "AIzaSyB-Zj-83s3GW09RkAhMS4H8xWmLdi7loSI",
            authDomain: "photodiary-3d469.firebaseapp.com",
            projectId: "photodiary-3d469",
            storageBucket: "photodiary-3d469.firebasestorage.app",
            messagingSenderId: "102477469911",
            appId: "1:102477469911:web:13ed38ab426819fdb43892"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentLevel = 'low';

        window.updateForm = (level, el) => {
            currentLevel = level;
            document.querySelectorAll('.sev-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');

            const form = document.getElementById('dynamic-form');
            form.classList.remove('absolute-mode');

            let html = `
                <div class="input-group">
                    <label><i class="fa-solid fa-pen-nib"></i> Nội dung mệnh lệnh</label>
                    <textarea id="task-action" rows="3" placeholder="Nô lệ phải thực hiện..."></textarea>
                </div>
                <div class="input-group">
                    <label><i class="fa-solid fa-hourglass-half"></i> Thời hạn hoàn tất</label>
                    <input type="datetime-local" id="task-deadline">
                </div>
            `;

            if (level === 'strict' || level === 'absolute') {
                html += `
                    <div class="input-group">
                        <label><i class="fa-solid fa-person-praying"></i> Tư thế & Trạng thái</label>
                        <input type="text" id="task-status" placeholder="VD: Quỳ gối, không mặc đồ...">
                    </div>
                    <div class="input-group">
                        <label><i class="fa-solid fa-camera"></i> Minh chứng thực thi</label>
                        <select id="task-proof">
                            <option value="Ảnh chụp">Hình ảnh hiện trường</option>
                            <option value="Video">Video ghi hình toàn cảnh</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label style="color:var(--bright-red)"><i class="fa-solid fa-triangle-exclamation"></i> Hình phạt nếu chậm trễ</label>
                        <textarea id="task-punish" rows="2" placeholder="Cái giá của sự chậm chạp..."></textarea>
                    </div>
                `;
            }

            if (level === 'absolute') {
                form.classList.add('absolute-mode');
                html += `
                    <div class="input-group">
                        <label><i class="fa-solid fa-comment-dots"></i> Khẩu quyết (Mantra)</label>
                        <input type="text" id="task-mantra" placeholder="Câu nói nô lệ phải lặp lại khi làm...">
                    </div>
                    <div class="input-group">
                        <label style="color:#ff4d4d"><i class="fa-solid fa-skull"></i> HẬU QUẢ TÀN KHỐC</label>
                        <textarea id="task-extreme-punish" rows="2" placeholder="Nếu dám phản kháng hoặc nói dối..."></textarea>
                    </div>
                    <div class="reward-box">
                        <label style="color:var(--gold)"><i class="fa-solid fa-gem"></i> PHƯỚC LÀNH CỦA CHỦ NHÂN</label>
                        <input type="text" id="task-reward" placeholder="Phần thưởng cho sự tận tụy...">
                    </div>
                `;
            }

            form.innerHTML = html;
        };

        updateForm('low', document.querySelector('.sev-btn'));

        window.issueCommand = async () => {
            const action = document.getElementById('task-action').value;
            const deadline = document.getElementById('task-deadline').value;

            if (!action || !deadline) return alert("Chủ nhân chưa soạn xong thánh chỉ!");

            // Hiện overlay và reset thanh tiến trình
            const overlay = document.getElementById('lock-overlay');
            const progressBar = document.getElementById('p-bar');
            const progressText = document.getElementById('p-text');
            const statusText = document.getElementById('lock-status-text');

            overlay.style.display = 'flex';
            progressBar.style.width = '0%';
            progressText.innerText = '0%';
            statusText.innerText = "ĐANG KHẮC ẤN...";

            // 1. Dữ liệu
            const now = new Date();
            const dd = String(now.getDate()).padStart(2, '0');
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const yyyy = now.getFullYear();
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');

            const userName = (localStorage.getItem('appUser') || 'vo_danh').normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_').toLowerCase();
            const shortAction = action.substring(0, 10).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_').toLowerCase();
            const customDocId = `${dd}-${mm}-${yyyy}_${userName}_${shortAction}_${currentLevel.toUpperCase()}_${hh}-${min}-${ss}`;

            const data = {
                master: localStorage.getItem('appUser'),
                action,
                deadline,
                level: currentLevel,
                status: "LOCKED",
                created_at: Date.now(),
                doc_id: customDocId,
                status_req: document.getElementById('task-status')?.value || "",
                proof_type: document.getElementById('task-proof')?.value || "",
                punishment: document.getElementById('task-punish')?.value || "",
                mantra: document.getElementById('task-mantra')?.value || "",
                extreme_punish: document.getElementById('task-extreme-punish')?.value || "",
                reward: document.getElementById('task-reward')?.value || ""
            };

            // 2. Chạy thanh tiến trình ảo lên 90%
            let progress = 0;
            const interval = setInterval(() => {
                if (progress < 90) {
                    progress += Math.random() * 15; // Tăng ngẫu nhiên cho thật
                    if (progress > 90) progress = 90;
                    progressBar.style.width = progress + '%';
                    progressText.innerText = Math.floor(progress) + '%';
                }
            }, 200);

            try {
                // 3. Gửi dữ liệu lên Firebase
                await setDoc(doc(db, "boss_ra_lenh", customDocId), data);

                // 4. Hoàn tất 100%
                clearInterval(interval);
                progressBar.style.width = '100%';
                progressText.innerText = '100%';
                statusText.innerText = "THÁNH CHỈ ĐÃ NIÊM PHONG!";
                statusText.style.color = "var(--gold)";

                setTimeout(() => {
                    overlay.style.display = 'none';
                    alert("Mệnh lệnh tối thượng đã được ban ra!");
                    const activeBtn = document.querySelector('.sev-btn.active');
            updateForm(currentLevel, activeBtn);
                }, 1000);

            } catch (e) {
                clearInterval(interval);
                console.error("Lỗi: ", e);
                alert("Lệnh gửi bị gián đoạn! Hãy thử lại.");
                overlay.style.display = 'none';
            }
        };
    </script>
</body>

</html>
