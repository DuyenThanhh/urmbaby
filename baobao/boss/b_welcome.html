<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; background: transparent;
            font-family: 'Quicksand', sans-serif; color: #d4af37; text-align: center;
            padding: 20px; box-sizing: border-box;
        }
        h2 { 
            font-size: 20px; text-transform: uppercase; letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5); margin-bottom: 10px;
        }
        p { font-size: 14px; color: #8b0000; font-style: italic; opacity: 0.8; }
    </style>
</head>
<body>
    <h2>UY QUYỀN TỐI THƯỢNG</h2>
    <p>"Chủ Nhân có toàn quyền quyết định số phận của Người phục tùng"</p>
    <p style="font-size: 10px; margin-top: 20px; color: #444;">Mọi lời ban ra là một xiềng xích...</p>
</body>
</html>
