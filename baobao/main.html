<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blood: #8b0000; --gold: #d4af37; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Quicksand', sans-serif; background: transparent; overflow: hidden; }
        
        .main-container { width: 100%; height: 100%; display: flex; flex-direction: column; }
        #content-page { flex: 1; border: none; width: 100%; background: transparent; }

        /* Bottom Navigation */
        .bottom-nav {
            height: 85px; background: rgba(5, 5, 5, 0.95);
            display: flex; justify-content: space-around; align-items: center;
            padding-bottom: 20px; border-top: 1px solid #222;
            border-radius: 30px 30px 0 0; box-shadow: 0 -10px 30px #000;
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center;
            text-decoration: none; color: #444; font-size: 10px; font-weight: 700; gap: 4px;
        }
        .nav-item i { font-size: 20px; }
        .nav-item.active { color: var(--gold); text-shadow: 0 0 10px var(--gold); }
        
        .center-btn {
            width: 55px; height: 55px; background: linear-gradient(135deg, #222, var(--blood));
            border-radius: 50%; margin-top: -45px; border: 3px solid #000;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-size: 22px; box-shadow: 0 5px 15px rgba(139, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Iframe con để load các trang chức năng -->
        <iframe src="s_doilenh.html" id="content-page"></iframe>

        <!-- Navi linh hoạt -->
        <div class="bottom-nav" id="nav-bar"></div>
    </div>

    <script>
        const contentFrame = document.getElementById('content-page');

        function loadSubPage(url, el) {
            // Hiệu ứng mờ chuyển trang
            contentFrame.style.opacity = '0';
            setTimeout(() => {
                // Nếu bấm vào About thì cho quay lại index (Đăng xuất)
                
                contentFrame.src = url;
                contentFrame.style.opacity = '1';
            }, 200);

            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            if(el) el.classList.add('active');
        }

        function renderMenu() {
            const role = localStorage.getItem('appRole');
            const nav = document.getElementById('nav-bar');
            
            if (role === 'slave') {
                nav.innerHTML = `
                    <a href="javascript:void(0)" onclick="loadSubPage('s_doilenh.html', this)" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
                    <a href="javascript:void(0)" onclick="loadSubPage('s_submission.html', this)" class="nav-item"><i class="fa-solid fa-upload"></i><span>Nộp</span></a>
                    <div class="center-btn" onclick="loadSubPage('s_thuongphat.html', this)"><i class="fa-solid fa-gift"></i></div>
                    <a href="javascript:void(0)" onclick="loadSubPage('bs_dalam.html', this)" class="nav-item"><i class="fa-solid fa-images"></i><span>Chung</span></a>
                    <a href="javascript:void(0)" onclick="loadSubPage('bs_about.html', this)" class="nav-item"><i class="fa-solid fa-skull"></i><span>About</span></a>
                `;
            } else {
                nav.innerHTML = `
                    <a href="javascript:void(0)" onclick="loadSubPage('b_ralenh.html', this)" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
                    <a href="javascript:void(0)" onclick="loadSubPage('b_banglenh.html', this)" class="nav-item"><i class="fa-solid fa-list-ul"></i><span>List</span></a>
                    <div class="center-btn" onclick="loadSubPage('b_duyet.html', this)"><i class="fa-solid fa-gavel"></i></div>
                    <a href="javascript:void(0)" onclick="loadSubPage('bs_dalam.html', this)" class="nav-item"><i class="fa-solid fa-images"></i><span>Chung</span></a>
                    <a href="javascript:void(0)" onclick="loadSubPage('bs_about.html', this)" class="nav-item"><i class="fa-solid fa-crown"></i><span>About</span></a>
                `;
            }
        }

        window.onload = renderMenu;
    </script>
</body>
</html>
