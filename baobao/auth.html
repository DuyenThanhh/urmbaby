<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Khế Ước Thành Thật ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --master-red: #b71c1c; --gold: #d4af37; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Quicksand', sans-serif; background: transparent; color: #fff; overflow: hidden; }
        
        .app-container {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.6); 
        }

        .auth-card {
            width: 85%; text-align: center; padding: 35px 25px;
            background: rgba(10, 10, 10, 0.85); backdrop-filter: blur(15px);
            border-radius: 40px; border: 1px solid rgba(183, 28, 28, 0.4);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 { font-family: 'Dancing Script', cursive; font-size: 32px; color: var(--master-red); margin-bottom: 5px; }
        .subtitle { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.6; margin-bottom: 30px; display: block; }

        .input-group { text-align: left; margin-bottom: 20px; }
        label { font-size: 12px; font-weight: 700; color: var(--master-red); margin-left: 10px; margin-bottom: 8px; display: block; }
        
        input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid #333;
            border-radius: 15px; padding: 15px; color: #fff; font-family: inherit;
            outline: none; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { border-color: var(--master-red); background: rgba(255,255,255,0.1); }

        #role-info {
            font-size: 12px; margin-top: -10px; margin-bottom: 20px;
            font-weight: 700; color: var(--gold); display: none;
            animation: fadeIn 0.5s;
        }

        .btn-login {
            width: 100%; padding: 18px; background: var(--master-red);
            color: #fff; border: none; border-radius: 20px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(183, 28, 28, 0.4); margin-top: 10px;
        }
        .btn-login:active { transform: scale(0.95); }

        @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="auth-card">
            <h1>The Sacred Bond</h1>
            <span class="subtitle">Khế ước thành thật</span>

            <div class="input-group">
                <label><i class="fa-solid fa-user"></i> Danh xưng (Username)</label>
                <input type="text" id="username" placeholder="Nhập tên của bé..." oninput="checkUser()">
            </div>

            <div id="role-info"></div>

            <div class="input-group">
                <label><i class="fa-solid fa-lock"></i> Mật mã riêng tư</label>
                <input type="password" id="password" placeholder="Mật mã này chỉ bé biết...">
            </div>

            <button class="btn-login" onclick="handleAuth()">Xác Nhận Khế Ước ✨</button>
            <p id="msg" style="font-size: 10px; margin-top: 15px; opacity: 0.5;"></p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-Zj-83s3GW09RkAhMS4H8xWmLdi7loSI",
            authDomain: "photodiary-3d469.firebaseapp.com",
            projectId: "photodiary-3d469",
            storageBucket: "photodiary-3d469.firebasestorage.app",
            messagingSenderId: "102477469911",
            appId: "1:102477469911:web:13ed38ab426819fdb43892"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 1. Kiểm tra vai trò dựa trên danh xưng
        window.checkUser = () => {
            const user = document.getElementById('username').value.trim();
            const roleInfo = document.getElementById('role-info');
            if (user.toLowerCase() === "duyen" || user.toLowerCase() === "duyên") {
                roleInfo.innerHTML = `<i class="fa-solid fa-heart"></i> Thân phận: Người phục tùng`;
                roleInfo.style.display = "block";
            } else if (user.length > 0) {
                roleInfo.innerHTML = `<i class="fa-solid fa-crown"></i> Thân phận: Chủ nhân`;
                roleInfo.style.display = "block";
            } else {
                roleInfo.style.display = "none";
            }
        };

        // 2. Xử lý Đăng nhập / Đăng ký
        window.handleAuth = async () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (!user || !pass) return alert("Bé nhập đủ tên và mật mã nhé!");

            // Xác định vai trò tự động
            let role = (user.toLowerCase() === "duyen" || user.toLowerCase() === "duyên") ? "slave" : "boss";

            try {
                const userRef = doc(db, "bossslave", user.toLowerCase());
                const snap = await getDoc(userRef);

                if (snap.exists()) {
                    const userData = snap.data();
                    if (userData.password === pass) {
                        loginSuccess(user, userData.role);
                    } else {
                        alert("Mật mã không đúng rồi bé ơi! 🥺");
                    }
                } else {
                    await setDoc(userRef, {
                        username: user,
                        password: pass,
                        role: role,
                        created_at: Date.now()
                    });
                    alert("Khế ước mới đã được tạo thành công! ✨");
                    loginSuccess(user, role);
                }
            } catch (e) {
                console.error(e);
                alert("Lỗi kết nối khế ước rồi!");
            }
        };

        // 3. Hàm chuyển trang theo vai trò
        function loginSuccess(name, role) {
            localStorage.setItem('appUser', name);
            localStorage.setItem('appRole', role);
            
            // LOGIC CHUYỂN TRANG RIÊNG BIỆT
            if (role === 'boss') {
                window.location.href = 'index.html';
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
