<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Sám Hối - Nơi Quỳ Xuống</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;1,500&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #020202;
            background-image: radial-gradient(circle at center, #1a0505 0%, #020202 100%);
            color: #bfa181; /* Màu vàng đồng cũ */
            font-family: 'EB Garamond', serif;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Hiệu ứng màng sương đen tối bao quanh */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, black 150%);
            pointer-events: none;
            z-index: 10;
        }

        .master-header {
            font-family: 'Cinzel Decorative', cursive;
            text-align: center;
            padding: 40px 20px 20px;
            letter-spacing: 3px;
        }

        .master-header h1 {
            font-size: 1.8rem;
            color: #8b0000; /* Màu đỏ máu */
            text-shadow: 0 0 15px rgba(139, 0, 0, 0.7);
            margin-bottom: 5px;
        }

        .master-header p {
            font-style: italic;
            font-size: 0.9rem;
            opacity: 0.6;
        }

        /* Vòng Tròn Phục Tùng - Trái Tim Nô Lệ */
        .heart-of-submission {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: url('https://www.transparenttextures.com/patterns/dark-leather.png'), #000;
            border: 4px double #4a0000;
            box-shadow: inset 0 0 30px #000, 0 0 20px rgba(139, 0, 0, 0.5);
            animation: heartbeat 2s infinite ease-in-out;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(139, 0, 0, 0.5); }
            5% { transform: scale(1.05); }
            10% { transform: scale(1); }
            15% { transform: scale(1.03); }
            100% { transform: scale(1); box-shadow: 0 0 40px rgba(139, 0, 0, 0.2); }
        }

        .loyalty-percent {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 3.5rem;
            font-weight: 900;
            color: #eee;
            text-shadow: 2px 2px 10px #000;
            line-height: 1;
        }

        /* Danh sách xiềng xích (Hình phạt) */
        .chain-list {
            position: relative;
            padding: 0 25px;
            z-index: 20;
        }

        .section-title {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 0.8rem;
            color: #4a4a4a;
            border-bottom: 1px solid #2a0000;
            padding-bottom: 5px;
            margin: 30px 0 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .punishment-card {
            background: linear-gradient(90deg, #120000 0%, #050505 100%);
            border: 1px solid #2a0000;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
            overflow: hidden;
        }

        .punishment-card::before {
            content: "FAILED";
            position: absolute;
            right: -10px;
            top: 5px;
            font-size: 2rem;
            font-weight: 900;
            color: rgba(139, 0, 0, 0.1);
            transform: rotate(-15deg);
        }

        .blessing-card {
            background: linear-gradient(90deg, #001200 0%, #050505 100%);
            border: 1px solid #002a00;
            padding: 15px;
            margin-bottom: 15px;
        }

        .task-action {
            color: #d1d1d1;
            font-size: 1rem;
            margin-bottom: 5px;
            display: block;
        }

        .task-detail {
            font-size: 0.85rem;
            color: #8b0000; /* Đỏ cho hình phạt */
            font-style: italic;
        }

        .blessing-card .task-detail {
            color: #008b45; /* Xanh cho ân huệ */
        }

        /* Thanh trạng thái loading Slave */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        
        .loading-text {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 0.7rem;
            letter-spacing: 5px;
            color: #4a0000;
            animation: blink 1.5s infinite;
        }

        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="loading-text">ĐANG KHAI TRÌNH TỘI LỖI...</div>
    </div>

    <div class="master-header">
        <h1>BẢN GHI NHẬN NHỤC HÌNH</h1>
        <p>"Mọi hành động đều nằm trong tầm mắt Chủ nhân"</p>
    </div>

    <!-- Trái tim nô lệ: Nơi hiển thị % trung thành -->
    <div class="heart-of-submission">
        <div class="text-[10px] tracking-[4px] uppercase opacity-40">Khuất phục</div>
        <div class="loyalty-percent" id="loyalty-val">0</div>
        <div class="text-[14px] mt-[-5px] opacity-80 uppercase font-bold text-[#8b0000]">%</div>
        <div class="text-[9px] mt-2 italic text-gray-500" id="task-stats">0/0 Đã hoàn thành</div>
    </div>

    <div class="chain-list pb-24">
        <!-- ÁN PHẠT -->
        <h2 class="section-title">Gông Cùm & Hình Phạt</h2>
        <div id="punishments">
            <!-- Data -->
        </div>

        <!-- ÂN HUỆ -->
        <h2 class="section-title">Ân Huệ Hiếm Hoi</h2>
        <div id="blessings">
            <!-- Data -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
            apiKey: "AIzaSyB-Zj-83s3GW09RkAhMS4H8xWmLdi7loSI",
            authDomain: "photodiary-3d469.firebaseapp.com",
            projectId: "photodiary-3d469",
            storageBucket: "photodiary-3d469.firebasestorage.app",
            messagingSenderId: "102477469911",
            appId: "1:102477469911:web:13ed38ab426819fdb43892"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchSlaveHistory() {
            try {
                const querySnapshot = await getDocs(collection(db, "slave_tasks"));
                let total = 0, success = 0;
                let punHTML = '', blessHTML = '';

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    total++;
                    if(data.status === "SUCCESS") {
                        success++;
                        blessHTML += `
                            <div class="blessing-card">
                                <span class="task-action">◈ ${data.action}</span>
                                <div class="task-detail">Ân huệ: ${data.reward || 'Được phép tiếp tục phục vụ'}</div>
                            </div>`;
                    } else if(data.status === "FAILED") {
                        punHTML += `
                            <div class="punishment-card">
                                <span class="task-action">◈ ${data.action}</span>
                                <div class="task-detail">Hình phạt: ${data.punishment || 'Chờ nhục hình mới'}</div>
                                <div class="text-[10px] mt-2 opacity-30 text-right uppercase tracking-tighter">
                                    Trạng thái: ${data.status_req}
                                </div>
                            </div>`;
                    }
                });

                document.getElementById('loyalty-val').innerText = total > 0 ? Math.round((success/total)*100) : 0;
                document.getElementById('task-stats').innerText = `${success}/${total} Kiếp nạn đã qua`;
                document.getElementById('punishments').innerHTML = punHTML || '<p class="text-center opacity-20 italic">Chưa có tội lỗi nào bị lộ...</p>';
                document.getElementById('blessings').innerHTML = blessHTML || '<p class="text-center opacity-20 italic">Chưa xứng đáng nhận ân huệ...</p>';

            } catch (e) { console.error(e); }
            finally { document.getElementById('loading-overlay').style.display = 'none'; }
        }
        fetchSlaveHistory();
    </script>
</body>
</html>
