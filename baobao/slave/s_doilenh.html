<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hành Lang Phục Tùng - Dark Majesty</title>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Quicksand:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blood: #8b0000;
            --gold: #d4af37;
            --dark: #050505;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Quicksand', sans-serif;
            background: #000;
            color: #eee;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            min-height: 100vh;
            background: url('../img/9.png') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(0, 0, 0, 0.3) 0%, rgba(0, 0, 0, 0.9) 100%);
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            padding: 20px;
        }

        /* BOX LỜI THỀ - GIỮ NGUYÊN NỘI DUNG CỦA BẠN */
        .oath-container {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--blood);
            padding: 20px;
            margin: 10px 0 30px 0;
            border-radius: 5px;
            box-shadow: inset 0 0 15px var(--blood);
            position: relative;
        }

        .oath-container::before {
            content: "⛓⛓⛓";
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--blood);
            letter-spacing: 5px;
        }


        /* DANH SÁCH LỆNH - NỀN IMG/4.PNG */
        .decree-card {
            background: url('../img/4.png') no-repeat center center;
            background-size: cover;
            margin-bottom: 40px;
            padding: 30px 20px;
            position: relative;
            /* Hiệu ứng tờ giấy rách rưới */
            clip-path: polygon(2% 0%, 98% 1%, 100% 4%, 99% 95%, 95% 100%, 5% 99%, 0% 95%, 1% 5%);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s ease;
        }

        /* ĐỒNG HỒ XOAY MAN RỢ */
        .ghastly-clock {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 55px;
            height: 55px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--blood);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--blood);
        }

        .ghastly-clock i {
            font-size: 28px;
            color: var(--blood);
            /* Xoay giật cục như phim kinh dị */
            animation: clock-spin 2s steps(8) infinite;
        }

        @keyframes clock-spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .countdown-text {
            position: absolute;
            top: 75px;
            right: 12px;
            font-family: 'Pirata One', cursive;
            font-size: 12px;
            color: var(--blood);
            text-shadow: 0 0 5px #fff;
        }

        /* NỘI DUNG */
        .action-title {
            font-family: 'Pirata One', cursive;
            font-size: 26px;
            color: #1a1a1a;
            /* Chữ tối trên giấy sáng */
            margin: 0 0 15px 0;
            line-height: 1.1;
            padding-right: 50px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            padding-bottom: 10px;
        }

        .detail-row {
            font-size: 13px;
            color: #333;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .detail-row i {
            color: var(--blood);
            margin-right: 8px;
            width: 15px;
        }

        .punishment-alert {
            background: rgba(139, 0, 0, 0.9);
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            margin-top: 15px;
            font-size: 12px;
            border: 1px solid var(--gold);
        }

        .punishment-alert b {
            color: var(--gold);
            display: block;
            margin-bottom: 3px;
        }

        /* NÚT DÂNG NỘP */
        .btn-obey {
            width: 100%;
            background: #000;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 14px;
            font-family: 'Pirata One', cursive;
            font-size: 22px;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
        }

        .oath-box {
            border: 2px solid #333;
            padding: 25px;
            position: relative;
            background: rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        /* Hiệu ứng 4 chiếc đinh ở 4 góc */
        .oath-box {
            position: relative;
            padding: 30px;
            background: #1a1a1a;
            border: 1px solid var(--gold);
            /* Tạo hiệu ứng góc rách bằng clip-path */
            clip-path: polygon(5% 0%, 95% 2%, 100% 5%, 98% 95%, 93% 100%, 5% 98%, 0% 90%, 2% 10%);
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.9);
            margin: 20px;
        }

        .oath-text {
            font-family: 'Quicksand', sans-serif;
            font-style: italic;
            color: #ccc;
            line-height: 1.6;
            font-size: 14px;
            text-align: center;
            border-left: 2px solid var(--blood);
            padding-left: 15px;
        }

        .warning-label {
            display: block;
            margin-top: 20px;
            font-family: 'Pirata One', cursive;
            color: var(--blood);
            font-size: 18px;
            letter-spacing: 3px;
            text-align: center;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }


        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        .oath-text {
            animation: pulse 4s infinite ease-in-out;
        }

        .btn-obey:active {
            background: var(--gold);
            color: #d70d0d;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Style cho Khẩu quyết (Mantra) */
        .mantra-box {
            background: rgba(255, 255, 255, 0.1);
            border-left: 3px solid var(--gold);
            padding: 10px;
            margin: 10px 0;
            font-style: italic;
            font-size: 13px;
            color: #eee;
        }

        /* Style cho Hậu quả tàn khốc */
        .extreme-punish-box {
            background: #000;
            border: 2px solid var(--blood);
            color: #ff4d4d;
            padding: 12px;
            border-radius: 4px;
            margin-top: 10px;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 800;
            animation: pulseRed 2s infinite;
        }

        /* Style cho Phước lành */

        @keyframes pulseRed {
            0% {
                box-shadow: 0 0 5px var(--blood);
            }

            50% {
                box-shadow: 0 0 20px var(--blood);
            }

            100% {
                box-shadow: 0 0 5px var(--blood);
            }
        }

        /* Giao diện Đàn Tế hiện đè lên */


        /* OVERLAY ĐÀN TẾ RỰC LỬA */
        /* --- HIỆU ỨNG XIỀNG XÍCH RUNG LẮC (LOADING) --- */
        #loading-ritual {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10001;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .chains-shaking {
            font-size: 50px;
            color: var(--blood);
            animation: ritual-shake 0.2s infinite;
        }

        @keyframes ritual-shake {
            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(3px);
            }

            75% {
                transform: translateX(-3px);
            }
        }

        /* --- ĐÀN TẾ HIẾN TẾ (OVERLAY) --- */
        #submission-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0.9)), url('../img/5.png');
            background-size: cover;
            z-index: 10000;
            padding: 20px;
            overflow-y: auto;
        }

        .sacrifice-altar {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #222;
            padding: 25px;
            max-width: 400px;
            margin: 20px auto;
            clip-path: polygon(2% 0%, 98% 1%, 100% 4%, 99% 96%, 95% 100%, 5% 99%, 0% 95%, 1% 5%);
            box-shadow: 0 0 50px #000;
        }

        /* --- NÚT BẤM RỰC LỬA (MIRROR + FLAME) --- */
        .btn-sacrifice {
            width: 100%;
            padding: 20px;
            background: var(--blood);
            color: #fff;
            border: none;
            font-family: 'Pirata One';
            font-size: 26px;
            letter-spacing: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.5);
        }

        .btn-sacrifice::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, transparent 70%);
            animation: flameRotate 4s linear infinite;
        }

        @keyframes flameRotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .sacrifice-altar {
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #222;
            padding: 25px;
            position: relative;
            max-width: 400px;
            margin: 20px auto;
            clip-path: polygon(2% 0%, 98% 1%, 100% 4%, 99% 96%, 95% 100%, 5% 99%, 0% 95%, 1% 5%);
            box-shadow: 0 0 30px #000;
        }

        .label-ritual {
            font-family: 'Pirata One';
            font-size: 14px;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0 10px;
        }

        .label-ritual::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, var(--gold), transparent);
        }

        #sub-title {
            font-size: 22px;
            color: #eee;
            padding: 10px;
            margin-bottom: 10px;
            background: rgba(139, 0, 0, 0.1);
            border-left: 3px solid var(--blood);
        }

        .ritual-upload {
            width: 100%;
            height: 200px;
            background: #000;
            border: 1px double #333;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .ritual-upload img,
        .ritual-upload video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #ritual-confession {
            width: 100%;
            background: transparent;
            border: none;
            outline: none;
            border-bottom: 1px solid #333;
            color: #fff;
            font-family: 'Quicksand';
            padding: 10px 0;
        }

        .preview-box {
            width: 100%;
            min-height: 200px;
            border: 1px dashed var(--gold);
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .preview-box img,
        .preview-box video {
            max-width: 100%;
            max-height: 300px;
        }

        .btn-back-sub {
            color: var(--gold);
            cursor: pointer;
            font-family: 'Pirata One';
            font-size: 18px;
        }

        /* NÚT DÂNG NỘP RỰC LỬA & QUÉT GƯƠNG */
        .btn-sacrifice-ritual {
            width: 100%;
            padding: 18px;
            background: linear-gradient(145deg, #8b0000, #4a0000);
            color: var(--gold);
            border: 1px solid var(--gold);
            font-family: 'Pirata One', cursive;
            font-size: 26px;
            letter-spacing: 4px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            /* Để hiệu ứng gương không tràn ra ngoài */
            transition: 0.5s;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.6);
            text-transform: uppercase;
        }

        /* HIỆU ỨNG QUÉT GƯƠNG (MIRROR SWEEP) */
        .btn-sacrifice-ritual::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right,
                    transparent,
                    rgba(212, 175, 55, 0.4),
                    transparent);
            transform: skewX(-45deg);
            transition: 0s;
        }

        .btn-sacrifice-ritual:hover::before {
            left: 150%;
            transition: 0.8s;
        }

        /* HIỆU ỨNG NHỊP ĐẬP RỰC LỬA */
        .btn-sacrifice-ritual:active {
            transform: scale(0.95);
            box-shadow: 0 0 40px var(--blood);
        }

        /* NÚT LUI LẠI (STYLE GOTHIC) */
        .btn-back-ritual {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 25px;
            border: 1px solid #333;
            color: #555;
            font-family: 'Pirata One', cursive;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.02);
            clip-path: polygon(10% 0, 90% 0, 100% 50%, 90% 100%, 10% 100%, 0 50%);
        }

        .btn-back-ritual:hover {
            color: var(--gold);
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        /* Textarea kiểu da thuộc */
        #ritual-confession {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #222;
            border-bottom: 1px solid var(--blood);
            color: #ccc;
            font-family: 'Quicksand';
            padding: 12px;
            margin-top: 10px;
            outline: none;
            transition: 0.3s;
        }

        #ritual-confession:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(139, 0, 0, 0.3);
        }
    </style>
</head>

<body>
   <!-- MÀN HÌNH XIỀNG XÍCH -->
<div id="loading-ritual">
    <div class="chains-shaking"><i class="fa-solid fa-link"></i></div>
    <p style="font-family: 'Pirata One'; color: var(--blood); margin-top: 20px; font-size: 20px; letter-spacing: 5px;">
        ĐANG TRUYỀN LINH HỒN...
    </p>
</div>

<!-- ĐÀN TẾ HIẾN TẾ -->
<div id="submission-overlay">
    <div style="text-align: center; margin-bottom: 20px;">
        <h1 style="font-family: 'Pirata One'; color: var(--blood); font-size: 45px; margin: 0; text-shadow: 0 0 20px red;">HIẾN TẾ</h1>
        <p style="color: var(--gold); font-size: 10px; letter-spacing: 4px;">SACRIFICE OF EVIDENCE</p>
    </div>

    <div class="sacrifice-altar">
        <div class="label-ritual"><i class="fa-solid fa-scroll"></i> Mệnh lệnh</div>
        <div id="sub-title" style="color: #eee; font-size: 20px; padding: 10px; background: rgba(139,0,0,0.1); border-left: 2px solid var(--blood); margin-bottom: 20px;"></div>

        <div class="label-ritual"><i class="fa-solid fa-eye"></i> Vật chứng</div>
        <div class="ritual-upload" onclick="document.getElementById('file-input').click()" style="width:100%; height:200px; background:#000; border:1px double #333; display:flex; align-items:center; justify-content:center; overflow:hidden;">
            <i class="fa-solid fa-skull" id="skull-icon" style="font-size: 40px; color: #222;"></i>
            <div id="preview-area" style="width:100%; height:100%; display:none;"></div>
        </div>
        <input type="file" id="file-input" hidden accept="image/*,video/*">

        <div class="label-ritual" style="margin-top:20px;"><i class="fa-solid fa-pen-nib"></i> Lời tự thú</div>
        <textarea id="ritual-confession" rows="3" style="width:100%; background:transparent; border:none; border-bottom:1px solid #333; color:#fff; outline:none;" placeholder="Viết những lời hối lỗi..."></textarea>

        <button class="btn-sacrifice" id="btn-final-submit" style="display:none;">DÂNG NỘP NGAY</button>

        <div id="gps-status" style="font-size: 9px; text-align: center; margin-top: 15px; color: #444;">
            <i class="fa-solid fa-location-crosshairs"></i> VỊ TRÍ: <span style="color: var(--blood); font-weight: bold;">ĐANG KHÓA...</span>
        </div>

        <div onclick="document.getElementById('submission-overlay').style.display='none'" style="text-align:center; margin-top:20px; color:#444; font-size:12px; text-decoration:underline; cursor:pointer;">
            LUI LẠI HÀNH LANG
        </div>
    </div>
</div>
    <div class="app-container">
        <div class="overlay"></div>
        <div class="content">

            <!-- GIỮ NGUYÊN LỜI THỀ CỦA BẠN -->
            <div class="oath-box">
                <div class="oath-text">
                    "Thân phận phục tùng đồng nghĩa với việc đáp ứng mọi mệnh lệnh từ chủ nhân đưa ra. Sự im lặng là lời
                    đồng ý duy nhất."
                </div>
                <span class="warning-label">KHÔNG CÓ QUYỀN KHƯỚC TỪ</span>
            </div>

            <div id="task-list">
                <!-- Dữ liệu đổ từ Firebase -->
                <div style="text-align: center; padding: 50px; font-family: 'Pirata One'; font-size: 20px;">
                    Đang triệu hồi khế ước...
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        // SỬA: Thêm doc, setDoc, updateDoc vào đây
        import { getFirestore, collection, onSnapshot, query, orderBy, doc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-Zj-83s3GW09RkAhMS4H8xWmLdi7loSI",
            authDomain: "photodiary-3d469.firebaseapp.com",
            projectId: "photodiary-3d469",
            storageBucket: "photodiary-3d469.firebasestorage.app",
            messagingSenderId: "102477469911",
            appId: "1:102477469911:web:13ed38ab426819fdb43892"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // SỬA: Khai báo đầy đủ các biến toàn cục
        let currentId = '';
        let currentAction = '';
        let realLocation = null;

        const q = query(collection(db, "slave_tasks"), orderBy("created_at", "desc"));

        onSnapshot(q, (snap) => {
            const list = document.getElementById('task-list');
            let html = "";
            if (snap.empty) {
                list.innerHTML = `<div style="text-align:center; padding:50px; font-family:'Pirata One'; color:var(--gold);">KHÔNG CÓ CHỈ THỊ NÀO</div>`;
                return;
            }

            snap.forEach(docSnap => {
                const data = docSnap.data();
                if (data.status !== "LOCKED") return;

                const action = data.action || "Mệnh lệnh tối mật";
                const level = (data.level || "low").toUpperCase();
                const deadline = data.deadline;

                let cardHtml = `
                <div class="decree-card">
                    <div class="ghastly-clock"><i class="fa-solid fa-clock-rotate-left"></i></div>
                    <div class="countdown-text" id="timer-${docSnap.id}">--:--:--</div>
                    <h2 class="action-title">${action}</h2>
                    <div class="detail-row"><i class="fa-solid fa-skull"></i> CẤP ĐỘ: ${level}</div>
                    ${data.status_req ? `<div class="detail-row"><i class="fa-solid fa-person-praying"></i> TƯ THẾ: ${data.status_req}</div>` : ''}
                    <div class="detail-row"><i class="fa-solid fa-camera"></i> MINH CHỨNG: ${data.proof_type || 'Hình ảnh'}</div>
                    ${data.mantra ? `<div class="mantra-box"><i class="fa-solid fa-comment-dots" style="color:var(--gold)"></i> <b>KHẨU QUYẾT:</b> "${data.mantra}"</div>` : ''}
                    <div class="punishment-alert"><b>HÌNH PHẠT CƠ BẢN:</b> ${data.punishment || "Tùy chủ nhân quyết định"}</div>
                    ${data.extreme_punish ? `<div class="extreme-punish-box"><i class="fa-solid fa-biohazard"></i> HẬU QUẢ TÀN KHỐC: <br>${data.extreme_punish}</div>` : ''}
                    <button class="btn-obey" onclick="openSubmission('${docSnap.id}', '${action.replace(/'/g, "\\'")}')">
                        CHẤP HÀNH & DÂNG NỘP
                    </button>
                </div>`;
                html += cardHtml;
                if (deadline) startGhastlyTimer(docSnap.id, deadline);
            });
            list.innerHTML = html;
        });

        // Hàm đếm ngược
        function startGhastlyTimer(id, targetTime) {
            const timerInterval = setInterval(() => {
                const now = new Date().getTime();
                const target = new Date(targetTime).getTime();
                const diff = target - now;
                const el = document.getElementById(`timer-${id}`);
                if (!el) { clearInterval(timerInterval); return; }
                if (diff <= 0) {
                    el.innerHTML = "HẾT HẠN - CHỜ PHẠT";
                    el.style.color = "red";
                    clearInterval(timerInterval);
                    return;
                }
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                el.innerHTML = `${h.toString().padStart(2, '0')}H ${m.toString().padStart(2, '0')}M ${s.toString().padStart(2, '0')}S`;
            }, 1000);
        }

        // Gắn hàm vào window để HTML gọi được
        window.openSubmission = (id, action) => {
            currentId = id;
            currentAction = action;
            document.getElementById('sub-title').innerText = action;
            document.getElementById('submission-overlay').style.display = 'block';

            navigator.geolocation.getCurrentPosition(p => {
                realLocation = { lat: p.coords.latitude, lng: p.coords.longitude };
                const gpsSpan = document.querySelector('#gps-status span');
                if (gpsSpan) {
                    gpsSpan.innerText = "ĐÃ KHÓA MỤC TIÊU";
                    gpsSpan.style.color = "var(--gold)";
                }
            });
        };

        document.getElementById('file-input').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const skull = document.getElementById('skull-icon');
            if (skull) skull.style.display = 'none';
            const area = document.getElementById('preview-area');
            area.style.display = 'block';
            const url = URL.createObjectURL(file);
            area.innerHTML = file.type.startsWith('image/') ? `<img src="${url}" style="width:100%">` : `<video src="${url}" controls style="width:100%"></video>`;
            document.getElementById('btn-final-submit').style.display = 'block';
        };

       document.getElementById('btn-final-submit').onclick = async () => {
    const file = document.getElementById('file-input').files[0];
    if (!file || !realLocation) return alert("Vật chứng hoặc Vị trí chưa sẵn sàng!");

    const submitBtn = document.getElementById('btn-final-submit');
    const loadingRitual = document.getElementById('loading-ritual');

    // KÍCH HOẠT NGHI LỄ: Hiện xiềng xích rung lắc
    loadingRitual.style.display = 'flex';
    submitBtn.disabled = true;

    try {
        const now = new Date();
        const dateStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;
        const timeStr = `${String(now.getHours()).padStart(2, '0')}-${String(now.getMinutes()).padStart(2, '0')}-${String(now.getSeconds()).padStart(2, '0')}`;
        
        // Làm sạch tên hành động để đặt tên ID
        const cleanName = currentAction.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_').replace(/[^\w]/g, '');

        // Đường dẫn folder: slave_boss/Ngày-Tháng-Năm
        const folder = `slave_boss/${dateStr}`;
        // ID duy nhất: Ngày_Tên_Giờ
        const customID = `${dateStr}_${cleanName}_${timeStr}`;

        // --- BƯỚC 1: HIẾN TẾ LÊN CLOUDINARY ---
        const formData = new FormData();
        formData.append('file', file);
        formData.append('upload_preset', 'cunlun');
        formData.append('folder', folder);

        const res = await fetch('https://api.cloudinary.com/v1_1/djjinlx7t/auto/upload', { 
            method: 'POST', 
            body: formData 
        });
        
        if (!res.ok) throw new Error("Cloudinary từ chối vật chứng!");
        const img = await res.json();

        // --- BƯỚC 2: GHI VÀO VĂN KHỐ (FIREBASE) ---
        await setDoc(doc(db, "task_submissions", customID), {
            submission_id: customID,
            task_id: currentId,
            action_name: currentAction,
            image_evidence: img.secure_url,
            confession: document.getElementById('ritual-confession')?.value || "Kẻ phục tùng không để lại lời nào.",
            location: {
                latitude: realLocation.lat,
                longitude: realLocation.lng,
                google_map_link: `https://www.google.com/maps?q=${realLocation.lat},${realLocation.lng}`
            },
            submitted_at: Date.now(),
            status: "PENDING" // Chờ Master phán xét
        });

        // --- BƯỚC 3: CẬP NHẬT TRẠNG THÁI LỆNH GỐC ---
        await updateDoc(doc(db, "slave_tasks", currentId), { 
            status: "SUBMITTED" 
        });

        // KẾT THÚC NGHI LỄ
        alert("Vật chứng đã được niêm phong và gửi đi.");
        location.reload(); 

    } catch (err) {
        console.error("Nghi lễ thất bại:", err);
        alert("Lỗi hiến tế: " + err.message);
        
        // Tắt xiềng xích để slave thử lại
        loadingRitual.style.display = 'none';
        submitBtn.disabled = false;
    }
};
    </script>
</body>

</html>
