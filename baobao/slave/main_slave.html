<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Eternal Pact - Slave Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --blood: #8b0000;
            --gold: #d4af37;
        }

        /* Thiết lập nền cơ bản */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Quicksand', sans-serif;
            background: #000;
            /* Nền đen dự phòng */
            overflow: hidden;
        }

        /* Container chính chứa ảnh nền chờ img/4.png */
        .main-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-image: url('../img/4.png');
            /* ẢNH NỀN CHỜ CỦA BẠN */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Cấu hình iframe */
        #content-page {
            flex: 1;
            border: none;
            width: 100%;
            background: transparent;
            transition: opacity 0.4s ease-in-out;
            /* Hiệu ứng mờ dần mượt mà */
            opacity: 1;
        }

        /* Bottom Navigation */
        .bottom-nav {
            height: 85px;
            background: rgba(5, 5, 5, 0.95);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 20px;
            border-top: 1px solid #222;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -10px 30px #000;
            z-index: 10;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #444;
            font-size: 10px;
            font-weight: 700;
            gap: 4px;
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active {
            color: var(--gold);
            text-shadow: 0 0 10px var(--gold);
        }

        .center-btn {
            width: 55px;
            height: 55px;
            background: linear-gradient(135deg, #222, var(--blood));
            border-radius: 50%;
            margin-top: -45px;
            border: 3px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            box-shadow: 0 5px 15px rgba(139, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <div class="main-container">
        <!-- Iframe load nội dung -->
        <iframe src="s_welcome.html" id="content-page"></iframe>

        <!-- Navi -->
        <div class="bottom-nav" id="nav-bar">
            <a href="javascript:void(0)" onclick="loadSubPage('s_doilenh.html', this)" class="nav-item"><i
                    class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="javascript:void(0)" onclick="loadSubPage('s_khancauduyet.html', this)" class="nav-item"><i
                    class="fa-solid fa-upload"></i><span>KHẨN XIN</span></a>
            <div class="center-btn" onclick="loadSubPage('s_khancau.html', this)"><i class="fa-solid fa-gift"></i>
            </div>
            <a href="javascript:void(0)" onclick="loadSubPage('s_thuongphat.html', this)" class="nav-item"><i
                    class="fa-solid fa-images"></i><span>Chung</span></a>
            <a href="javascript:void(0)" onclick="loadSubPage('../bs_about.html', this)" class="nav-item"><i
                    class="fa-solid fa-crown"></i><span>About</span></a>
        </div>
    </div>

   <script>
        const contentFrame = document.getElementById('content-page');

        function loadSubPage(url, el) {
            // Không load lại nếu đang ở đúng trang đó
            if (contentFrame.src.includes(url)) return;

            // 1. Làm iframe mờ đi -> Lộ ảnh nền bên dưới ra
            contentFrame.style.opacity = '0';

            // 2. Sau khi mờ hẳn thì mới đổi nội dung
            setTimeout(() => {
                contentFrame.src = url;
            }, 300);

            // 3. Cập nhật trạng thái active
            // Xóa màu vàng của tất cả các nút nav-item
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            // Nếu click vào một nút nav-item (không phải nút tròn ở giữa)
            if (el && el.classList.contains('nav-item')) {
                el.classList.add('active');
            }
        }

        // 4. Khi trang mới đã tải xong hoàn toàn trong iframe
        contentFrame.onload = function () {
            contentFrame.style.opacity = '1';
        };

        // 5. THIẾT LẬP KHI VỪA MỞ TRANG
        document.addEventListener('DOMContentLoaded', () => {
            // ĐÃ XÓA đoạn code tự động thêm class 'active' vào nút Home.
            // Bây giờ khi vừa vào, không nút nào sáng cả, iframe sẽ hiện s_welcome.html
            console.log("Slave Dashboard Ready.");
        });
    </script>
</body>

</html>
