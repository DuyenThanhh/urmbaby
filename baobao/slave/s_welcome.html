<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; height: 100vh; display: flex; flex-direction: column;
            justify-content: center; align-items: center; background: transparent;
            font-family: 'Quicksand', sans-serif; color: #888; text-align: center;
            padding: 30px; box-sizing: border-box;
        }
        .oath-title { 
            font-size: 18px; text-transform: uppercase; letter-spacing: 4px;
            color: #660000; margin-bottom: 15px; font-weight: 700;
        }
        .oath-text { 
            font-size: 15px; line-height: 1.6; font-style: italic;
            color: #555; border-left: 2px solid #660000; padding-left: 15px;
        }
    </style>
</head>
<body>
    <div class="oath-title">LỜI THỀ PHỤC TÙNG</div>
    <div class="oath-text">
        "Sự im lặng và phục tùng là nghĩa vụ duy nhất của Người phục tùng. <br>
        Mọi mệnh lệnh của Chủ Nhân là luật lệ tối cao."
    </div>
</body>
</html>
