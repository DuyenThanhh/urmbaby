<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sacrifice Altar - The Eternal Pact</title>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blood: #660000; --gold: #b8860b; --dark: #050505; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Quicksand', sans-serif; background: #000; color: #888;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%; min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.85)), url('../img/5.png');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; align-items: center;
        }

        .content { width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; }

        .header-ritual { text-align: center; margin-bottom: 30px; }
        .header-ritual h1 { 
            font-family: 'Pirata One', cursive; font-size: 40px; color: var(--blood); 
            margin: 0; letter-spacing: 4px; text-shadow: 0 0 15px rgba(255,0,0,0.3);
        }
        .header-ritual p { font-size: 10px; color: var(--gold); letter-spacing: 3px; text-transform: uppercase; }

        /* KHU VỰC HIẾN TẾ */
        .altar-box {
            background: rgba(10, 10, 10, 0.9); border: 1px solid #222;
            padding: 20px; position: relative;
            clip-path: polygon(2% 0%, 98% 1%, 100% 4%, 99% 96%, 95% 100%, 5% 99%, 0% 95%, 1% 5%);
        }

        .label-ritual {
            font-family: 'Pirata One'; font-size: 14px; color: var(--gold);
            display: flex; align-items: center; gap: 10px; margin: 15px 0 8px 0;
        }
        .label-ritual::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, var(--gold), transparent); }

        #display-task-name {
            font-size: 18px; color: #eee; font-weight: 700; display: block;
            padding: 10px; background: rgba(139, 0, 0, 0.1); border-left: 3px solid var(--blood);
        }

        /* UPLOAD ZONE */
        .upload-zone {
            width: 100%; height: 220px; background: #000; border: 1px double #333;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .upload-zone i { font-size: 40px; color: #1a1a1a; z-index: 1; }
        .upload-zone img, .upload-zone video { 
            width: 100%; height: 100%; object-fit: cover; 
            position: absolute; top: 0; left: 0; z-index: 2; display: none;
        }

        textarea {
            width: 100%; background: transparent; border: none; border-bottom: 1px solid #333;
            color: #ccc; font-family: inherit; font-size: 14px; padding: 10px 0;
            outline: none; resize: none; transition: 0.3s;
        }
        textarea:focus { border-bottom-color: var(--blood); color: #fff; }

        .btn-submit {
            width: 100%; padding: 18px; background: var(--blood); color: #fff;
            border: none; font-family: 'Pirata One'; font-size: 22px;
            letter-spacing: 3px; cursor: pointer; margin-top: 25px;
            box-shadow: 0 0 20px rgba(139, 0, 0, 0.4);
        }
        .btn-submit:active { transform: scale(0.98); filter: brightness(1.2); }

        .loc-tag { font-size: 9px; text-align: center; color: #444; margin-top: 15px; letter-spacing: 1px; }
        .loc-tag span { color: var(--blood); font-weight: bold; }

        /* LOADING */
        #loading-overlay {
            position: fixed; inset: 0; background: #000; z-index: 999;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner { font-size: 40px; color: var(--blood); animation: rotate 2s infinite linear; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading-overlay">
    <i class="fa-solid fa- circle-notch spinner"></i>
    <p style="font-family: 'Pirata One'; color: var(--blood); margin-top: 20px; letter-spacing: 3px;">ĐANG DÂNG NỘP VẬT CHỨNG...</p>
</div>

<div class="app-container">
    <div class="content">
        <div class="header-ritual">
            <h1>ĐÀN TẾ HIẾN TẾ</h1>
            <p>Sacrifice Altar</p>
        </div>

        <div class="altar-box">
            <div class="label-ritual">MỆNH LỆNH ĐANG THỰC THI</div>
            <span id="display-task-name">Đang triệu hồi...</span>

            <div class="label-ritual">VẬT CHỨNG (ẢNH/VIDEO)</div>
            <div class="upload-zone" onclick="document.getElementById('file-input').click()">
                <i class="fa-solid fa-skull-crossbones"></i>
                <img id="preview-img">
                <video id="preview-video" muted></video>
            </div>
            <input type="file" id="file-input" hidden accept="image/*,video/*">

            <div class="label-ritual">LỜI TỰ THÚ / GHI CHÚ</div>
            <textarea id="confession" rows="3" placeholder="Viết những lời hối lỗi hoặc báo cáo..."></textarea>

            <button class="btn-submit" id="submit-btn">DÂNG NỘP LÊN CHỦ NHÂN</button>

            <div class="loc-tag">
                <i class="fa-solid fa-location-dot"></i> VỊ TRÍ: <span id="loc-status">ĐANG XÁC ĐỊNH...</span>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, doc, getDoc, updateDoc, addDoc, collection } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB-Zj-83s3GW09RkAhMS4H8xWmLdi7loSI",
        authDomain: "photodiary-3d469.firebaseapp.com",
        projectId: "photodiary-3d469",
        storageBucket: "photodiary-3d469.firebasestorage.app",
        messagingSenderId: "102477469911",
        appId: "1:102477469911:web:13ed38ab426819fdb43892"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const urlParams = new URLSearchParams(window.location.search);
    const taskId = urlParams.get('id');
    
    let realLocation = null;
    let taskData = null;

    // 1. Lấy vị trí GPS
    function initGPS() {
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(pos => {
                realLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                document.getElementById('loc-status').innerText = `ĐÃ KHÓA MỤC TIÊU`;
                document.getElementById('loc-status').style.color = "#00ff00";
            }, err => {
                document.getElementById('loc-status').innerText = "GPS BỊ TỪ CHỐI";
            }, { enableHighAccuracy: true });
        }
    }
    initGPS();

    // 2. Load thông tin nhiệm vụ
    if (taskId) {
        getDoc(doc(db, "slave_tasks", taskId)).then(s => {
            if (s.exists()) {
                taskData = s.data();
                document.getElementById('display-task-name').innerText = taskData.action;
            }
        });
    }

    // 3. Xử lý xem trước file
    document.getElementById('file-input').onchange = e => {
        const file = e.target.files[0];
        const img = document.getElementById('preview-img');
        const video = document.getElementById('preview-video');
        
        img.style.display = 'none';
        video.style.display = 'none';

        if (file) {
            const url = URL.createObjectURL(file);
            if (file.type.startsWith('image/')) {
                img.src = url;
                img.style.display = 'block';
            } else if (file.type.startsWith('video/')) {
                video.src = url;
                video.style.display = 'block';
                video.play();
            }
        }
    };

    // 4. Nút Dâng Nộp
    document.getElementById('submit-btn').onclick = async () => {
        const file = document.getElementById('file-input').files[0];
        const confession = document.getElementById('confession').value;

        if (!file) return alert("Vật chứng đâu? Ngươi muốn bị trừng phạt sao?");
        if (!realLocation) return alert("Chưa xác định được vị trí của ngươi!");

        document.getElementById('loading-overlay').style.display = 'flex';

        try {
            // --- TẠO ĐƯỜNG DẪN FOLDER CLOUDINARY ---
            const now = new Date();
            const dateStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;
            const timeStr = `${String(now.getHours()).padStart(2, '0')}-${String(now.getMinutes()).padStart(2, '0')}-${String(now.getSeconds()).padStart(2, '0')}`;
            
            // Xử lý tên nhiệm vụ (bỏ dấu, bỏ cách)
            const cleanTaskName = taskData.action.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, '_').replace(/[^\w]/g, '');
            
            // boss_slave/submission/ngày tháng năm / tên nhiệm vụ _ giờ phút giây
            const cloudinaryFolder = `boss_slave/submission/${dateStr}/${cleanTaskName}_${timeStr}`;

            // --- UPLOAD CLOUDINARY ---
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', 'ml_default'); 
            formData.append('folder', cloudinaryFolder);

            const cloudRes = await fetch('https://api.cloudinary.com/v1_1/djjinlx7t/upload', {
                method: 'POST', body: formData
            });

            if (!cloudRes.ok) throw new Error("Lỗi truyền tin lên Cloudinary");
            const imgData = await cloudRes.json();

            // --- LƯU FIREBASE ---
            await addDoc(collection(db, "task_submissions"), {
                task_id: taskId,
                task_name: taskData.action,
                task_level: taskData.level || 'low',
                slave_confession: confession,
                evidence_url: imgData.secure_url,
                evidence_type: file.type.startsWith('image') ? 'image' : 'video',
                cloudinary_folder: cloudinaryFolder,
                location: {
                    lat: realLocation.lat,
                    lng: realLocation.lng,
                    map_link: `https://www.google.com/maps?q=${realLocation.lat},${realLocation.lng}`
                },
                submitted_at: Date.now(),
                status: "SUBMITTED"
            });

            // Cập nhật trạng thái nhiệm vụ gốc
            await updateDoc(doc(db, "slave_tasks", taskId), { status: "SUBMITTED" });

            alert("Vật chứng đã được niêm phong. Hãy chờ đợi phán xét.");
            window.location.href = "s_doilenh.html";

        } catch (err) {
            console.error(err);
            alert("Nghi lễ thất bại: " + err.message);
        } finally {
            document.getElementById('loading-overlay').style.display = 'none';
        }
    };
</script>
</body>
</html>
