<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhật Ký Hư Hỏng 🔞</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: #0a0000;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(120, 0, 0, 0.5) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(50, 0, 50, 0.5) 0%, transparent 50%);
            color: #ffcccc;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .naughty-font { font-family: 'Dancing Script', cursive; }

        .glass-panel {
            background: rgba(30, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 0, 64, 0.3);
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .btn-fire {
            background: linear-gradient(45deg, #800000, #ff0040);
            box-shadow: 0 0 15px rgba(255, 0, 64, 0.4);
            transition: 0.3s;
        }

        .btn-fire:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px #ff0040;
        }

        /* Hiệu ứng làm mờ ảnh (Private Mode) */
        .media-container {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
        }
        .media-blur {
            filter: blur(8px);
            transition: 0.5s;
        }
        .media-container:hover .media-blur {
            filter: blur(0px);
        }

        input, textarea, select {
            background: rgba(0, 0, 0, 0.5) !important;
            border: 1px solid #4a0000 !important;
            color: white !important;
            border-radius: 15px !important;
        }

        input:focus { border-color: #ff0040 !important; outline: none; }

        /* Animation cho icon tim */
        .heart-beat {
            animation: heartbeat 1.2s infinite;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
    </style>
</head>
<body class="p-4">

    <div class="max-w-xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 pt-4">
            <div>
                <h1 class="naughty-font text-4xl text-red-600 drop-shadow-[0_0_10px_#ff0040]">Our Secret...</h1>
                <p class="text-[10px] uppercase tracking-[0.4em] text-gray-500">Nơi lưu giữ những cơn say</p>
            </div>
            <div class="heart-beat text-red-600 text-2xl">
                <i class="fas fa-heart"></i>
            </div>
        </div>

        <!-- Form đăng kỷ niệm mới -->
        <div class="glass-panel p-6 mb-10 border-t-4 border-red-600">
            <h3 class="text-sm font-bold mb-4 flex items-center gap-2 text-red-400">
                <i class="fas fa-plus-circle"></i> Ghi lại khoảnh khắc mới
            </h3>
            
            <div class="space-y-4">
                <!-- Cảm xúc -->
                <select id="diary-mood" class="w-full p-3 text-xs font-bold">
                    <option value="🔥 Nóng bỏng">Cảm giác: Nóng bỏng 🔥</option>
                    <option value="💦 Ướt át">Cảm giác: Ướt át 💦</option>
                    <option value="😈 Hư hỏng">Cảm giác: Hư hỏng 😈</option>
                    <option value="🫦 Kích thích">Cảm giác: Kích thích 🫦</option>
                    <option value="❤️ Yêu thương">Cảm giác: Yêu thương ❤️</option>
                </select>

                <!-- Lời tâm sự -->
                <textarea id="diary-note" class="w-full p-4 text-sm" rows="3" placeholder="Em/Anh muốn nói gì về khoảnh khắc này?..."></textarea>

                <div class="grid grid-cols-2 gap-3">
                    <button id="upload-widget" class="bg-black/50 border border-dashed border-red-900 text-red-500 py-4 rounded-2xl text-xs font-bold flex flex-col items-center justify-center gap-1">
                        <i class="fas fa-cloud-upload-alt text-lg"></i>
                        <span>ẢNH / VIDEO</span>
                    </button>
                    
                    <button onclick="saveMemory()" class="btn-fire rounded-2xl font-black text-white text-xs uppercase tracking-widest">
                        LƯU BÍ MẬT
                    </button>
                </div>

                <!-- Preview trước khi lưu -->
                <div id="preview-box" class="hidden relative rounded-xl overflow-hidden border-2 border-red-600">
                    <div id="media-preview-content"></div>
                    <button onclick="resetUpload()" class="absolute top-2 right-2 bg-black/70 w-8 h-8 rounded-full text-white text-xs">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Timeline Nhật ký -->
        <div class="space-y-8" id="diary-container">
            <div class="text-center py-20 text-red-900">Đang mở khóa kho lưu trữ...</div>
        </div>
    </div>

    <!-- Firebase & Cloudinary -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, query, where, onSnapshot, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-Zj-83s3GW09RkAhMS4H8xWmLdi7loSI",
            authDomain: "photodiary-3d469.firebaseapp.com",
            projectId: "photodiary-3d469",
            storageBucket: "photodiary-3d469.firebasestorage.app",
            messagingSenderId: "102477469911",
            appId: "1:102477469911:web:13ed38ab426819fdb43892"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const currentUserId = "GIRL_USER_01"; 

        // Cloudinary Config
        const cloudName = "djjinlx7t";
        const uploadPreset = "ml_default"; 

        let uploadedUrl = "";
        let uploadedType = "";

        // Tạo Widget Upload
        const myWidget = window.cloudinary.createUploadWidget({
            cloudName: cloudName, uploadPreset: uploadPreset,
            sources: ['local', 'camera', 'facebook'],
            styles: { palette: { window: "#1a0000", sourceBg: "#000000", windowBorder: "#ff0040", tabIcon: "#ff0040", inactiveTabIcon: "#4a0000", menuIcons: "#ff0040", link: "#ff0040", action: "#ff0040", inProgress: "#00ffcc", complete: "#33ff00", error: "#ea2727", textDark: "#000000", textLight: "#ffffff" } }
        }, (error, result) => {
            if (!error && result && result.event === "success") { 
                uploadedUrl = result.info.secure_url;
                uploadedType = result.info.resource_type;
                showPreview(uploadedUrl, uploadedType);
            }
        });

        document.getElementById("upload-widget").addEventListener("click", () => myWidget.open(), false);

        function showPreview(url, type) {
            const box = document.getElementById('preview-box');
            const content = document.getElementById('media-preview-content');
            box.classList.remove('hidden');
            content.innerHTML = type === 'video' ? `<video src="${url}" class="w-full h-48 object-cover"></video>` : `<img src="${url}" class="w-full h-48 object-cover">`;
        }

        window.resetUpload = () => {
            uploadedUrl = "";
            document.getElementById('preview-box').classList.add('hidden');
        }

        // Lưu kỷ niệm
        window.saveMemory = async () => {
            const mood = document.getElementById('diary-mood').value;
            const note = document.getElementById('diary-note').value;
            
            if (!uploadedUrl) return alert("Phải có hình ảnh hoặc video bí mật mới lưu được chứ!");

            // Định dạng tên theo yêu cầu: YYYY-MM-DD_HH-mm-ss
            const now = new Date();
            const folderName = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}-${String(now.getSeconds()).padStart(2,'0')}`;

            await setDoc(doc(db, "secret_diary", folderName), {
                folderName: folderName, // Tên folder định dạng của bạn
                mood: mood,
                content: note,
                mediaUrl: uploadedUrl,
                mediaType: uploadedType,
                ts: Date.now(),
                uid: currentUserId
            });

            // Reset form
            document.getElementById('diary-note').value = "";
            resetUpload();
            alert("Đã khóa kỷ niệm vào rương bí mật! 🫦");
        };

        // Load dữ liệu Realtime
        function loadDiary() {
            const q = query(collection(db, "secret_diary"), where("uid", "==", currentUserId), orderBy("ts", "desc"));
            onSnapshot(q, (snap) => {
                let html = "";
                snap.forEach(d => {
                    const data = d.data();
                    html += `
                        <div class="glass-panel overflow-hidden border-l-4 border-red-600 mb-6">
                            <div class="p-3 bg-red-950/30 flex justify-between items-center">
                                <span class="text-[10px] font-black text-red-500 uppercase tracking-tighter">
                                    <i class="fas fa-folder-open mr-1"></i> ${data.folderName}
                                </span>
                                <span class="text-[10px] bg-red-600 text-white px-2 py-1 rounded-full font-bold">${data.mood}</span>
                            </div>
                            
                            <div class="media-container">
                                ${data.mediaType === 'video' ? 
                                    `<video src="${data.mediaUrl}" controls class="w-full h-auto media-blur"></video>` : 
                                    `<img src="${data.mediaUrl}" class="w-full h-auto media-blur">`}
                                <div class="absolute inset-0 flex items-center justify-center pointer-events-none group-hover:opacity-0">
                                    <i class="fas fa-eye-slash text-red-500/50 text-4xl"></i>
                                </div>
                            </div>

                            <div class="p-5">
                                <p class="text-sm text-pink-100 italic leading-relaxed">"${data.content || 'Không có lời nhắn...'}"</p>
                                <div class="flex justify-end mt-4">
                                    <button onclick="deleteMemory('${d.id}')" class="text-red-900 hover:text-red-500 transition">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById("diary-container").innerHTML = html || `<div class="text-center py-20 text-red-900 italic">Nhật ký đang trống... Hãy lấp đầy nó đi 🔥</div>`;
            });
        }

        window.deleteMemory = async (id) => {
            if(confirm("Xóa vĩnh viễn kỷ niệm này?")) await deleteDoc(doc(db, "secret_diary", id));
        };

        loadDiary();
    </script>

    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</body>
</html>
