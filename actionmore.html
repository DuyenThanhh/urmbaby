<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chi tiết hoạt động 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --p-main: #ff8fab; --p-soft: #ffe4e9; --p-bg: #fff5f7; --text: #5d4037; --danger: #ff4d4d; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: 'Quicksand', sans-serif; background: var(--p-bg); color: var(--text); }

        .app-container { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; position: relative; padding-bottom: 20px; }
        
        /* Header */
        .header { padding: 15px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: white; z-index: 100; }
        .back-btn { width: 35px; height: 35px; border-radius: 50%; border: 1px solid #fef2f4; display: flex; align-items: center; justify-content: center; color: var(--p-main); cursor: pointer; }

        /* Cảnh báo đỏ */
        .warning-box {
            margin: 0 15px 15px;
            background: #fff0f0;
            border: 1px solid #ffcccc;
            border-radius: 15px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.5s ease-in-out infinite alternate;
        }
        @keyframes shake { from { transform: scale(1); } to { transform: scale(1.02); } }
        .warning-box i { color: var(--danger); font-size: 18px; }
        .warning-box span { color: var(--danger); font-size: 11px; font-weight: 700; line-height: 1.4; }

        /* Hero Card */
        .hero { padding: 0 15px 15px; }
        .hero-card { background: #fff; border: 2px solid var(--p-soft); border-radius: 25px; padding: 18px; display: flex; gap: 15px; }
        .hero-img { width: 110px; height: 110px; border-radius: 20px; object-fit: cover; border: 3px solid var(--p-soft); }
        .hero-info { flex: 1; }
        .hero-info h2 { margin: 0; font-size: 17px; color: #333; }
        .hero-meta { font-size: 11px; color: #777; margin-top: 10px; display: grid; gap: 5px; }
        .meta-item { display: flex; align-items: center; gap: 6px; }
        .meta-item i { color: var(--p-main); width: 14px; text-align: center; }
        .meta-item b { color: #444; }

        /* Sorting & Timeline (Giữ nguyên từ bản trước) */
        .list-header { padding: 15px 20px 5px; display: flex; justify-content: space-between; align-items: center; }
        .sort-btn { background: #fff; border: 1px solid var(--p-soft); border-radius: 10px; padding: 5px 10px; font-size: 11px; font-weight: 700; color: var(--p-main); cursor: pointer; }
        
        .timeline-container { padding: 15px; position: relative; }
        .timeline-line { position: absolute; left: 35px; top: 0; bottom: 0; width: 2px; border-left: 2px dashed var(--p-soft); }
        .log-item { display: flex; gap: 15px; margin-bottom: 25px; position: relative; }
        .heart-num { width: 40px; height: 40px; background: var(--p-soft); border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; flex-shrink: 0; border: 2px solid white; position: relative; }
        .heart-num i { color: var(--p-main); font-size: 18px; }
        .heart-num span { position: absolute; color: white; font-size: 10px; font-weight: 800; top: 12px; }
        .log-card { flex: 1; background: #fffcfc; border: 1px solid #ffeef1; border-radius: 20px; padding: 12px; display: flex; gap: 10px; }
        .log-date-side { min-width: 70px; text-align: center; border-right: 1px dashed var(--p-soft); padding-right: 8px; }
        .log-date-side .d { font-size: 11px; font-weight: 700; color: #444; }
        .log-date-side .t { font-size: 10px; font-weight: 800; color: var(--p-main); margin-top: 4px; display: block; }
        .log-content { flex: 1; }
        .log-content h3 { margin: 0 0 5px 0; font-size: 14px; }
        .log-imgs img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; margin-top: 8px; }

        .progress-section { margin: 15px; padding: 15px; background: #fffcfc; border-radius: 20px; border: 1px solid #ffeef1; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></div>
        <div style="font-weight: 700;">Hành trình kỉ niệm 🌸</div>
        <div class="back-btn"><i class="fa-solid fa-ellipsis"></i></div>
    </div>

    <!-- Nơi hiện Cảnh báo đỏ -->
    <div id="warning-area"></div>

    <!-- Nơi hiện Thông tin Hero -->
    <div id="hero-area" class="hero"></div>

    <div class="list-header">
        <div style="font-weight:700; font-size:14px; color:var(--p-main);">Quá trình đã thực hiện</div>
        <div class="sort-btn" onclick="toggleSort()"><i class="fa-solid fa-sort"></i> <span id="sortText">Mới nhất</span></div>
    </div>

    <div class="timeline-container">
        <div class="timeline-line"></div>
        <div id="timeline-list"></div>
    </div>

    <div id="stats-area"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const userDocument = "Banh";
    const firebaseConfig = {
        apiKey: "AIzaSyB-Zj-83s3GW09RkAhMS4H8xWmLdi7loSI",
        authDomain: "photodiary-3d469.firebaseapp.com",
        projectId: "photodiary-3d469",
        storageBucket: "photodiary-3d469.firebasestorage.app",
        messagingSenderId: "102477469911",
        appId: "1:102477469911:web:13ed38ab426819fdb43892"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const activityId = new URLSearchParams(window.location.search).get('id');

    let currentLogs = [];
    let isNewestFirst = true;

    async function load() {
        if (!activityId) return;
        const snap = await getDoc(doc(db, "bucket_list", activityId));
        if (snap.exists()) {
            const data = snap.data();
            currentLogs = data.logs || [];
            
            // 1. Xử lý logic Warning & Ngày tháng
            const progressPercent = (data.currentCount / data.targetCount) * 100;
            const startDate = currentLogs.length > 0 ? formatDate(currentLogs[0].date) : "---";
            const deadlineDate = data.deadline ? formatDate(data.deadline) : "Chưa đặt";
            
            renderWarning(data.deadline, progressPercent);
            renderHero(data, startDate, deadlineDate);
            renderTimeline();
            renderStats(data, progressPercent);
        }
    }

    // Hàm kiểm tra và hiện cảnh báo đỏ
    function renderWarning(deadlineStr, percent) {
        if (!deadlineStr) return;
        
        const deadline = new Date(deadlineStr);
        const today = new Date();
        const diffTime = deadline - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        // Nếu ngày đến hạn còn <= 10 ngày VÀ tiến độ < 90%
        if (diffDays >= 0 && diffDays <= 10 && percent < 90) {
            document.getElementById('warning-area').innerHTML = `
                <div class="warning-box">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>Bé ơi! Chỉ còn <b>${diffDays} ngày</b> nữa là đến hạn mà chúng mình mới đạt <b>${Math.round(percent)}%</b>. Nhanh chân lên nào! 🔥</span>
                </div>
            `;
        }
    }

    function renderHero(data, start, deadline) {
        document.getElementById('hero-area').innerHTML = `
            <div class="hero-card">
                <img src="${currentLogs[currentLogs.length-1]?.img || 'https://via.placeholder.com/100'}" class="hero-img">
                <div class="hero-info">
                    <h2>${data.title}</h2>
                    <div class="hero-meta">
                        <div class="meta-item"><i class="fa-solid fa-calendar-check"></i> Ngày đến hạn: <b>${deadline}</b></div>
                        <div class="meta-item"><i class="fa-solid fa-play"></i> Ngày bắt đầu: <b>${start}</b></div>
                        <div class="meta-item"><i class="fa-solid fa-rotate"></i> Tổng số lần đã làm: <b>${data.currentCount} lần</b></div>
                        <div class="meta-item"><i class="fa-solid fa-bullseye"></i> Mục tiêu: <b>${data.targetCount} lần</b></div>
                    </div>
                </div>
            </div>
        `;
    }

    function renderTimeline() {
        let displayLogs = [...currentLogs].map((log, i) => ({ ...log, index: i + 1 }));
        if (isNewestFirst) displayLogs.reverse();

        document.getElementById('timeline-list').innerHTML = displayLogs.map(log => {
            const dateObj = new Date(log.date);
            const canViewMap = (userDocument === "Banh" && log.addressurl);
            
            return `
                <div class="log-item">
                    <div class="heart-num"><i class="fa-solid fa-heart"></i><span>${log.index}</span></div>
                    <div class="log-card">
                        <div class="log-date-side">
                            <div class="d">${dateObj.toLocaleDateString('vi-VN')}</div>
                            <span class="t">${dateObj.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'})}</span>
                        </div>
                        <div class="log-content">
                            <div style="font-size:13px; font-weight:700; margin-bottom:5px;">Lần thứ ${log.index} ❤️</div>
                            <div style="font-size:11px; color:#888;"><i class="fa-solid fa-location-dot" style="color:var(--p-main)"></i> 
                                ${canViewMap ? `<span class="addr-link" onclick="window.open('${log.addressurl}')">${log.location}</span>` : log.location}
                            </div>
                            <div style="font-size:11px; color:#666; margin-top:5px;">${log.note || 'Không có ghi chú.'}</div>
                            <div class="log-imgs"><img src="${log.img}"></div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderStats(data, percent) {
        document.getElementById('stats-area').innerHTML = `
            <div class="progress-section">
                <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:700; margin-bottom:8px;">
                    <span>Tiến độ hành trình</span>
                    <span>${Math.round(percent)}%</span>
                </div>
                <div style="height:10px; background:#fef2f4; border-radius:10px; overflow:hidden;">
                    <div style="width:${percent}%; height:100%; background:var(--p-main); transition:1s;"></div>
                </div>
            </div>
        `;
    }

    function formatDate(dateStr) {
        if (!dateStr) return "---";
        const d = new Date(dateStr);
        return d.toLocaleDateString('vi-VN');
    }

    window.toggleSort = () => {
        isNewestFirst = !isNewestFirst;
        document.getElementById('sortText').innerText = isNewestFirst ? "Mới nhất" : "Cũ nhất";
        renderTimeline();
    };

    load();
</script>
    <script src="bgm.js"></script>

</body>
</html>
