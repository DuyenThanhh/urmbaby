<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Chặn zoom trên điện thoại -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Diary of Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-main: #ff748c;
            --pink-bg: #fff0f3;
            --purple-bg: #f3e8ff;
            --text-color: #4a4a4a;
            --border-dash: #ffb7c5;
        }

        /* Khóa cứng màn hình không cho cuộn */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none; /* Chặn các thao tác chạm đa điểm gây zoom */
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Quicksand', sans-serif;
            background: url('img/2.png') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            /* Chặn chọn văn bản để giống App */
            user-select: none; 
        }

        /* Khung điện thoại cố định kích thước */
        .phone-container {
            width: 360px;
            height: 720px;
            background-color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
            border-radius: 45px;
            padding: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            position: relative;
            /* Đảm bảo khung luôn ở giữa dù zoom trình duyệt */
            transform-origin: center center;
        }

        /* Tấm thiệp trắng bên trong */
        .main-card {
            background-color: #fffdf9;
            flex: 1;
            border-radius: 35px;
            border: 2px dashed var(--border-dash);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 45px 20px;
            position: relative;
        }

        /* Các icon trang trí góc */
        .decor-ribbon { position: absolute; top: -10px; left: -10px; font-size: 35px; }
        .decor-cloud { position: absolute; top: 10px; right: 15px; font-size: 25px; opacity: 0.6; }
        .decor-bear { position: absolute; bottom: 15px; right: 15px; font-size: 40px; }

        .welcome-text {
            font-size: 17px;
            color: var(--text-color);
            margin-bottom: 5px;
        }

        .main-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--pink-main);
            margin: 0;
            letter-spacing: -1px;
        }

        .description {
            font-size: 13px;
            color: #888;
            line-height: 1.6;
            margin: 25px 0 40px 0;
        }

        /* Khu vực nút bấm */
        .role-wrapper {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        .btn-role {
            flex: 1;
            border-radius: 25px;
            padding: 25px 10px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 15px rgba(0,0,0,0.05);
        }

        /* Hiệu ứng khi nhấn */
        .btn-role:active {
            transform: scale(0.92);
        }

        .writer { background-color: var(--pink-bg); }
        .viewer { background-color: var(--purple-bg); }

        .icon {
            font-size: 45px;
            margin-bottom: 12px;
        }

        .role-name {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 5px;
        }
        .writer .role-name { color: #d63384; }
        .viewer .role-name { color: #6f42c1; }

        .role-desc {
            font-size: 11px;
            color: #888;
            line-height: 1.3;
        }

        /* Footer text */
        .footer-note {
            margin-top: auto;
            font-size: 12px;
            color: #aaa;
            line-height: 1.6;
            padding-bottom: 10px;
        }

        .footer-note span { color: var(--pink-main); }

        /* Tự động co nhỏ khung nếu màn hình laptop quá thấp */
        @media (max-height: 750px) {
            .phone-container { transform: scale(0.85); }
        }
        @media (max-height: 600px) {
            .phone-container { transform: scale(0.7); }
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="main-card">
            <div class="decor-ribbon">🎀</div>
            <div class="decor-cloud">☁️</div>
            
            <div class="welcome-text">Chào mừng đến với</div>
            <h1 class="main-title">Diary of Us 💖</h1>

            <p class="description">Đây là không gian riêng tư<br>của hai chúng ta</p>

            <div class="role-wrapper">
                <!-- Chuyển hướng sang login.html -->
                <a href="login.html" class="btn-role writer">
                    <div class="icon">🐰</div>
                    <div class="role-name">Người viết</div>
                    <div class="role-desc">Ghi lại những điều<br>muốn nói</div>
                </a>

                <a href="login.html" class="btn-role viewer">
                    <div class="icon">🐻</div>
                    <div class="role-name">Người xem</div>
                    <div class="role-desc">Xem và cùng nhau<br>trân trọng</div>
                </a>
            </div>

            <div class="footer-note">
                Chỉ hai chúng ta mới có thể<br>truy cập vào nơi này <span>🌷</span>
                <div style="font-size: 10px; margin-top: 5px;">ʚ♡ɞ</div>
            </div>

            <div class="decor-bear">🧸</div>
        </div>
    </div>

    <script>
        /** 
         * ĐOẠN SCRIPT CHẶN ZOOM TRIỆT ĐỂ TRÊN LAPTOP
         */

        // 1. Chặn Zoom bằng tổ hợp phím Ctrl + (+ hoặc - hoặc 0)
        document.addEventListener('keydown', function (e) {
            if (e.ctrlKey && (e.key === '=' || e.key === '-' || e.key === '0' || e.key === '+')) {
                e.preventDefault();
            }
        });

        // 2. Chặn Zoom bằng tổ hợp phím Ctrl + Lăn chuột
        document.addEventListener('wheel', function (e) {
            if (e.ctrlKey) {
                e.preventDefault();
            }
        }, { passive: false });

        // 3. Chặn Double tap zoom (nhấn 2 lần để zoom) trên một số trình duyệt đt
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (e) {
            let now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
