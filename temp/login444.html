<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Khóa hoàn toàn chức năng thu phóng của trình duyệt -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Đăng nhập - Diary of Us</title>
    
    <!-- Font chữ siêu cute -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* Lấy ảnh của bạn làm nền, phủ kín và canh giữa */
            background-image: url('img/2.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            /* Canh giữa hoàn hảo khung đăng nhập */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Quicksand', sans-serif;
            
            /* Hiệu ứng chuyển cảnh mờ dần */
            transition: opacity 1.5s ease-in-out;
        }

        /* KHUNG ĐĂNG NHẬP (Hiệu ứng kính mờ Glassmorphism siêu đẹp) */
        .login-container {
            background: rgba(255, 255, 255, 0.65); /* Trắng trong suốt */
            backdrop-filter: blur(12px); /* Làm mờ background phía sau khung */
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 35px;
            padding: 40px 30px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(255, 150, 180, 0.2);
            position: relative;
        }

        .title {
            font-family: 'Nunito', sans-serif;
            font-size: 22px;
            color: #ee71d3dc;
            margin-bottom: 30px;
            font-weight: 800;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        /* 2 KHỐI CHỌN VAI TRÒ */
        .role-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .role-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 20px 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 3px solid transparent; /* Viền chờ sẵn */
            opacity: 0.7; /* Hơi mờ khi chưa chọn */
        }

        /* Hiệu ứng khi được chọn */
        .role-card.active-writer {
            background: #fff2f4;
            border-color: #fca5b3;
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(252, 165, 179, 0.3);
        }

        .role-card.active-viewer {
            background: #f4f3ff;
            border-color: #b7b0e5;
            opacity: 1;
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(183, 176, 229, 0.3);
        }

        /* TÙY CHỈNH LẠI CSS CHO ẢNH THAY VÌ EMOJI */
        .role-icon { 
            margin-bottom: 12px; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 55px; /* Giữ cố định chiều cao để 2 thẻ bằng nhau */
        }

        .role-icon img {
            width: 50px; /* Kích thước ảnh */
            height: auto;
            max-height: 50px;
            object-fit: contain; /* Giữ tỉ lệ không bị méo */
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.15)); /* Tạo bóng đổ 3D cho ảnh */
            transition: 0.3s ease;
        }

        /* Khi chọn thì ảnh nảy nhẹ lên một chút */
        .role-card.active-writer .role-icon img,
        .role-card.active-viewer .role-icon img {
            transform: translateY(-3px) scale(1.1);
        }
        
        .role-card h3 {
            font-size: 15px; font-weight: 700; margin-bottom: 5px;
        }
        .writer-text h3 { color: #f2687c; }
        .viewer-text h3 { color: #625d8a; }

        .role-card p {
            font-size: 11px; color: #888; font-weight: 600; line-height: 1.3;
        }

        /* Ô NHẬP MÃ (PIN) */
        .input-group { position: relative; margin-bottom: 15px; }

        .pin-input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 50px;
            border: 2px solid #fce2e6;
            background: rgba(255, 255, 255, 0.9);
            font-family: 'Quicksand', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #fd637a;
            text-align: center;
            outline: none;
            transition: 0.3s;
            letter-spacing: 3px;
        }

        .pin-input::placeholder { color: #bbb; letter-spacing: 0; font-weight: 600;}
        .pin-input:focus { border-color: #fd637a; box-shadow: 0 0 15px rgba(253, 99, 122, 0.2); }

        /* LỜI NHẮN TRẠNG THÁI */
        .status-msg {
            height: 25px; /* Giữ sẵn không gian để web không bị giật khi hiện chữ */
            font-size: 16px;
            font-weight: 700;
            opacity: 0;
            transition: 0.3s;
        }

        /* Hiệu ứng rung lắc khi nhập sai */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-8px); }
        }
        .error-shake { animation: shake 0.4s ease-in-out; }

    </style>
</head>
<body>

    <div class="login-container" id="loginBox">
        <h2 class="title">Đăng nhập vào Nhật Ký</h2>

        <div class="role-selector">
            <!-- NÚT NGƯỜI VIẾT ĐÃ THÊM ẢNH -->
            <div class="role-card writer-text" id="cardWriter" onclick="selectRole('writer')">
                <div class="role-icon">
                    <img src="img/cun.png" alt="Người viết">
                </div>
                <h3>Người viết</h3>
                <p>Ghi lại những điều<br>muốn nhớ</p>
            </div>

            <!-- NÚT NGƯỜI XEM ĐÃ THÊM ẢNH -->
            <div class="role-card viewer-text" id="cardViewer" onclick="selectRole('viewer')">
                <div class="role-icon">
                    <img src="img/banh.png" alt="Người xem">
                </div>
                <h3>Người xem</h3>
                <p>Xem và cùng nhau<br>trân trọng</p>
            </div>
        </div>

        <div class="input-group">
            <input type="password" id="pinInput" class="pin-input" placeholder="Nhập mã..." maxlength="6" inputmode="numeric">
        </div>

        <!-- Chỗ để hiện lời chào hoặc báo lỗi -->
        <div class="status-msg" id="statusMessage"></div>
    </div>

    <script>
        // CÁC BIẾN LƯU TRỮ
        let currentRole = null; 
        const pinInput = document.getElementById('pinInput');
        const statusMsg = document.getElementById('statusMessage');
        const loginBox = document.getElementById('loginBox');

        // HÀM CHỌN VAI TRÒ
        function selectRole(role) {
            currentRole = role;
            const cardWriter = document.getElementById('cardWriter');
            const cardViewer = document.getElementById('cardViewer');

            // Reset class
            cardWriter.className = 'role-card writer-text';
            cardViewer.className = 'role-card viewer-text';

            // Add class cho ô được chọn
            if (role === 'writer') {
                cardWriter.classList.add('active-writer');
            } else if (role === 'viewer') {
                cardViewer.classList.add('active-viewer');
            }

            // Xóa mã cũ và focus vào ô nhập
            pinInput.value = '';
            statusMsg.style.opacity = '0';
            pinInput.focus();
        }

        // LẮNG NGHE KHI NHẬP MÃ (Tự động kiểm tra khi đủ 6 ký tự)
        pinInput.addEventListener('input', function(e) {
            let code = e.target.value;
            
            // Xóa thông báo lỗi (nếu có) khi bắt đầu gõ lại
            statusMsg.style.opacity = '0';
            loginBox.classList.remove('error-shake');

            if (code.length === 6) {
                if (!currentRole) {
                    showStatus("Hãy chọn thẻ của bạn trước nhé!", "red");
                    pinInput.value = '';
                    return;
                }
                checkLogin(code);
            }
        });

        // HÀM KIỂM TRA MẬT KHẨU
        function checkLogin(code) {
            // Khóa ô nhập không cho bấm nữa
            pinInput.disabled = true; 

            if (currentRole === 'writer' && code === '171006') {
                showStatus("Chào em bé 🩷", "#fd637a");
                proceedToNextPage();

            } else if (currentRole === 'viewer' && code === '050803') {
                showStatus("Chào chủ nhân 💙", "#625d8a");
                proceedToNextPage();

            } else {
                showStatus("Mã sai rồi, thử lại nha 🥺", "#ff4757");
                loginBox.classList.add('error-shake');
                
                // Mở khóa ô nhập và xóa mật khẩu sai sau 1 giây
                setTimeout(() => {
                    pinInput.disabled = false;
                    pinInput.value = '';
                    pinInput.focus();
                }, 1000);
            }
        }

        // HÀM HIỂN THỊ CHỮ BÁO CÁO
        function showStatus(text, color) {
            statusMsg.innerText = text;
            statusMsg.style.color = color;
            statusMsg.style.opacity = '1';
        }

        // HÀM CHUYỂN TRANG MƯỢT MÀ
        function proceedToNextPage() {
            setTimeout(() => {
                // Làm mờ toàn bộ trang web (Fade out)
                document.body.style.opacity = '0';
                
                setTimeout(() => {
                    // Chuyển sang file 2.html sau khi đã mờ hẳn
                    window.location.href = '2.html';
                }, 1500); // 1.5 giây sau khi mờ mới chuyển trang
            }, 1000); // Cho người dùng 1 giây để kịp đọc câu "Chào em bé / chủ nhân"
        }
    </script>
</body>
</html>
