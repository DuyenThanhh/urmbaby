<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Sweet Diary 🌸</title>
    
    <!-- Font chữ -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fdf2f8;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        /* Khung App Chính */
        .app-container {
            width: 100%; max-width: 414px; height: 100vh;
            background-image: url('img/3.png'); /* BACKGROUND CỦA BẠN */
            background-size: cover; background-position: top center; background-repeat: no-repeat;
            position: relative; overflow-y: auto; overflow-x: hidden;
            padding: 20px 20px 100px 20px; /* Chừa khoảng trống cho thanh bottom nav */
        }
        @media (min-width: 450px) {
            .app-container { height: 90vh; border-radius: 40px; border: 8px solid #fff; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        }

        /* Ẩn thanh cuộn cho đẹp */
        .app-container::-webkit-scrollbar { display: none; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; margin-top: 10px;}
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ffccd5; border: 2px solid #fff; object-fit: cover;}
        .greeting { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 800; color: #4a3b32; }
        .bell-icon { font-size: 20px; color: #ff8fa3; opacity: 0.8;}

        /* BANNER CHÀO MỪNG (Khung kính mờ) */
        .welcome-banner {
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border-radius: 20px; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.8); margin-bottom: 30px;
            box-shadow: 0 10px 20px rgba(255, 182, 193, 0.15);
        }
        .banner-text h3 { font-size: 13px; font-weight: 700; color: #5c4b41; margin-bottom: 5px; }
        .banner-text p { font-size: 11px; font-weight: 600; color: #8c7a70; }
        .banner-mascot { width: 60px; height: auto; } /* Chỗ để ảnh con thỏ */

        /* MENU 4 NÚT TRÒN */
        .section-title { font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 800; color: #5c4b41; margin-bottom: 15px; }
        .action-menu { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .action-item { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .action-circle {
            width: 55px; height: 55px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.8), 0 5px 10px rgba(255, 182, 193, 0.2);
        }
        .action-circle img { width: 30px; height: 30px; object-fit: contain; }
        .action-item span { font-size: 10px; font-weight: 700; color: #5c4b41; }

        /* LƯỚI KHO KỈ NIỆM (Giống ảnh) */
        .gallery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .view-all { font-size: 12px; color: #ff769b; font-weight: 700; text-decoration: none; }
        
        .memory-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Tạo 2 cột */
            gap: 15px;
        }
        
        /* Box chứa từng ảnh đăng lên */
        .memory-card {
            aspect-ratio: 1; /* Cắt thành hình vuông */
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 15px rgba(200, 150, 160, 0.2);
            background: rgba(255,255,255,0.5);
            cursor: pointer;
        }
        .memory-card img, .memory-card video { width: 100%; height: 100%; object-fit: cover; }
        
        /* Chữ đè lên ảnh (hiện khi có text) */
        .memory-card .overlay-text {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
            color: #fff; padding: 15px 10px 10px; font-size: 11px; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .delete-btn {
            position: absolute; top: 5px; right: 5px; background: rgba(255,0,0,0.6); color: white;
            border: none; border-radius: 50%; width: 25px; height: 25px; display: flex; justify-content: center; align-items: center; font-size: 10px; z-index: 10;
        }

        /* BOTTOM NAVIGATION BAR */
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 75px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px);
            border-radius: 30px 30px 0 0;
            display: flex; justify-content: space-around; align-items: center;
            box-shadow: 0 -5px 20px rgba(255, 182, 193, 0.15); z-index: 100;
            padding: 0 10px;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #cca5b0; font-size: 9px; font-weight: 700; width: 50px;}
        .nav-item.active { color: #ff769b; }
        .nav-icon { font-size: 22px; }
        
        /* Nút cộng bự ở giữa */
        .fab-button {
            width: 55px; height: 55px; border-radius: 50%;
            background: #ff769b; color: white; border: none; font-size: 24px;
            display: flex; justify-content: center; align-items: center;
            transform: translateY(-20px); /* Đẩy trồi lên trên */
            box-shadow: 0 10px 20px rgba(255, 118, 155, 0.4);
            cursor: pointer; border: 4px solid #fff;
        }

        /* ========================================= */
        /* MODAL VIẾT NHẬT KÝ (Ẩn đi, bấm + mới hiện) */
        /* ========================================= */
        .modal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 240, 245, 0.85); backdrop-filter: blur(10px); z-index: 200;
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.show { opacity: 1; pointer-events: all; }
        
        .modal-content {
            background: #fff; width: 85%; border-radius: 25px; padding: 25px;
            box-shadow: 0 20px 40px rgba(255, 118, 155, 0.2); position: relative;
        }
        .close-modal { position: absolute; top: 15px; right: 15px; font-size: 20px; color: #ccc; cursor: pointer; }
        
        .modal-content textarea {
            width: 100%; border: 2px dashed #ffccd5; border-radius: 15px; padding: 15px;
            outline: none; font-family: 'Quicksand'; font-size: 14px; font-weight: 600; color: #5c4b41;
            margin-bottom: 15px; resize: none; background: #fffafb;
        }
        .flex-btn { display: flex; gap: 10px;}
        .btn-upload { flex: 1; padding: 12px; border-radius: 15px; font-weight: 700; border: 2px solid #ff769b; background: white; color: #ff769b;}
        .btn-save { flex: 1; padding: 12px; border-radius: 15px; font-weight: 700; border: none; background: #ff769b; color: white;}
        #image-preview { width: 100%; height: 120px; margin-top: 15px; border-radius: 15px; object-fit: cover; display: none; }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <div class="header">
            <div class="user-info">
                <!-- Thay avatar ở đây -->
                <img src="img/avatar.png" alt="Avatar" class="avatar" onerror="this.src='https://cdn-icons-png.flaticon.com/512/3135/3135715.png'">
                <span class="greeting">Xin chào, của chúng ta 💖</span>
            </div>
            <i class="fas fa-bell bell-icon"></i>
        </div>

        <!-- Banner Welcome -->
        <div class="welcome-banner">
            <div class="banner-text">
                <h3>Hôm nay là một ngày tuyệt! ✨</h3>
                <p>Cùng tạo nên những kỉ niệm đẹp nhé!</p>
            </div>
            <!-- Hình con thỏ ở góc banner -->
            <img src="img/cun.png" alt="Bunny" class="banner-mascot" onerror="this.style.display='none'; this.insertAdjacentHTML('afterend', '<span style=\'font-size: 40px;\'>🐰</span>');">
        </div>

        <!-- Menu Action -->
        <h2 class="section-title">Hôm nay, bạn muốn...</h2>
        <div class="action-menu">
            <div class="action-item" onclick="openModal()">
                <div class="action-circle">💖</div>
                <span>Viết tâm sự</span>
            </div>
            <div class="action-item" id="upload-widget-quick">
                <div class="action-circle">📸</div>
                <span>Thêm kỉ niệm</span>
            </div>
            <div class="action-item">
                <div class="action-circle">🎵</div>
                <span>Ghi âm nhạc</span>
            </div>
            <div class="action-item">
                <div class="action-circle">🥰</div>
                <span>Cảm xúc</span>
            </div>
        </div>

        <!-- KHO KỈ NIỆM (Hiển thị Data từ Firebase) -->
        <div class="gallery-header">
            <h2 class="section-title" style="margin: 0;">Kho kỉ niệm gần đây</h2>
            <a href="#" class="view-all">Xem tất cả ></a>
        </div>
        
        <!-- Dữ liệu Firebase sẽ đổ vào class memory-grid này -->
        <div id="diary-list" class="memory-grid">
            <div style="grid-column: span 2; text-align: center; color: #ffb6c1; font-size: 13px; padding-top: 20px;">Đang tải kỷ niệm... 🌸</div>
        </div>

        <!-- BOTTOM NAV BAR (Giống ảnh) -->
        <div class="bottom-nav">
            <div class="nav-item active"><i class="fas fa-home nav-icon"></i><span>Trang chủ</span></div>
            <div class="nav-item"><i class="fas fa-book-open nav-icon"></i><span>Kỉ niệm</span></div>
            
            <!-- NÚT ĐĂNG BÀI CHÍNH -->
            <button class="fab-button" onclick="openModal()"><i class="fas fa-plus"></i></button>
            
            <div class="nav-item"><i class="fas fa-smile nav-icon"></i><span>Cảm xúc</span></div>
            <div class="nav-item" onclick="logout()"><i class="fas fa-user nav-icon"></i><span>Thoát</span></div>
        </div>

        <!-- MODAL ĐĂNG BÀI ẨN -->
        <div class="modal-overlay" id="postModal">
            <div class="modal-content">
                <i class="fas fa-times close-modal" onclick="closeModal()"></i>
                <h3 style="color:#ff769b; margin-bottom:15px; font-family:'Nunito';">Lưu giữ khoảnh khắc 🌸</h3>
                <textarea id="diary-note" rows="3" placeholder="Ghi lại kỉ niệm đáng yêu này nhé..."></textarea>
                
                <div class="flex-btn">
                    <button id="upload-widget" class="btn-upload"><i class="fas fa-image"></i> Chọn Ảnh</button>
                    <button onclick="saveDiary()" class="btn-save"><i class="fas fa-paper-plane"></i> Gửi</button>
                </div>
                <img id="prev-img" src="" style="display:none; width: 100%; height: 150px; border-radius: 15px; margin-top: 15px; object-fit: cover;">
            </div>
        </div>

    </div>

    <!-- Firebase SDK (GIỮ NGUYÊN CỦA BẠN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, query, where, onSnapshot, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-Zj-83s3GW09RkAhMS4H8xWmLdi7loSI",
            authDomain: "photodiary-3d469.firebaseapp.com",
            projectId: "photodiary-3d469",
            storageBucket: "photodiary-3d469.firebasestorage.app",
            messagingSenderId: "102477469911",
            appId: "1:102477469911:web:13ed38ab426819fdb43892"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const currentUserId = "GIRL_USER_01"; 

        // CẤU HÌNH CLOUDINARY
        const cloudName = "djjinlx7t";
        const uploadPreset = "cunlun"; 

        let uploadedMediaUrl = "";
        let uploadedMediaType = "";

        const myWidget = window.cloudinary.createUploadWidget({
            cloudName: cloudName, 
            uploadPreset: uploadPreset,
            sources: ['local', 'camera', 'instagram'],
            styles: { palette: { window: "#FFFFFF", windowBorder: "#ff769b", tabIcon: "#ff769b", menuIcons: "#ff769b", textDark: "#000000", textLight: "#FFFFFF", link: "#ff769b", action: "#ff769b", inProgress: "#ff769b", complete: "#22C55E" } }
        }, (error, result) => {
            if (!error && result && result.event === "success") { 
                uploadedMediaUrl = result.info.secure_url;
                uploadedMediaType = result.info.resource_type; 
                document.getElementById('prev-img').src = uploadedMediaUrl;
                document.getElementById('prev-img').style.display = 'block';
            }
        });

        // Mở Cloudinary từ nút trong Modal hoặc nút Thêm ảnh ở màn hình chính
        document.getElementById("upload-widget").addEventListener("click", () => myWidget.open(), false);
        document.getElementById("upload-widget-quick").addEventListener("click", () => {
            openModal(); // Mở modal trước
            myWidget.open(); // Bật luôn khung chọn ảnh
        }, false);

        // Lưu Firebase
        window.saveDiary = async () => {
            const note = document.getElementById("diary-note").value;
            if (!note && !uploadedMediaUrl) return alert("Viết chút gì đó nha công chúa!");

            const id = "diary_" + Date.now();
            await setDoc(doc(db, "memories", id), {
                uid: currentUserId,
                content: note,
                mediaUrl: uploadedMediaUrl,
                mediaType: uploadedMediaType,
                createdAt: new Date().toISOString(),
                ts: Date.now()
            });

            // Reset
            document.getElementById("diary-note").value = "";
            uploadedMediaUrl = "";
            document.getElementById('prev-img').style.display = 'none';
            closeModal();
            alert("Đã lưu kỷ niệm thành công! 💖");
        };

        // Xóa Firebase
        window.deleteMemory = async (id) => {
            if(confirm("Bạn có chắc muốn xóa kỷ niệm này không?")) await deleteDoc(doc(db, "memories", id));
        };

        // Render Lưới ảnh (Grid)
        function loadMemories() {
            const q = query(collection(db, "memories"), where("uid", "==", currentUserId), orderBy("ts", "desc"));
            onSnapshot(q, (snap) => {
                let html = "";
                snap.forEach(d => {
                    const data = d.data();
                    let mediaHtml = "";
                    
                    // Render ảnh hoặc video đầy khung vuông
                    if (data.mediaUrl) {
                        mediaHtml = data.mediaType === 'video' 
                            ? `<video src="${data.mediaUrl}" autoplay muted loop></video>` 
                            : `<img src="${data.mediaUrl}">`;
                    } else {
                        // Nếu không có ảnh, tạo khung màu hồng chứa chữ
                        mediaHtml = `<div style="width:100%; height:100%; background:#fff2f4; display:flex; justify-content:center; align-items:center; padding:15px; text-align:center; font-size:12px; font-weight:700; color:#ff769b;">${data.content}</div>`;
                    }

                    // Text nằm đè lên chân ảnh (chỉ hiện nếu có text VÀ có ảnh)
                    let textOverlay = (data.content && data.mediaUrl) ? `<div class="overlay-text">${data.content}</div>` : "";

                    html += `
                        <div class="memory-card">
                            <button onclick="deleteMemory('${d.id}')" class="delete-btn"><i class="fas fa-times"></i></button>
                            ${mediaHtml}
                            ${textOverlay}
                        </div>
                    `;
                });
                document.getElementById("diary-list").innerHTML = html || `<div style="grid-column: span 2; text-align: center; color: #ffb6c1; font-size: 13px;">Chưa có kỉ niệm nào 🥺</div>`;
            });
        }

        window.logout = () => { location.href = "index.html"; };

        loadMemories();
    </script>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

    <!-- Script điều khiển Modal -->
    <script>
        function openModal() { document.getElementById('postModal').classList.add('show'); }
        function closeModal() { document.getElementById('postModal').classList.remove('show'); }
    </script>
</body>
</html>
