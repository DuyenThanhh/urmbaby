<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chúng mình - Diary of Us ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --p-pink: #ffafbd;
            --p-main: #ff758c;
            --p-bg: #fff1f3;
            --glass: rgba(255, 255, 255, 0.6);
            --text-color: #5d4037;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            font-family: 'Quicksand', sans-serif; 
            background: linear-gradient(180deg, #fff5f6 0%, #ffe4e9 100%);
            color: var(--text-color); overflow: hidden;
        }

        /* --- PHẦN THÔNG BÁO THU PHÍ --- */
        #paywall {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #ffafbd 0%, #ff758c 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            color: white;
        }
        .paywall-card {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 30px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            max-width: 350px;
        }
        .paywall-icon { font-size: 60px; margin-bottom: 20px; display: block; }
        .paywall-title { font-size: 22px; font-weight: 700; margin-bottom: 15px; }
        .paywall-desc { font-size: 16px; line-height: 1.5; margin-bottom: 25px; opacity: 0.9; }
        .paywall-btn {
            background: #fff;
            color: #ff758c;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            display: inline-block;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: 0.3s;
            border: none;
            cursor: pointer;
            font-family: 'Quicksand', sans-serif;
        }
        .paywall-btn:active { transform: scale(0.95); }
        /* ----------------------------- */

        .app-container { 
            width: 100%; height: 100%; max-width: 500px; margin: 0 auto; 
            display: flex; flex-direction: column; position: relative;
            background: url('https://www.transparenttextures.com/patterns/pinstriped-suit.png');
        }

        .header { 
            padding: 40px 20px 20px; text-align: center; 
            background: url('img/6.png') no-repeat center bottom;
            background-size: cover;
        }
        .header h1 { font-size: 20px; font-weight: 700; margin: 0 0 25px; }

        .avatar-pair { 
            display: flex; justify-content: center; align-items: center; 
            position: relative; margin-bottom: 20px;
        }
        .avatar {
            width: 100px; height: 100px; border-radius: 50%;
            border: 4px solid #fff; box-shadow: 0 8px 20px rgba(255, 175, 189, 0.3);
            background: #fff; overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .rabbit { transform: translateX(15px); z-index: 2; }
        .bear { transform: translateX(-15px); z-index: 1; }

        .day-counter {
            display: inline-flex; align-items: center; gap: 8px;
            background: #fff; padding: 8px 20px; border-radius: 30px;
            font-size: 14px; font-weight: 700; color: var(--p-main);
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.15);
            border: 1px solid rgba(255, 117, 140, 0.1);
        }

        .menu-container { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }
        
        .menu-item {
            background: var(--glass); backdrop-filter: blur(10px);
            border-radius: 25px; padding: 18px 20px; margin-bottom: 15px;
            display: flex; align-items: center; gap: 15px;
            text-decoration: none; color: var(--text-color);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px rgba(255, 175, 189, 0.1);
            transition: 0.3s;
        }
        .menu-item:active { transform: scale(0.97); background: #fff; }

        .menu-icon {
            width: 45px; height: 45px; border-radius: 15px;
            background: #fff; display: flex; align-items: center; 
            justify-content: center; font-size: 20px; color: var(--p-main);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .menu-text { flex: 1; font-weight: 700; font-size: 15px; }
        .menu-arrow { opacity: 0.3; font-size: 14px; }
        
        .badge {
            background: #ff758c; color: #fff; padding: 2px 10px;
            border-radius: 10px; font-size: 11px; font-weight: 700;
        }

        .bottom-nav { 
            position: absolute; bottom: 0; width: 100%; height: 85px; 
            background: #fff; display: flex; justify-content: space-around; 
            align-items: center; padding-bottom: 25px; 
            border-top: 1px solid #f0f0f0; border-radius: 40px 40px 0 0; z-index: 100;
        }
        .nav-item { color: #ccc; font-size: 10px; text-align: center; text-decoration: none; }
        .nav-item.active { color: var(--p-main); }
        .nav-item i { font-size: 22px; margin-bottom: 4px; }
        .center-btn { 
            width: 55px; height: 55px; background: linear-gradient(45deg, var(--p-main), #ffafbd); 
            border-radius: 50%; color: white; display: flex; align-items: center; 
            justify-content: center; font-size: 26px; margin-top: -50px; 
            box-shadow: 0 10px 20px rgba(255, 117, 140, 0.4); border: 4px solid #fff;
        }
    </style>
</head>
<body>

<!-- Màn hình thu phí -->
<div id="paywall">
    <div class="paywall-card">
        <span class="paywall-icon">🥟🥟</span>
        <div class="paywall-title">Opps! Hết lượt miễn phí</div>
        <div class="paywall-desc">
            Cần phải trả phí <b>2 cái bánh bao nóng hổi</b> nhất mới được vào trang này. 
            <br><br>
            <i>Nhắn cho Bành ngay đi nè! 💬</i>
        </div>
        <!-- Thay link Facebook/Zalo của bạn vào đây -->
        <a href="https://m.me/yourid" class="paywall-btn" onclick="requestBuns()">Gửi bánh bao ngay!</a>
    </div>
</div>

<div class="app-container">
    <div class="header">
        <h1>Của chúng ta 💞</h1>
        <div class="avatar-pair">
            <div class="avatar rabbit"><img src="img/cun.png" alt="Rabbit"></div>
            <div class="avatar bear"><img src="img/banh.png" alt="Bear"></div>
        </div>
        <div class="day-counter">
            <i class="fa-solid fa-heart fa-beat" style="font-size: 12px;"></i>
            <span id="days-count">...</span> ngày bên nhau
            <i class="fa-solid fa-cake-candles" style="font-size: 12px; opacity: 0.5;"></i>
        </div>
    </div>

    <div class="menu-container">
        <a href="about.html" class="menu-item">
            <div class="menu-icon"><i class="fa-solid fa-address-card"></i></div>
            <div class="menu-text">Thông tin của chúng ta</div>
            <i class="fa-solid fa-chevron-right menu-arrow"></i>
        </a>
        <a href="feature.html" class="menu-item">
            <div class="menu-icon"><i class="fa-solid fa-list-check"></i></div>
            <div class="menu-text">Những điều muốn làm</div>
            <i class="fa-solid fa-chevron-right menu-arrow"></i>
        </a>
        <a href="x.html" class="menu-item">
            <div class="menu-icon"><i class="fa-solid fa-images"></i></div>
            <div class="menu-text">Album chung</div>
            <i class="fa-solid fa-chevron-right menu-arrow"></i>
        </a>
        <a href="y.html" class="menu-item">
            <div class="menu-icon"><i class="fa-solid fa-gear"></i></div>
            <div class="menu-text">Cài đặt</div>
            <i class="fa-solid fa-chevron-right menu-arrow"></i>
        </a>
        <a href="index.html" class="menu-item">
            <div class="menu-icon"><i class="fa-solid fa-jar"></i></div>
            <div class="menu-text">Thoát</div>
            <div class="badge">122</div>
            <i class="fa-solid fa-chevron-right menu-arrow"></i>
        </a>
    </div>

    <div class="bottom-nav">
        <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i><br>Trang chủ</a>
        <a href="kiniem.html" class="nav-item"><i class="fa-solid fa-heart"></i><br>Kỉ niệm</a>
        <div class="center-btn">+</div>
        <a href="emotion.html" class="nav-item"><i class="fa-solid fa-face-smile"></i><br>Cảm xúc</a>
        <a href="us.html" class="nav-item active"><i class="fa-solid fa-users"></i><br>Chúng mình</a>
    </div>
</div>

<script>
    // Hàm tính ngày yêu nhau
    function calculateDays() {
        const startDate = new Date('2025-04-25'); 
        const today = new Date();
        const diffTime = Math.abs(today - startDate);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
        document.getElementById('days-count').innerText = diffDays;
    }

    calculateDays();

    // Xử lý khi bấm nút gửi bánh bao
    function requestBuns() {
        alert("Đang chuyển hướng đến chỗ Bành để đòi bánh bao... Gửi xong mới được vào nha!");
        // Sau khi họ bấm OK ở alert, trang web sẽ mở link nhắn tin ở tab mới
        // Trong thực tế, bạn có thể bỏ dòng dưới nếu muốn họ "mắc kẹt" luôn ở đây đến khi bạn cho vào
        // document.getElementById('paywall').style.display = 'none'; 
    }

    document.querySelector('.center-btn').onclick = function() {
        window.location.href = 'kiniem.html';
    };
</script>

</body>
</html>
