<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chi tiết kỉ niệm ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --p-main: #ff8fab;
            --p-soft: #ffb7c5;
            --p-bg: #fff5f7;
            --text: #5d4037;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
       body, html { 
    margin: 0; padding: 0; width: 100%; min-height: 100%;
    font-family: 'Quicksand', sans-serif;
    background-color: #fce4ec; /* Màu nền hồng nhạt trung tính bên ngoài */
    color: var(--text);
}
.app-container { 
    width: 100%; 
    max-width: 500px; 
    margin: 0 auto; 
    min-height: 100vh; /* Cao bằng màn hình điện thoại */
    padding: 20px; 
    padding-bottom: 50px;
    position: relative;
    
    /* ĐƯA HÌNH NỀN VÀO ĐÂY */
    background: url('img/5.png') no-repeat center center;
    background-size: cover;
    background-attachment: scroll; /* Để nền trượt theo nội dung */
    
    /* Thêm bóng đổ để trông như một chiếc điện thoại đang đặt trên bàn */
    box-shadow: 0 0 30px rgba(0,0,0,0.1);
}
        /* Top Bar Cute */
        .top-bar { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; 
        }
        .back-btn { 
            width: 42px; height: 42px; background: #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); color: var(--p-main); 
            text-decoration: none; border:none; cursor: pointer;
        }

        /* Notebook/Scrapbook Page */
       .notebook-page {
    background: rgba(255, 255, 255, 0.85); /* Trắng mờ 85% */
    backdrop-filter: blur(10px); /* Hiệu ứng kính mờ cho sang */
    border-radius: 25px;
    padding: 30px 20px;
    margin-top: 10px;
    box-shadow: 0 10px 25px rgba(255, 143, 171, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.5);
}

        /* Hiệu ứng ghim giấy */
        .tape {
            position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
            width: 100px; height: 30px; background: rgba(255, 255, 255, 0.5);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .diary-date { 
            display: inline-block; padding: 5px 15px; background: var(--p-main);
            color: #fff; border-radius: 20px; font-size: 11px; font-weight: 700;
            margin-bottom: 15px; box-shadow: 0 4px 10px rgba(255,143,171,0.3);
        }

        .diary-title { 
            font-family: 'Dancing Script', cursive; font-size: 32px; 
            color: var(--p-main); margin-bottom: 15px; display: block;
        }

        .content-area {
            line-height: 1.8; font-size: 16px; white-space: pre-wrap;
            color: #666; margin-bottom: 25px; min-height: 80px;
            border-left: 3px solid var(--p-soft); padding-left: 15px;
        }

        /* Polaroid Gallery (Ảnh dán ngẫu hứng) */
        .gallery { 
            display: flex; flex-wrap: wrap; gap: 15px; margin-top: 25px;
            justify-content: center;
        }
        .polaroid {
            background: #fff; padding: 10px 10px 25px;
            width: calc(45% - 5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            transform: rotate(var(--r)); border: 1px solid #f0f0f0;
            transition: 0.3s;
        }
        .polaroid:active { transform: scale(1.1) rotate(0deg); z-index: 10; }
        .polaroid img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 2px; }
        .polaroid-caption { 
            font-family: 'Dancing Script', cursive; font-size: 14px; 
            text-align: center; margin-top: 8px; color: #888; 
        }

        /* Voice Note UI mới */
        .voice-section { margin: 25px 0; }
        .voice-pill {
            background: linear-gradient(90deg, #ff8fab, #ffb7c5);
            color: #fff; border-radius: 50px; padding: 15px 25px;
            display: flex; align-items: center; gap: 15px;
            cursor: pointer; box-shadow: 0 10px 20px rgba(255, 143, 171, 0.3);
            border: none; width: 100%;
        }
        .play-circle {
            width: 35px; height: 35px; background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--p-main); font-size: 14px;
        }

        /* Info Tags (Stickers) */
        .info-board {
            display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px;
        }
        .sticker {
            background: #fff; padding: 8px 15px; border-radius: 12px;
            font-size: 12px; font-weight: 700; color: #888;
            box-shadow: 0 4px 8px rgba(0,0,0,0.03);
            display: flex; align-items: center; gap: 6px;
            border: 1px dashed var(--p-soft);
        }
        .sticker i { color: var(--p-main); }
        .location-sticker {
            background: #fff0f3; color: var(--p-main); width: 100%;
            border: none; margin-top: 5px; cursor: pointer; text-decoration: none;
        }

        #loading { 
            position: fixed; inset:0; background: var(--p-bg); 
            z-index: 100; display: flex; align-items: center; 
            justify-content: center; flex-direction: column; gap: 15px; 
        }
    </style>
</head>
<body>

<div id="loading">
    <i class="fa-solid fa-wand-magic-sparkles fa-spin" style="color:var(--p-main); font-size:40px;"></i>
    <p style="font-weight: 700; color: var(--p-main);">Đang mở rương kỉ niệm...</p>
</div>

<div class="app-container">
    <div class="top-bar">
        <button onclick="history.back()" class="back-btn"><i class="fa-solid fa-chevron-left"></i></button>
        <div style="
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    color: #fff;
    background: linear-gradient(45deg, #ff8fab, #ffb7c5);
    padding: 5px 20px;
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(255, 143, 171, 0.4);
    text-align: center;
    margin: 0 auto;
    letter-spacing: 1px;
">
    KỈ NIỆM CỦA BÉ ❤️
</div>
        <div class="back-btn" style="opacity:0"><i class="fa-solid fa-heart"></i></div>
    </div>

    <div class="notebook-page">
        <div class="tape"></div>
        <div class="diary-date" id="v-date">...</div>
        <span class="diary-title" id="v-title">Dear Diary, 💖</span>
        
        <div class="content-area" id="v-content">Đang hồi tưởng...</div>

        <!-- Voice Section -->
        <div id="voice-wrap" style="display: none;" class="voice-section">
            <button class="voice-pill" onclick="playVoice()">
                <div class="play-circle"><i class="fa-solid fa-play" id="playIcon"></i></div>
                <div style="text-align: left;">
                    <div style="font-weight: 800; font-size: 14px;">Lời nhắn gửi</div>
                    <div style="font-size: 10px; opacity: 0.9;">Nhấn để nghe giọng bé kể</div>
                </div>
            </button>
        </div>

        <!-- Info Board (Stickers) -->
        <div class="info-board">
            <div class="sticker"><i class="fa-solid fa-face-smile"></i> <span id="v-feeling">...</span></div>
            <div class="sticker"><i class="fa-solid fa-wand-sparkles"></i> <span id="v-activity">...</span></div>
            <div class="sticker"><i class="fa-solid fa-user-group"></i> <span id="v-companion">...</span></div>
            <a id="v-location-link" target="_blank" class="sticker location-sticker">
                <i class="fa-solid fa-location-dot"></i> <span id="v-location">Vị trí bí mật ✨</span>
            </a>
        </div>
    </div>

    <!-- Polaroid Gallery -->
    <div class="gallery" id="v-gallery"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB-Zj-83s3GW09RkAhMS4H8xWmLdi7loSI",
        authDomain: "photodiary-3d469.firebaseapp.com",
        projectId: "photodiary-3d469",
        storageBucket: "photodiary-3d469.firebasestorage.app",
        messagingSenderId: "102477469911",
        appId: "1:102477469911:web:13ed38ab426819fdb43892"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(window.location.search);
    const dateId = params.get('date');
    const index = parseInt(params.get('index') || 0);

    async function loadDetail() {
        if(!dateId) return;
        try {
            const snap = await getDoc(doc(db, "daily_memories", dateId));
            if(snap.exists()) {
                const moments = snap.data().moments;
                if(moments && moments[index]) {
                    renderData(moments[index], dateId);
                }
            }
        } catch (e) { console.error(e); }
        document.getElementById('loading').style.display = 'none';
    }

    function renderData(m, date) {
        // Render Text & Meta
        document.getElementById('v-date').innerText = "Ngày " + date.split('-').reverse().join('/') + " • " + (m.time?.split('T')[1]?.substring(0,5) || "--:--");
        document.getElementById('v-content').innerText = m.content || "(Không có nội dung)";
        document.getElementById('v-feeling').innerText = m.feeling;
        document.getElementById('v-activity').innerText = m.activity || "Cùng nhau";
        document.getElementById('v-companion').innerText = m.companion || "Cùng nhau";

        // Xử lý Vị trí & Google Maps link (Đã fix logic link)
        const locText = document.getElementById('v-location');
        const locLink = document.getElementById('v-location-link');
        
        locText.innerText = m.address || "Vị trí bí mật ✨";
        if(m.addressurl) {
            locLink.href = m.addressurl;
            locLink.style.display = 'flex';
        } else {
            locLink.style.display = 'none'; // Ẩn link nếu không có tọa độ GPS
        }

        // Gallery Polaroid với góc nghiêng ngẫu nhiên
        if(m.images && m.images.length > 0) {
            const gallery = document.getElementById('v-gallery');
            gallery.innerHTML = m.images.map((img, i) => {
                const rotation = (Math.random() * 10 - 5).toFixed(1); // Nghiêng từ -5 đến 5 độ
                return `
                <div class="polaroid" style="--r: ${rotation}deg">
                    <img src="${img}" onclick="window.open('${img}')">
                    <div class="polaroid-caption">Memory #${i+1}</div>
                </div>`;
            }).join('');
        }

        // Audio
        if(m.audio && m.audio.trim() !== "") {
            document.getElementById('voice-wrap').style.display = 'block';
            window.audioUrl = m.audio;
        }
    }

    const audioPlayer = new Audio();
    window.playVoice = () => {
        const icon = document.getElementById('playIcon');
        if(audioPlayer.src !== window.audioUrl) audioPlayer.src = window.audioUrl;

        if(audioPlayer.paused) {
            audioPlayer.play();
            icon.classList.replace('fa-play', 'fa-pause');
        } else {
            audioPlayer.pause();
            icon.classList.replace('fa-pause', 'fa-play');
        }
        audioPlayer.onended = () => icon.classList.replace('fa-pause', 'fa-play');
    };

    loadDetail();
</script>
<script src="bgm.js"></script>
</body>
</html>
