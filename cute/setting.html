<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cài đặt - Ngọt ngào ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --p-main: #ff8fab;
            --p-soft: #ffe4e9;
            --text: #5d4037;
            --bg: #fff5f7;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Quicksand', sans-serif; background: var(--bg); overflow: hidden; }

        .app-container {
            width: 100%; height: 100%; max-width: 450px; margin: 0 auto;
            background: url('img/10.png') no-repeat center center;
            background-size: cover; position: relative;
            display: flex; flex-direction: column;
        }

        .header { padding: 30px 20px 15px; display: flex; align-items: center; gap: 15px; z-index: 10; }
        .back-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            color: var(--p-main); cursor: pointer; border: none;
        }

        .content { flex: 1; overflow-y: auto; padding: 10px 20px 100px; }

        .setting-group {
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px);
            border-radius: 30px; padding: 20px; border: 1.5px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 20px; box-shadow: 0 8px 25px rgba(255, 143, 171, 0.1);
        }

        .group-title {
            font-size: 13px; font-weight: 700; color: var(--p-main);
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;
            display: flex; align-items: center; gap: 8px;
        }

        .item { margin-bottom: 15px; }
        .inp {
            width: 100%; padding: 12px 18px; border-radius: 15px;
            border: 1px solid #ffeef1; background: white; outline: none;
            font-family: 'Quicksand'; font-size: 14px; color: var(--text);
        }

        .switch-item {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 12px 18px; border-radius: 15px; border: 1px solid #ffeef1;
        }

        .switch { position: relative; display: inline-block; width: 45px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #eee; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--p-main); }
        input:checked + .slider:before { transform: translateX(21px); }

        .save-btn {
            width: 100%; padding: 18px; border-radius: 25px; border: none;
            background: linear-gradient(135deg, #ffafbd, #ff748c);
            color: white; font-weight: 700; font-size: 16px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(255, 143, 171, 0.3); margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="header">
            <!-- Giữ nguyên history.back() như yêu cầu ban đầu -->
            <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-chevron-left"></i></button>
            <div style="font-weight: 700; font-size: 18px; color: #ff748c;">Cài đặt ⚙️</div>
        </div>

        <div class="content">
            <!-- 1. GIAO DIỆN CHỦ ĐỀ -->
            <div class="setting-group">
                <div class="group-title"><i class="fa-solid fa-masks-theater"></i> Chế độ hiển thị</div>
                <div class="item">
                    <select id="appTheme" class="inp">
                        <option value="cute">🌸 Ngọt ngào (Bé iu - Anh iu)</option>
                        <option value="dark-bold">🖤 Táo bạo (Chủ Nhân - Người phục tùng)</option>
                    </select>
                </div>
            </div>

            <!-- 2. NHẠC NỀN -->
            <div class="setting-group">
                <div class="group-title"><i class="fa-solid fa-music"></i> Âm thanh hệ thống</div>
                <div class="item switch-item">
                    <label style="font-size: 14px; font-weight: 600; color: var(--text);">Phát nhạc nền</label>
                    <label class="switch">
                        <!-- Thêm onchange để phản ứng ngay lập tức -->
                        <input type="checkbox" id="autoMusic" onchange="toggleMusicImmediately(this)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <button class="save-btn" onclick="handleSave()">Lưu thay đổi ✨</button>
        </div>
    </div>
    <script src="bgm.js"></script> 
    <script>
        console.log("[SETTINGS] Script settings.html loaded.");

        // 1. Lấy thẻ nhạc từ trang index.html (ngoài cùng)
        // Đảm bảo rằng thẻ audio trên trang chính có ID là 'global-music'
        const globalAudio = window.top.document.getElementById('global-music');
        console.log("[SETTINGS] globalAudio element found:", globalAudio ? 'Yes' : 'No', globalAudio);

        // 2. Gạt nút là nhạc Tắt/Mở ngay lập tức
        function toggleMusicImmediately(checkbox) {
            console.log("[SETTINGS] toggleMusicImmediately() called. Checkbox checked:", checkbox.checked);
            
            if (!globalAudio) {
                console.error("[SETTINGS] globalAudio not found. Cannot toggle music.");
                return;
            }
            
            if (checkbox.checked) {
                globalAudio.play().then(() => {
                    console.log("[SETTINGS] Music requested to play.");
                }).catch(e => {
                    console.error("[SETTINGS] Error playing music:", e);
                    // Thông báo cho người dùng nếu trình duyệt chặn tự động phát
                    alert("Trình duyệt chặn tự động phát nhạc. Vui lòng tương tác với trang chính để phát.");
                });
                localStorage.setItem('musicStatus', 'playing');
                console.log("[SETTINGS] localStorage musicStatus set to 'playing'.");
            } else {
                globalAudio.pause();
                localStorage.setItem('musicStatus', 'paused');
                console.log("[SETTINGS] Music paused. localStorage musicStatus set to 'paused'.");
            }
            console.log("[SETTINGS] Current parent audio state (paused):", globalAudio.paused);
        }

        // 3. Nhấn nút Lưu là chuyển trang (chỉ khi chọn dark-bold)
        function handleSave() {
            console.log("[SETTINGS] handleSave() called.");
            const selectedTheme = document.getElementById('appTheme').value;
            console.log("[SETTINGS] Selected theme:", selectedTheme);

            // Cập nhật musicStatus vào localStorage. Trạng thái nhạc đã được xử lý bởi toggleMusicImmediately
            // nên không cần gọi lại globalAudio.play/pause ở đây.
            // Chỉ cần đảm bảo localStorage được lưu trữ đúng.
            const isMusicEnabled = document.getElementById('autoMusic').checked;
            localStorage.setItem('musicStatus', isMusicEnabled ? 'playing' : 'paused');
            console.log("[SETTINGS] Final musicStatus saved to localStorage:", localStorage.getItem('musicStatus'));

            if (selectedTheme === 'dark-bold') {
                console.log("[SETTINGS] 'dark-bold' theme selected. Asking for confirmation.");
                if (confirm("⚠️ CHẾ ĐỘ TÁO BẠO:\nBạn chuẩn bị bước vào không gian của Chủ nhân & Người phục tùng. Mọi hành động sẽ được kiểm soát nghiêm ngặt.\nBạn có chấp nhận không?")) {
                    localStorage.setItem('appTheme', 'dark-bold');
                    console.log("[SETTINGS] User confirmed 'dark-bold'. Setting appTheme in localStorage and navigating window.top.");
                    window.top.location.href = '../baobao/index.html'; 
                } else {
                    console.log("[SETTINGS] User cancelled 'dark-bold' selection.");
                    // Nếu không xác nhận, giữ nguyên theme hiện tại trên UI và trong localStorage
                    const currentThemeStored = localStorage.getItem('appTheme') || 'cute';
                    document.getElementById('appTheme').value = currentThemeStored;
                }
            } else { // Chế độ 'cute'
                localStorage.setItem('appTheme', 'cute');
                console.log("[SETTINGS] 'cute' theme selected. Setting appTheme in localStorage.");
                alert("Đã lưu cài đặt ngọt ngào! ✨");
                history.back(); // Quay lại trang trước
                console.log("[SETTINGS] Navigating back using history.back().");
            }
        }

        // 4. Khi load trang: Hiển thị đúng trạng thái đang có
        window.onload = () => {
            console.log("[SETTINGS] Window onload event fired.");
            const musicStatus = localStorage.getItem('musicStatus');
            const theme = localStorage.getItem('appTheme');
            
            // Nếu chưa từng tắt thì mặc định là bật
            const isMusicChecked = (musicStatus !== 'paused');
            document.getElementById('autoMusic').checked = isMusicChecked;
            document.getElementById('appTheme').value = theme || 'cute';
            
            console.log("[SETTINGS] UI initialized: autoMusic checked:", isMusicChecked, "appTheme value:", document.getElementById('appTheme').value);
            
            // Quan trọng: Gọi toggleMusicImmediately để đồng bộ trạng thái nhạc ngay khi trang cài đặt được mở
            // Điều này đảm bảo khi bạn mở trang cài đặt, nhạc vẫn đúng trạng thái (phát/dừng)
            // mà không cần phải gạt nút hay bấm lưu.
            toggleMusicImmediately(document.getElementById('autoMusic'));
        };
    </script>
</body>
</html>
