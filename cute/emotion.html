<!DOCTYPE html>
<html lang="vi">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
     <title>Nhật ký của chúng ta - Thế kỷ Kỉ niệm ✨</title>
     <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
     <style>
          :root {
               --p-pink: #ffafbd;
               --p-main: #ff758c;
               --p-bg: #fff5f6;
               --text-dark: #5d4037;
               --glass: rgba(255, 255, 255, 0.8);
          }

          * {
               box-sizing: border-box;
               -webkit-tap-highlight-color: transparent;
          }

          body,
          html {
               margin: 0;
               padding: 0;
               width: 100%;
               height: 100%;
               font-family: 'Quicksand', sans-serif;
               background: var(--p-bg);
               color: var(--text-dark);
               overflow: hidden;
          }

          .app-container {
               width: 100%;
               height: 100%;
               max-width: 450px;
               margin: 0 auto;
               display: flex;
               flex-direction: column;
               position: relative;
               background: #fff;
          }

          /* Header phong cách Mockup */
          .header {
               padding: 40px 20px 20px;
               text-align: center;
               background: url('img/7.png') no-repeat center bottom;
               background-size: cover;
          }

          .top-nav-row {
               display: flex;
               justify-content: center;
               align-items: center;
               margin-bottom: 15px;
          }

          .fonth1 {
               color: #F472B6 !important;
               font-style: italic;
               font-size: 2.5rem;
               text-align: center;
               text-shadow: 2px 2px 4px #FCE7F3;
               font-family: 'Comic Sans MS', cursive, sans-serif;

               width: 100%;
               margin: 0 auto;
          }

          .btn-circle {
               width: 40px;
               height: 40px;
               border-radius: 50%;
               background: #fff;
               display: flex;
               align-items: center;
               justify-content: center;
               box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
               color: var(--p-main);
               font-size: 14px;
          }

          .header h1 {
               font-size: 22px;
               margin: 0;
               font-weight: 700;
               color: var(--text-dark);
          }

          .header p {
               margin: 5px 0 0;
               font-size: 12px;
               opacity: 0.6;
               color: #8d6e63;
          }

          /* Search Bar xịn */
          .search-area {
               padding: 0 20px 15px;

               background: url('img/9.png') no-repeat center center;





          }


          .search-box {
               background: #fdf0f2;
               border-radius: 25px;
               padding: 12px 18px;
               display: flex;
               align-items: center;
               gap: 10px;
               border: 1px solid rgba(255, 175, 189, 0.2);
          }

          .search-box input {
               border: none;
               background: none;
               outline: none;
               width: 100%;
               font-family: inherit;
               font-size: 14px;
               color: var(--text-dark);
          }

          /* Tabs lọc thời gian */
          .tabs {
               display: flex;
               gap: 10px;
               padding: 5px 20px 15px;
               overflow-x: auto;
               scrollbar-width: none;
               background: url('img/9.png') no-repeat center center;


          }

          .tabs::-webkit-scrollbar {
               display: none;
          }

          .tab-item {
               padding: 10px 20px;
               background: #fff;
               border-radius: 18px;
               font-size: 12px;
               white-space: nowrap;
               border: 1px solid #eee;
               transition: 0.3s;
               display: flex;
               align-items: center;
               gap: 6px;
               color: #888;
          }

          .tab-item i {
               font-size: 14px;
          }

          .tab-item.active {
               background: var(--p-main);
               color: #fff;
               border-color: var(--p-main);
               font-weight: 700;
               box-shadow: 0 5px 15px rgba(255, 117, 140, 0.3);
          }

          /* Content List */
          .main-content {
               flex: 1;
               overflow-y: auto;
               padding: 0 20px 100px;
               scroll-behavior: smooth;
               background: url('img/9.png') no-repeat center bottom;
               background-size: cover;
               opacity: 0.8;
          }

          .group-title {
               font-size: 16px;
               font-weight: 700;
               margin: 25px 0 15px;
               color: var(--p-main);
               display: flex;
               align-items: center;
               justify-content: space-between;
          }

          .group-title span {
               font-size: 11px;
               font-weight: 400;
               color: #bbb;
          }

          /* Card Kỉ niệm chuẩn Mockup */
          .m-card {
               background: #fff;
               border-radius: 28px;
               padding: 15px;
               margin-bottom: 15px;
               display: flex;
               gap: 15px;
               box-shadow: 0 10px 25px rgba(255, 175, 189, 0.15);
               position: relative;
               border: 1px solid rgba(255, 175, 189, 0.1);
               animation: fadeIn 0.4s ease;
          }

          .m-thumb {
               width: 95px;
               height: 95px;
               border-radius: 22px;
               object-fit: cover;
          }

          .m-info {
               flex: 1;
               display: flex;
               flex-direction: column;
               justify-content: space-between;
          }

          .m-title {
               font-size: 15px;
               font-weight: 700;
               margin: 0 0 5px;
               color: #444;
          }

          .m-desc {
               font-size: 12px;
               color: #8d6e63;
               line-height: 1.5;
               display: -webkit-box;
               -webkit-line-clamp: 2;
               -webkit-box-orient: vertical;
               overflow: hidden;
          }

          .m-stats {
               display: flex;
               gap: 12px;
               margin-top: 10px;
               font-size: 11px;
               color: #aaa;
          }

          .m-stats span {
               display: flex;
               align-items: center;
               gap: 4px;
          }

          .m-badge {
               position: absolute;
               bottom: 15px;
               right: 15px;
               padding: 5px 10px;
               background: #fff0f3;
               border-radius: 12px;
               font-size: 10px;
               color: var(--p-main);
               font-weight: 700;
               display: flex;
               align-items: center;
               gap: 4px;
          }

          /* Filter Drawer */
          .drawer-mask {
               position: fixed;
               top: 0;
               left: 0;
               width: 100%;
               height: 100%;
               background: rgba(0, 0, 0, 0.4);
               z-index: 1000;
               display: none;
               backdrop-filter: blur(4px);
          }

          .drawer {
               position: fixed;
               bottom: 0;
               left: 0;
               width: 100%;
               background: #fff;
               border-radius: 40px 40px 0 0;
               padding: 35px 25px;
               z-index: 1001;
               transform: translateY(100%);
               transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1);
          }

          .drawer.show {
               transform: translateY(0);
          }

          .drawer-line {
               width: 50px;
               height: 5px;
               background: #f0f0f0;
               border-radius: 10px;
               margin: -15px auto 25px;
          }

          /* Bottom Nav */
          .bottom-nav {
               position: absolute;
               bottom: 0;
               width: 100%;
               height: 85px;
               background: #fff;
               display: flex;
               justify-content: space-around;
               align-items: center;
               padding-bottom: 25px;
               border-top: 1px solid #f8f8f8;
               border-radius: 40px 40px 0 0;
               z-index: 100;
               box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.02);
          }

          .nav-link {
               color: #ddd;
               font-size: 10px;
               text-align: center;
               text-decoration: none;
          }

          .nav-link.active {
               color: var(--p-main);
          }

          .nav-link i {
               font-size: 22px;
               margin-bottom: 5px;
          }

          .add-btn {
               width: 58px;
               height: 58px;
               background: linear-gradient(45deg, var(--p-main), #ffafbd);
               border-radius: 50%;
               color: #fff;
               display: flex;
               align-items: center;
               justify-content: center;
               font-size: 26px;
               margin-top: -55px;
               box-shadow: 0 10px 25px rgba(255, 117, 140, 0.4);
               border: 4px solid #fff;
          }

          @keyframes fadeIn {
               from {
                    opacity: 0;
                    transform: translateY(15px);
               }

               to {
                    opacity: 1;
                    transform: translateY(0);
               }
          }

          .mascot-img {
               position: absolute;
               right: 10px;
               top: 15px;
               width: 60px;
               pointer-events: none;
          }
          /* Style cho lớp Thư mục/Nhóm */
.folder-item {
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    border: 1px solid var(--p-soft);
    cursor: pointer;
    transition: 0.3s;
}
.folder-item:active { transform: scale(0.98); }
.folder-info { display: flex; align-items: center; gap: 15px; }
.folder-icon { width: 45px; height: 45px; border-radius: 12px; background: var(--p-bg); color: var(--p-main); display: flex; align-items: center; justify-content: center; font-size: 20px; }
.folder-name { font-weight: 700; color: var(--text-dark); }
.folder-count { font-size: 12px; color: #aaa; }
     </style>
</head>

<body>

     <div class="app-container">
          <!-- Header -->
          <div class="header">
               <img url="img/banh.png" class="mascot-img">
               <div class="top-nav-row">
                    <h1 class="fonth1">Nhật kí của em bé</h1>
               </div>
               <p>Mỗi khoảnh khắc đều đáng nhớ ❤️</p>
          </div>

          <!-- Search Area -->
          <div class="search-area">
               <div class="search-box">
                    <i class="fa-solid fa-search" style="color: var(--p-pink);"></i>
                    <input type="text" id="searchInput" placeholder="Tìm theo từ khóa, cảm xúc..."
                         oninput="searchMemories()">
               </div>
          </div>

          <!-- TABS: Logic Ngày/Tuần/Tháng/Năm/Thế kỷ -->
          <div class="tabs" id="timeTabs">
               <div class="tab-item" data-range="today"><i class="fa-solid fa-calendar-day"></i> H.Nay</div>
               <div class="tab-item" data-range="week"><i class="fa-solid fa-calendar-week"></i> Tuần</div>
               <div class="tab-item" data-range="month"><i class="fa-solid fa-calendar-days"></i> Tháng</div>
               <div class="tab-item" data-range="year"><i class="fa-solid fa-calendar-check"></i> Năm</div>
               <div class="tab-item" data-range="century"><i class="fa-solid fa-star"></i> Thế kỷ</div>
          </div>

          <!-- Content -->
          <div class="main-content" id="listContent">
               <div style="text-align:center; margin-top:100px; opacity:0.3;">
                    <i class="fa-solid fa-wand-magic-sparkles fa-spin fa-2x"></i>
                    <p>Đang dệt lại kỉ niệm...</p>
               </div>
          </div>

          <!-- Filter Drawer -->
          <div class="drawer-mask" id="mask" onclick="toggleFilter(false)"></div>
          <div class="drawer" id="filterDrawer">
               <div class="drawer-line"></div>
               <h2 style="margin:0 0 25px; font-size:18px;">🌸 Bộ lọc nâng cao</h2>
               <!-- (Bạn có thể thêm các option cảm xúc vào đây như bản trước) -->
               <button onclick="toggleFilter(false)"
                    style="width:100%; padding:18px; background:var(--p-main); color:#fff; border:none; border-radius:25px; font-weight:700; font-family:inherit; box-shadow: 0 10px 20px rgba(255,117,140,0.2);">Xác
                    nhận bộ lọc</button>
          </div>

          <!-- Bottom Nav -->
          <div class="bottom-nav">
               <a href="home.html" class="nav-link"><i class="fa-solid fa-house"></i><br>Home</a>
               <a href="kiniem.html" class="nav-link"><i class="fa-solid fa-heart"></i><br>Kỉ niệm</a>
               <div class="add-btn" onclick="location.href='template.html'">+</div>
               <a href="emotion.html" class="nav-link active"><i class="fa-solid fa-face-smile"></i><br>Cảm xúc</a>
               <a href="us.html" class="nav-link"><i class="fa-solid fa-users"></i><br>Chúng mình</a>
          </div>
     </div>
    <script src="bgm.js"></script>

   <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB-Zj-83s3GW09RkAhMS4H8xWmLdi7loSI",
        authDomain: "photodiary-3d469.firebaseapp.com",
        projectId: "photodiary-3d469",
        storageBucket: "photodiary-3d469.firebasestorage.app",
        messagingSenderId: "102477469911",
        appId: "1:102477469911:web:13ed38ab426819fdb43892"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allMemories = []; 
window.currentTab = 'today';
    const container = document.getElementById('listContent');

    // 1. Khởi tạo dữ liệu
    async function init() {
        try {
            const snap = await getDocs(collection(db, "daily_memories"));
            allMemories = [];
            snap.forEach(doc => {
                const dayData = doc.data();
                if (dayData.moments) {
                    dayData.moments.forEach((m, idx) => {
                        allMemories.push({ ...m, date: doc.id, index: idx });
                    });
                }
            });

            allMemories.sort((a, b) => (b.time || b.date).localeCompare(a.time || a.date));
            
            // Mặc định hiện Tab Ngày
            window.filterByTimeRange('today');
        } catch (e) {
            console.error("Lỗi:", e);
            container.innerHTML = "Không thể tải dữ liệu.";
        }
    }

    // 2. Hàm lọc chính (Entry point của các Tab)
    window.filterByTimeRange = (range) => {


    window.currentTab = range; // Lưu lại tab hiện tại vào window
        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];

        // Cập nhật UI Tabs
        document.querySelectorAll('.tab-item').forEach(t => {
            t.classList.toggle('active', t.dataset.range === range);
        });

        if (range === 'today') {
            const filtered = allMemories.filter(m => m.date === todayStr);
            renderMemories(filtered, "Hôm nay có gì nè? ✨");
        } 
        else if (range === 'week') {
            // Hiện các Ngày trong tuần này
            const filtered = allMemories.filter(m => isWithinDays(m.date, 7));
            renderFolders(filtered, 'date', 'Tuần này');
        } 
        else if (range === 'month') {
            // Hiện các Tuần trong tháng này
            const filtered = allMemories.filter(m => isSameMonth(m.date, now));
            renderFolders(filtered, 'week', 'Tháng này');
        }
        else if (range === 'year') {
            // Hiện các Tháng trong năm này
            const filtered = allMemories.filter(m => new Date(m.date).getFullYear() === now.getFullYear());
            renderFolders(filtered, 'month', `Năm ${now.getFullYear()}`);
        }
        else if (range === 'century') {
            // Hiện các Năm có kỉ niệm
            renderFolders(allMemories, 'year', 'Thế kỷ Kỉ niệm');
        }
    };

    // 3. Hàm Render Folders (Xử lý phân cấp)
    function renderFolders(data, type, title) {
        container.innerHTML = "";
        if (data.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding-top:50px; opacity:0.5;">Trống trơn à...</div>`;
            return;
        }

        // Hiện tiêu đề và nút quay lại (nếu không phải tầng cao nhất của Tab)
        const header = document.createElement('div');
        header.className = "group-title";
        header.innerHTML = `${title} <span onclick="filterByTimeRange(currentTab)" style="cursor:pointer; color:var(--p-main)"><i class="fa-solid fa-rotate-left"></i> Trở lại</span>`;
        container.appendChild(header);

        const groups = {};
        data.forEach(m => {
            const d = new Date(m.date);
            let key = "";
            let nextType = "";

            if (type === 'year') {
                key = d.getFullYear().toString();
                nextType = 'month';
            } else if (type === 'month') {
                key = `Tháng ${d.getMonth() + 1} - ${d.getFullYear()}`;
                nextType = 'week';
            } else if (type === 'week') {
                const weekNo = Math.ceil(d.getDate() / 7);
                key = `Tuần ${weekNo} - Tháng ${d.getMonth() + 1}`;
                nextType = 'date';
            } else if (type === 'date') {
                key = m.date;
                nextType = 'memories';
            }

            if (!groups[key]) groups[key] = [];
            groups[key].push(m);
        });

        Object.keys(groups).sort().reverse().forEach(key => {
            const item = document.createElement('div');
            item.className = "folder-item";
            item.innerHTML = `
                <div class="folder-info">
                    <div class="folder-icon"><i class="fa-solid ${getIcon(type)}"></i></div>
                    <div>
                        <div class="folder-name">${type === 'date' ? formatDateVN(key) : key}</div>
                        <div class="folder-count">${groups[key].length} kỉ niệm</div>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right" style="color:#ddd"></i>
            `;
            
            // Logic khi bấm vào Folder: Nếu là date thì hiện kỉ niệm, ngược lại thì đào sâu xuống tiếp
            item.onclick = () => {
                const nextLevel = getNextLevel(type);
                if (nextLevel === 'memories') {
                    renderMemories(groups[key], key, true);
                } else {
                    renderFolders(groups[key], nextLevel, key);
                }
            };
            container.appendChild(item);
        });
    }

    // 4. Hàm Render Cards cuối cùng
    function renderMemories(data, title = "", showBack = false) {
        let html = `
            <div class="group-title">
                ${title} 
                ${showBack ? `<span onclick="filterByTimeRange(currentTab)" style="cursor:pointer; color:var(--p-main)"> <i class="fa-solid fa-rotate-left"></i> Quay lại</span>` : ""}
            </div>`;
        
        if (data.length === 0) {
            html += `<div style="text-align:center; padding-top:50px; opacity:0.5;">Hông có gì hết...</div>`;
        }

        data.forEach(m => {
            const displayTime = (m.time && m.time.includes('T')) ? m.time.split('T')[1].substring(0, 5) : "--:--";
            html += `
                <div class="m-card" onclick="window.location.href='template.html?date=${m.date}&index=${m.index}'">
                    <img src="${m.images?.[0] || 'img/cun.png'}" class="m-thumb">
                    <div class="m-info">
                        <h3 class="m-title">${m.activity || 'Kỉ niệm'}</h3>
                        <p class="m-desc">${m.content || ''}</p>
                        <div class="m-stats">
                            <span><i class="fa-regular fa-clock"></i> ${displayTime}</span>
                            <span><i class="fa-regular fa-image"></i> ${m.images ? m.images.length : 0}</span>
                        </div>
                    </div>
                    <div class="m-badge">😊 ${m.feeling}</div>
                </div>
            `;
        });
        container.innerHTML = html;
        container.scrollTop = 0;
    }

    // --- Helpers ---
    function getNextLevel(current) {
        const levels = { 'year': 'month', 'month': 'week', 'week': 'date', 'date': 'memories' };
        return levels[current];
    }

    function getIcon(type) {
        const icons = { 'year': 'fa-calendar', 'month': 'fa-calendar-check', 'week': 'fa-folder-open', 'date': 'fa-calendar-day' };
        return icons[type] || 'fa-folder';
    }

    function isWithinDays(dateStr, days) {
        const d = new Date(dateStr);
        const now = new Date();
        const diff = (now - d) / (1000 * 60 * 60 * 24);
        return diff >= 0 && diff <= days;
    }

    function isSameMonth(dateStr, now) {
        const d = new Date(dateStr);
        return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    }

    function formatDateVN(dateStr) {
        const d = new Date(dateStr);
        return `Ngày ${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
    }

    window.searchMemories = () => {
        const key = document.getElementById('searchInput').value.toLowerCase();
        if(!key) { window.filterByTimeRange(currentTab); return; }
        const filtered = allMemories.filter(m => 
            (m.content||"").toLowerCase().includes(key) || (m.activity||"").toLowerCase().includes(key)
        );
        renderMemories(filtered, `Kết quả cho: ${key}`, true);
    };

    // Đảm bảo các tab click được
    document.querySelectorAll('.tab-item').forEach(tab => {
        tab.onclick = () => window.filterByTimeRange(tab.dataset.range);
    });

    init();
</script>

</body>
