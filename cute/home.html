<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diary of Us - Duyên ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --pink-light: #fff0f3;
            --pink-main: #ff748c;
            --pink-soft: #ffb7c5;
            --text-gray: #7d6e83;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Quicksand', sans-serif;
            background-color: #fce1e4;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Khung điện thoại giả lập */
       /* Tìm .app-container và sửa lại */
.app-container {
    width: 100%;
    height: 100%;
    max-width: 450px; /* Thống nhất con số này ở cả 2 file */
    margin: 0 auto;
    background: url('img/5.png') no-repeat center center;
    background-size: cover;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 30px rgba(255, 143, 171, 0.2);
}
        /* Header & Banner */
        .header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--pink-soft);
        }

        .welcome-msg {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-gray);
        }

       /* Tìm .banner và sửa lại margin */
.banner {
    margin: 0 20px 15px; /* Đổi từ 15 thành 20 để thẳng lề với Header */
    padding: 15px;
    background: var(--pink-light);
    border-radius: 25px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid #ffe4e8;
}

        .banner-text {
            font-size: 12px;
            color: var(--text-gray);
            line-height: 1.5;
        }

        .banner-img {
            width: 60px;
        }

        /* Danh sách hoạt động & Thanh cuộn cute */
        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px 100px;
            scrollbar-width: thin;
            scrollbar-color: var(--pink-soft) transparent;
        }

        .content-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .content-scroll::-webkit-scrollbar-thumb {
            background: var(--pink-soft);
            border-radius: 10px;
        }

       /* Tìm .section-title và sửa lại */
.section-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--pink-main);
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    background: #fff; /* Nên để nền trắng hoặc trùng màu nền app để không bị lộ khi cuộn */
    padding: 10px 0; /* Giữ 10px trên dưới, 0 trái phải vì nó đã nằm trong .content-scroll có lề 20px rồi */
    z-index: 10;
}

        /* Task Item Design */
        .task-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px dashed #f0f0f0;
            animation: fadeIn 0.4s ease;
        }

        .task-icon {
            font-size: 26px;
            margin-right: 12px;
        }

        .task-info {
            flex: 1;
        }

        .task-name {
            font-size: 14px;
            font-weight: 700;
            color: #444;
        }

        .task-note {
            font-size: 11px;
            color: #999;
            margin-top: 2px;
        }

        .task-time {
            font-size: 12px;
            color: var(--pink-soft);
            font-weight: 700;
            margin-left: 10px;
        }

        .task-actions {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }

        .act-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-edit {
            color: #aaa;
        }

        .btn-edit:hover {
            color: var(--pink-main);
        }

        .btn-del {
            color: #ffcccc;
        }

        .btn-del:hover {
            color: #ff4d4d;
        }

        /* Modal & Form */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: white;
            width: 88%;
            border-radius: 35px;
            padding: 25px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            animation: popIn 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 15px 0;
            max-height: 120px;
            overflow-y: auto;
            padding: 5px;
        }

        .icon-item {
            font-size: 24px;
            cursor: pointer;
            padding: 5px;
            border-radius: 12px;
            text-align: center;
        }

        .icon-item.selected {
            background: var(--pink-light);
            border: 1.5px solid var(--pink-soft);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 15px;
            border: 1.5px solid #f0f0f0;
            margin-bottom: 12px;
            font-family: 'Quicksand';
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--pink-soft);
        }

        .btn-save {
            width: 100%;
            padding: 14px;
            background: linear-gradient(to right, #ffb7c5, #ff748c);
            color: white;
            border: none;
            border-radius: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 116, 140, 0.3);
        }

        /* Bottom Nav */
        /* --- MENU DƯỚI CÙNG THỐNG NHẤT --- */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 85px;
            background: #fff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 25px;
            border-top: 1px solid #f0f0f0;
            border-radius: 40px 40px 0 0;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            transition: 0.3s;
        }

        /* Icon và chữ mặc định màu xám */
        .nav-item i {
            font-size: 20px;
            margin-bottom: 3px;
            color: #ddd;
        }

        .nav-item span {
            font-size: 10px;
            color: #ccc;
            font-weight: 500;
        }

        /* Khi trang đang mở (active) thì icon và chữ hiện màu hồng */
        .nav-item.active i,
        .nav-item.active span {
            color: #ff8fab;
            font-weight: 700;
        }

        /* Nút cộng màu hồng Gradient siêu cute ở giữa */
        .center-btn {
            width: 58px;
            height: 58px;
            background: linear-gradient(45deg, #ffb7c5, #ff8fab);
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-top: -45px;
            box-shadow: 0 6px 15px rgba(255, 143, 171, 0.4);
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .center-btn:active {
            transform: scale(0.9);
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- Header -->
        <div class="header">
            <div class="user-info">
                <img src="img/cun.png" class="avatar">
                <span class="welcome-msg">Xin chào, Duyên bé ✨</span>
            </div>
            <i class="fa-regular fa-heart" style="color: var(--pink-soft);"></i>
        </div>

        <!-- Banner -->
        <div class="banner">
            <div class="banner-text">
                <b>Hôm nay là một ngày tuyệt! ✨</b><br>
                Mọi kỷ niệm đều đáng được trân trọng...
            </div>
            <img src="img/banh.png" class="banner-img">
        </div>

        <!-- Content List -->
        <div class="content-scroll">
            <div class="section-title">
                Hôm nay, bạn đã... 🌸
            </div>
            <div id="taskList">
                <!-- Data render -->
            </div>
        </div>

        <!-- Bottom Nav -->
        <div class="bottom-nav">
            <!-- Trang chủ -->
            <a href="home.html" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Trang chủ</span>
            </a>

            <!-- Kỉ niệm -->
            <a href="kiniem.html" class="nav-item">
                <i class="fa-solid fa-heart"></i>
                <span>Kỉ niệm</span>
            </a>

            <!-- Nút Cộng (Mở bảng tạo kỉ niệm hoặc hành động khác) -->
            <div class="center-btn" onclick="openModal()">+</div>

            <!-- Cảm xúc -->
            <a href="emotion.html" class="nav-item">
                <i class="fa-solid fa-face-smile"></i>
                <span>Cảm xúc</span>
            </a>

            <!-- Chúng mình -->
            <a href="us.html" class="nav-item">
                <i class="fa-solid fa-users"></i>
                <span>Chúng mình</span>
            </a>
        </div>
        <!-- Modal Thêm/Sửa -->
        <div class="modal" id="taskModal">
            <div class="modal-content">
                <h3 id="modalTitle" style="margin-top:0; color: var(--text-gray); font-size: 18px;">Thêm hoạt động mới
                </h3>
                <div class="icon-grid" id="iconGrid"></div>

                <input type="text" id="taskName" placeholder="Tên hoạt động (vd: Đi ăn kem)">
                <input type="text" id="taskNote" placeholder="Ghi chú thêm (vd: Kem dâu ngon lắm)">
                <input type="time" id="taskTime">

                <button class="btn-save" id="btnSaveTask">Lưu hoạt động ✨</button>
                <button onclick="closeModal()"
                    style="width:100%; border:none; background:none; color:#bbb; margin-top:10px; cursor:pointer;">Hủy
                    bỏ</button>
            </div>
        </div>
    </div>
    <script src="bgm.js"></script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB-Zj-83s3GW09RkAhMS4H8xWmLdi7loSI",
            authDomain: "photodiary-3d469.firebaseapp.com",
            projectId: "photodiary-3d469",
            storageBucket: "photodiary-3d469.firebasestorage.app",
            messagingSenderId: "102477469911",
            appId: "1:102477469911:web:13ed38ab426819fdb43892"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const getTodayId = () => new Date().toISOString().split('T')[0];
        let currentTasks = [];
        let editingId = null; // Dùng timestamp làm ID cho từng task trong mảng

        // 1. Thư viện Icon
        const icons = ["🌤️", "🍳", "🍱", "🏫", "📚", "🥤", "🏃", "🍛", "🌙", "⚖️", "🛁", "🧸", "🍿", "🎧", "💖", "🍓", "🍦", "🎬", "🎁", "🐈"];
        let selectedIcon = icons[0];

        const grid = document.getElementById('iconGrid');
        icons.forEach(icon => {
            const div = document.createElement('div');
            div.className = 'icon-item';
            div.innerText = icon;
            div.onclick = () => {
                document.querySelectorAll('.icon-item').forEach(el => el.classList.remove('selected'));
                div.classList.add('selected');
                selectedIcon = icon;
            };
            grid.appendChild(div);
        });

        // 2. Mở Modal
        window.openModal = (editData = null) => {
            const modal = document.getElementById('taskModal');
            const title = document.getElementById('modalTitle');
            const btn = document.getElementById('btnSaveTask');

            modal.style.display = 'flex';

            if (editData) {
                title.innerText = "Chỉnh sửa hoạt động";
                btn.innerText = "Cập nhật ngay ✨";
                document.getElementById('taskName').value = editData.name;
                document.getElementById('taskNote').value = editData.note || "";
                document.getElementById('taskTime').value = editData.time;
                selectedIcon = editData.icon;
                editingId = editData.id;
            } else {
                title.innerText = "Thêm hoạt động mới";
                btn.innerText = "Lưu hoạt động ✨";
                editingId = null;
                // TỰ ĐỘNG LẤY GIỜ HIỆN TẠI
                const now = new Date();
                document.getElementById('taskTime').value = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
                document.getElementById('taskName').value = "";
                document.getElementById('taskNote').value = "";
            }
        };

        window.closeModal = () => document.getElementById('taskModal').style.display = 'none';

        // 3. Xử lý Lưu (Thêm/Sửa)
        document.getElementById('btnSaveTask').onclick = async () => {
            const name = document.getElementById('taskName').value.trim();
            const note = document.getElementById('taskNote').value.trim();
            const time = document.getElementById('taskTime').value;

            if (!name) return alert("Bé nhập tên hoạt động nhé!");

            const todayId = getTodayId();
            const docRef = doc(db, "daily_tasks", todayId);

            if (editingId) {
                // LOGIC SỬA: Tìm trong mảng và thay thế
                currentTasks = currentTasks.map(t => t.id === editingId ? { ...t, icon: selectedIcon, name, note, time } : t);
            } else {
                // LOGIC THÊM: Tạo object mới
                currentTasks.push({
                    id: Date.now(), // Unique ID trong ngày
                    icon: selectedIcon,
                    name, note, time
                });
            }

            try {
                await setDoc(docRef, { tasks: currentTasks });
                closeModal();
            } catch (e) { alert("Lỗi lưu dữ liệu!"); }
        };

        // 4. Xử lý Xóa
        window.deleteTask = async (id) => {
            if (!confirm("Bé muốn xóa hoạt động này hả? 🥺")) return;
            currentTasks = currentTasks.filter(t => t.id !== id);
            await setDoc(doc(db, "daily_tasks", getTodayId()), { tasks: currentTasks });
        };

        // 5. Lắng nghe dữ liệu
        onSnapshot(doc(db, "daily_tasks", getTodayId()), (docSnap) => {
            const listEl = document.getElementById('taskList');
            if (docSnap.exists()) {
                currentTasks = docSnap.data().tasks || [];
                const sorted = [...currentTasks].sort((a, b) => a.time.localeCompare(b.time));

                listEl.innerHTML = sorted.map(t => `
                    <div class="task-item">
                        <div class="task-icon">${t.icon}</div>
                        <div class="task-info">
                            <div class="task-name">${t.name}</div>
                            <div class="task-note">${t.note ? t.note : '...'}</div>
                        </div>
                        <div class="task-time">${t.time}</div>
                        <div class="task-actions">
                            <button class="act-btn btn-edit" onclick='openModal(${JSON.stringify(t)})'>
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button class="act-btn btn-del" onclick="deleteTask(${t.id})">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            } else {
                currentTasks = [];
                listEl.innerHTML = `<p style="text-align: center; color: #ccc; margin-top: 30px; font-size: 13px;">Hôm nay bé chưa ghi gì hết á... 🐾</p>`;
            }
        });

    </script>

</body>

</html>
