<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nhật Ký Của Chúng Mình 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Sử dụng Font chữ đáng yêu hơn -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            /* Gradient màu hồng tím mộng mơ */
            background: linear-gradient(135deg, #fce7f3 0%, #fae8ff 50%, #e0e7ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }

        /* Hiệu ứng lấp lánh phía sau */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.5;
            animation: twinkle var(--duration) infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Thẻ nhật ký phong cách Glassmorphism mềm mại */
        .diary-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 182, 193, 0.5);
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(255, 105, 180, 0.15);
            position: relative;
            z-index: 10;
            transition: all 0.5s ease;
        }

        /* Nút bấm kẹo ngọt */
        .btn-cute {
            background: linear-gradient(90deg, #ff9a9e 0%, #fad0c4 100%);
            color: white;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(255, 154, 158, 0.4);
        }

        .btn-cute:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 25px rgba(255, 154, 158, 0.6);
        }

        /* Input mềm mại */
        .cute-input {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #f9a8d4;
            color: #db2777;
            text-align: center;
            letter-spacing: 0.2em;
        }

        .cute-input:focus {
            border-color: #f472b6;
            box-shadow: 0 0 15px rgba(244, 114, 182, 0.3);
            outline: none;
        }

        /* Icon bay bổng */
        .floating-heart {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-10px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <!-- Lớp nền lấp lánh -->
    <div class="stars" id="starContainer"></div>

    <div id="login-section" class="diary-card w-full max-w-[90%] sm:max-w-md p-10 mx-4">
        <!-- Icon trang trí -->
        <div class="text-center mb-6">
            <div class="w-20 h-20 bg-pink-100 rounded-full mx-auto mb-4 flex items-center justify-center shadow-inner floating-heart">
                <i class="fas fa-heart text-3xl text-pink-500"></i>
            </div>
            <h1 class="text-2xl font-bold text-pink-600 tracking-tight">
                Secret Diary ✨
            </h1>
            <p class="text-pink-400 text-sm mt-2 italic font-medium">Gõ cửa trái tim để vào xem nhé!</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div class="relative">
                <input
                    type="password"
                    id="password"
                    inputmode="numeric"
                    placeholder="Mật mã nè..."
                    class="w-full px-4 py-4 rounded-3xl cute-input font-bold text-xl placeholder:text-pink-200 placeholder:tracking-normal"
                >
                <div class="absolute right-4 top-4 text-pink-300">
                    <i class="fas fa-magic"></i>
                </div>
            </div>

            <button
                type="submit"
                class="w-full btn-cute py-4 rounded-3xl font-bold text-lg flex items-center justify-center gap-2"
            >
                <span>Mở Nhật Ký</span>
                <i class="fas fa-book-open"></i>
            </button>
        </form>

        <!-- Link trang trí phía dưới -->
        <div class="mt-8 flex justify-center gap-4 text-pink-300 text-sm">
            <span><i class="fas fa-camera-retro"></i> Ảnh đẹp</span>
            <span><i class="fas fa-video"></i> Video</span>
            <span><i class="fas fa-pen-nib"></i> Tâm sự</span>
        </div>
    </div>

    <script>
        // Tạo các ngôi sao lấp lánh ngẫu nhiên
        const starContainer = document.getElementById('starContainer');
        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 4 + 2 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', Math.random() * 3 + 2 + 's');
            starContainer.appendChild(star);
        }

        // Xử lý đăng nhập
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pass = document.getElementById('password').value;

            if (pass === "123") {
                const loginSection = document.getElementById('login-section');
                
                // Hiệu ứng biến mất nhẹ nhàng
                loginSection.style.opacity = "0";
                loginSection.style.transform = "scale(0.9) translateY(20px)";

                setTimeout(() => {
                    sessionStorage.setItem('portal_authenticated', 'true');
                    window.location.href = 'up.html';
                }, 500);
            } else {
                // Hiệu ứng rung khi sai mật khẩu
                const card = document.querySelector('.diary-card');
                card.classList.add('animate-bounce');
                alert("Hic, sai mật mã rồi bạn ơi! ✨ Thử lại nhé?");
                setTimeout(() => card.classList.remove('animate-bounce'), 500);
                document.getElementById('password').value = "";
            }
        });
    </script>
</body>
</html>
