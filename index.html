<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cấm Vào - Của Riêng Anh 🔞</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background: #000;
            background-image: radial-gradient(circle at center, #4b0000 0%, #000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Khung login phong cách "Phòng kín" */
        .forbidden-card {
            background: rgba(20, 0, 0, 0.9);
            border: 3px solid #ff0040;
            box-shadow: 0 0 50px #ff0040, inset 0 0 20px #ff0040;
            border-radius: 40px;
            position: relative;
            z-index: 10;
        }

        /* Đôi mắt theo dõi (Eye Tracking) */
        .boy-watcher {
            position: absolute;
            top: -60px;
            right: -30px;
            width: 120px;
            height: 80px;
            display: flex;
            gap: 10px;
            z-index: 20;
        }
        .eye {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            position: relative;
            border: 3px solid #000;
            overflow: hidden;
        }
        .pupil {
            width: 20px;
            height: 20px;
            background: #000;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s;
        }

        /* Cô gái râm râm */
        .girl-status {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 80px;
            text-shadow: 0 0 20px #ff00fb;
            transition: all 0.2s;
        }

        /* Hiệu ứng đỏ mặt */
        .blush {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,0,100,0.4) 0%, transparent 70%);
            display: none;
            pointer-events: none;
        }

        /* Trừng phạt cực nặng */
        @keyframes hardcore-spank {
            0% { transform: scale(1); filter: brightness(1); }
            20% { transform: scale(1.1) translate(10px, -10px); filter: brightness(2) sepia(1) hue-rotate(-50deg); }
            40% { transform: scale(0.9) translate(-15px, 15px); }
            100% { transform: scale(1); }
        }
        .punish-shake {
            animation: hardcore-spank 0.05s infinite !important;
        }

        .heart-pulse {
            animation: pulse 0.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        input:focus {
            box-shadow: 0 0 20px #ff0040;
        }
    </style>
</head>
<body>

    <!-- Lớp phủ trừng phạt -->
    <div id="spank-layer" class="fixed inset-0 bg-red-900/80 z-[100] hidden flex-col items-center justify-center">
        <h1 class="text-white text-8xl font-black italic mb-4 drop-shadow-[0_0_20px_rgba(255,255,255,1)]">AHHH! ~❤️</h1>
        <div class="text-white text-4xl font-bold bg-black/50 px-6 py-2 rounded-full">BỊ TÉT ĐÍT RỒI! 🍑👋</div>
    </div>

    <div id="login-section" class="forbidden-card w-full max-w-[380px] p-10 mx-4 transition-all">
        <div class="blush" id="blush-bg"></div>

        <!-- Chàng trai đang rình mò -->
        <div class="boy-watcher">
            <div class="eye"><div class="pupil" id="pupil-l"></div></div>
            <div class="eye"><div class="pupil" id="pupil-r"></div></div>
        </div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-white tracking-tighter italic">
                SECRET <span class="text-pink-500">ACCESS</span>
            </h1>
            <p class="text-gray-400 text-[10px] uppercase tracking-[0.3em] mt-1">Dành cho chủ nhân của em...</p>
        </div>

        <form id="loginForm" class="space-y-6 relative z-10">
            <div class="relative">
                <input
                    type="password"
                    id="password"
                    inputmode="numeric"
                    placeholder="Nhập mã vào đây..."
                    class="w-full px-4 py-5 rounded-3xl bg-black border-4 border-pink-600 text-pink-400 text-center text-3xl font-black placeholder:text-pink-900 focus:outline-none transition-all"
                    oninput="handleNaughtyInput(this)"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-gradient-to-r from-pink-600 to-red-600 py-5 rounded-3xl font-black text-white text-xl shadow-[0_0_20px_rgba(219,39,119,0.5)] active:scale-95 transition"
            >
                MỞ RA ĐI ANH... 🔥
            </button>
        </form>

        <!-- Cô gái 2D -->
        <div id="girl" class="girl-status">😳</div>
    </div>

    <script>
        const pupils = document.querySelectorAll('.pupil');
        const girl = document.getElementById('girl');
        const blush = document.getElementById('blush-bg');
        const section = document.getElementById('login-section');
        const spankLayer = document.getElementById('spank-layer');

        // Logic Eye Tracking: Đồng tử to ra và nhìn theo
        function handleNaughtyInput(input) {
            const len = input.value.length;
            
            // 1. Đồng tử (Pupil) to ra khi gõ nhiều
            const size = 20 + (len * 5);
            const pupilColor = len > 3 ? '#ff0000' : '#000';
            
            pupils.forEach(p => {
                p.style.width = size + 'px';
                p.style.height = size + 'px';
                p.style.background = pupilColor;
                
                // Nhìn theo input (đơn giản hóa bằng cách dịch chuyển nhẹ)
                const moveX = (len * 2) - 10;
                p.style.transform = `translate(calc(-50% + ${moveX}px), -50%)`;
            });

            // 2. Cô gái biến đổi
            if (len === 0) {
                girl.innerHTML = "😳";
                blush.style.display = 'none';
                section.classList.remove('heart-pulse');
            } else if (len < 3) {
                girl.innerHTML = "🥵";
                blush.style.display = 'block';
                blush.style.opacity = '0.3';
            } else {
                girl.innerHTML = "🤤"; // Râm hơn
                blush.style.opacity = '0.8';
                section.classList.add('heart-pulse'); // Rung nhẹ theo nhịp tim
            }
        }

        // Xử lý trừng phạt
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pass = document.getElementById('password').value;

            if (pass === "123") {
                // Thành công: Tan chảy
                section.style.transform = "scale(0) rotate(720deg)";
                section.style.opacity = "0";
                setTimeout(() => {
                    sessionStorage.setItem('portal_authenticated', 'true');
                    window.location.href = 'up.html';
                }, 600);
            } else {
                // PHẠT NẶNG (Tét đít Hardcore)
                section.classList.add('punish-shake');
                spankLayer.classList.remove('hidden');
                spankLayer.classList.add('flex');
                girl.innerHTML = "😫💦";
                
                // Hiệu ứng nhấp nháy đỏ
                let flashes = 0;
                const interval = setInterval(() => {
                    document.body.style.backgroundColor = flashes % 2 === 0 ? '#ff0000' : '#000';
                    flashes++;
                    if (flashes > 10) clearInterval(interval);
                }, 50);

                setTimeout(() => {
                    section.classList.remove('punish-shake');
                    spankLayer.classList.add('hidden');
                    document.body.style.backgroundColor = '#000';
                    document.getElementById('password').value = "";
                    handleNaughtyInput(document.getElementById('password'));
                }, 2000);
            }
        });
    </script>
</body>
</html>
