<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- Khóa thu phóng để giữ giao diện chuẩn -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome - Diary of Us</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fce1e4; /* Màu nền dự phòng */
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Lớp chứa ảnh nền */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* ĐƯỜNG DẪN ẢNH NỀN CỦA BẠN */
            background: url('cute/img/1.png') no-repeat center center;
            background-size: cover; /* Để lấp đầy màn hình điện thoại */
            transition: opacity 1.5s ease-in-out, transform 1.5s ease-in-out;
            z-index: 1;
        }

        /* Hiệu ứng mờ dần và thu nhỏ nhẹ khi click */
        .fade-out {
            opacity: 0;
            transform: scale(1.1);
        }

        /* Dòng chữ gợi ý nhỏ (tùy chọn, nếu bạn muốn nhắc người dùng chạm) */
        .hint-text {
            position: absolute;
            bottom: 10%;
            width: 100%;
            text-align: center;
            color: white;
            font-family: sans-serif;
            font-size: 14px;
            text-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 2;
            animation: breathe 2s infinite;
            pointer-events: none; /* Để không cản trở cú click vào body */
            opacity: 0.8;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 0.8; }
        }
    </style>
</head>
<body onclick="enterSite()">

    <!-- Chỉ hiển thị background ban đầu -->
    <div class="background-container" id="bg"></div>

    <!-- Dòng chữ gợi ý mờ mờ -->
    <div class="hint-text">Chạm vào màn hình để bắt đầu ✨</div>

    <script>
        let clicked = false;

        function enterSite() {
            if (clicked) return; // Tránh click nhiều lần
            clicked = true;

            const bg = document.getElementById('bg');
            
            // Bắt đầu hiệu ứng dần dần biến mất
            bg.classList.add('fade-out');

            // Sau 1.2 giây (khi hiệu ứng mờ gần xong) thì chuyển sang trang login
            setTimeout(() => {
                window.location.href = '/cute/login.html';
            }, 1200);
        }

        // Chặn zoom trên Laptop (Ctrl + cuộn chuột)
        document.addEventListener('wheel', function(e) {
            if (e.ctrlKey) e.preventDefault();
        }, { passive: false });

        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === '+' || e.key === '-' || e.key === '0')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
