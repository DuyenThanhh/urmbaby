<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bí Mật Của Em 😈✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: radial-gradient(circle at center, #2d1b4d 0%, #1a0b2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin: 0;
        }

        /* Thẻ login bạo bạo */
        .naughty-card {
            background: rgba(45, 27, 77, 0.8);
            backdrop-filter: blur(15px);
            border: 2px solid #ff00ff;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.3), inset 0 0 15px rgba(255, 0, 255, 0.2);
            border-radius: 30px;
            position: relative;
            z-index: 10;
        }

        /* Chàng trai đang nhìn (Góc trên phải) */
        .boy-observer {
            position: absolute;
            top: -50px;
            right: -20px;
            font-size: 60px;
            transition: all 0.2s;
            filter: drop-shadow(0 0 10px #00ffff);
        }

        /* Cô gái đang nhập (Góc dưới) */
        .girl-inputter {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 70px;
            transition: all 0.3s;
        }

        /* Mồ hôi của cô gái */
        .sweat {
            position: absolute;
            color: #00ffff;
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* Hiệu ứng rung khi bị phạt */
        @keyframes spank {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }

        .punish-active {
            animation: spank 0.1s infinite;
            border-color: #ff0000 !important;
            box-shadow: 0 0 50px #ff0000 !important;
        }

        .input-naughty {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #ff00ff;
            color: #fff;
            text-shadow: 0 0 10px #ff00ff;
        }

        .btn-naughty {
            background: linear-gradient(45deg, #ff00ff, #7000ff);
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 15px rgba(255, 0, 255, 0.4);
        }

        /* Overlay khi bị tét đít */
        #punish-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 0, 0, 0.3);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="punish-overlay">
        <h1 class="text-white text-6xl font-black italic">CHÁT! CHÁT! 🍑👋</h1>
        <p class="text-white text-2xl mt-4">Hư nè! Phạt tét đít!</p>
    </div>

    <div id="login-section" class="naughty-card w-full max-w-[350px] p-10 mx-4">
        
        <!-- Chàng trai 2D (Dùng Emoji mô phỏng) -->
        <div id="boy" class="boy-observer">👁️‍🗨️👁️‍🗨️</div>

        <div class="text-center mb-8">
            <h1 class="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-600">
                LỐI VÀO CẤM 🔞
            </h1>
            <p class="text-pink-300 text-[10px] mt-2 uppercase tracking-widest">Đừng để anh ấy bắt quả tang...</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div class="relative">
                <input
                    type="password"
                    id="password"
                    inputmode="numeric"
                    placeholder="Mật mã bí mật..."
                    class="w-full px-4 py-4 rounded-2xl input-naughty text-center font-bold text-2xl outline-none"
                    oninput="updateState(this)"
                >
            </div>

            <button
                type="submit"
                class="w-full btn-naughty py-4 rounded-2xl font-black text-white hover:scale-105 transition"
            >
                Khám phá bên trong 😈
            </button>
        </form>

        <!-- Cô gái 2D (Dùng Emoji mô phỏng) -->
        <div id="girl" class="girl-inputter">
            <span id="sweat-1" class="sweat" style="top: 10px; left: -10px;">💦</span>
            <span id="sweat-2" class="sweat" style="top: 20px; right: -10px;">💦</span>
            😳
        </div>
    </div>

    <script>
        const boy = document.getElementById('boy');
        const girl = document.getElementById('girl');
        const sweats = [document.getElementById('sweat-1'), document.getElementById('sweat-2')];

        // Cập nhật trạng thái khi gõ mật khẩu
        function updateState(input) {
            const len = input.value.length;
            
            // Mắt chàng trai to dần (scale)
            const eyeSize = 1 + (len * 0.2);
            boy.style.transform = `scale(${eyeSize})`;
            
            // Cô gái đổ mồ hôi (opacity)
            const sweatOpacity = len * 0.2;
            sweats.forEach(s => s.style.opacity = sweatOpacity);

            // Cô gái run rẩy nhẹ
            if (len > 3) {
                girl.style.animation = "spank 0.5s infinite";
                girl.innerHTML = `
                    <span id="sweat-1" class="sweat" style="top: 10px; left: -10px; opacity:${sweatOpacity}">💦</span>
                    <span id="sweat-2" class="sweat" style="top: 20px; right: -10px; opacity:${sweatOpacity}">💦</span>
                    😰`;
            } else {
                girl.style.animation = "none";
                girl.innerHTML = `
                    <span id="sweat-1" class="sweat" style="top: 10px; left: -10px; opacity:${sweatOpacity}">💦</span>
                    <span id="sweat-2" class="sweat" style="top: 20px; right: -10px; opacity:${sweatOpacity}">💦</span>
                    😳`;
            }
        }

        // Xử lý đăng nhập
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pass = document.getElementById('password').value;
            const card = document.getElementById('login-section');
            const overlay = document.getElementById('punish-overlay');

            if (pass === "123456") {
                // Thành công: Biến mất vào hư không
                card.style.transform = "scale(2) rotate(10deg)";
                card.style.opacity = "0";
                setTimeout(() => {
                    sessionStorage.setItem('portal_authenticated', 'true');
                    window.location.href = 'up.html';
                }, 500);
            } else {
                // Thất bại: PHẠT TÉT ĐÍT
                card.classList.add('punish-active');
                overlay.style.display = 'flex';
                girl.innerHTML = "😭";
                boy.innerHTML = "😡";
                
                // Rung màn hình và hiện thông báo phạt
                setTimeout(() => {
                    card.classList.remove('punish-active');
                    overlay.style.display = 'none';
                    document.getElementById('password').value = "";
                    updateState(document.getElementById('password'));
                }, 1500);
            }
        });
    </script>
</body>
</html>
