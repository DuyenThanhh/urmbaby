<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghi Chú Premium - Pro Max</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');

        body {
            background: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
        }

        /* Ô ngày thiết kế Sang Trọng */
        .calendar-day {
            aspect-ratio: 1 / 1.1;
            border-radius: 20px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            position: relative;
            background: white;
            border: 1px solid rgba(226, 232, 240, 0.5);
        }

        /* Hiệu ứng khi nhấn */
        .calendar-day:active {
            transform: scale(0.85);
            background: #f1f5f9;
        }

        /* Ngày Hôm Nay: Phong cách Apple Glow */
        .today {
            background: linear-gradient(135deg, #14b8a6 0%, #0d9488 100%) !important;
            color: white !important;
            border: none !important;
            box-shadow: 0 10px 20px -5px rgba(20, 184, 166, 0.4);
            z-index: 10;
        }

        /* Đánh dấu có sự kiện: Thanh Pill nhỏ tinh tế */
        .has-event::after {
            content: '';
            position: absolute;
            bottom: 6px;
            width: 12px;
            height: 5px;
            background: red;
            border-radius: 50px;
        }
        
        .today.has-event::after {
            background: white;
            opacity: 0.8;
        }

        /* Ngày được chọn: Ring Light */
        .selected-ring {
            box-shadow: 0 0 0 3px #ccfbf1;
            border-color: #14b8a6 !important;
        }

        /* Custom Dropdown Cute */
        #customDatePicker {
            display: none;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .month-btn {
            transition: all 0.2s;
            border-radius: 12px;
        }

        .month-btn:hover {
            background: #f0fdfa;
            color: #0d9488;
        }
    </style>
</head>

<body class="p-4 pb-24">

    <div class="max-w-md mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <button onclick="window.location.href='main.html'" class="w-12 h-12 flex items-center justify-center bg-white rounded-2xl shadow-sm text-slate-400 active:scale-90 transition-all">
                <i class="fas fa-chevron-left"></i>
            </button>
            
            <div class="relative">
                <div onclick="window.toggleCustomPicker()" class="bg-white px-6 py-3 rounded-2xl shadow-sm border border-slate-50 flex items-center gap-3 cursor-pointer active:scale-95 transition-all">
                    <span id="monthDisplay" class="font-extrabold text-slate-800 text-sm tracking-tight uppercase">Tháng 04 - 2024</span>
                    <i class="fas fa-caret-down text-teal-500"></i>
                </div>

                <!-- Bảng chọn tháng Cute -->
                <div id="customDatePicker" class="absolute top-16 left-1/2 -translate-x-1/2 z-50 rounded-[30px] shadow-2xl border border-white p-6 w-72">
                    <div class="flex justify-between items-center mb-6">
                        <button onclick="window.changeYearPicker(-1)" class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400"><i class="fas fa-chevron-left text-xs"></i></button>
                        <span id="pickerYear" class="font-black text-slate-800 text-lg">2024</span>
                        <button onclick="window.changeYearPicker(1)" class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400"><i class="fas fa-chevron-right text-xs"></i></button>
                    </div>
                    <div class="grid grid-cols-3 gap-3">
                        <script>
                            const months = ['Th.1', 'Th.2', 'Th.3', 'Th.4', 'Th.5', 'Th.6', 'Th.7', 'Th.8', 'Th.9', 'Th.10', 'Th.11', 'Th.12'];
                            months.forEach((m, i) => {
                                document.write(`<button onclick="window.selectMonthFromPicker(${i})" class="month-btn py-3 text-xs font-bold text-slate-500">${m}</button>`);
                            });
                        </script>
                    </div>
                </div>
            </div>

            <button onclick="window.showTopReminders()" class="w-12 h-12 flex items-center justify-center bg-teal-50 rounded-2xl text-teal-600 active:scale-90 transition-all">
                <i class="fas fa-bell"></i>
            </button>
        </div>

        <!-- Lịch trình chính -->
        <div class="bg-white/70 backdrop-blur-md rounded-[40px] shadow-2xl shadow-slate-200/50 p-2 border border-white mb-8">
            <div class="grid grid-cols-7 text-center text-[10px] font-black text-slate-300 py-4 tracking-widest uppercase">
                <div>cn</div><div>t2</div><div>t3</div><div>t4</div><div>t5</div><div>t6</div><div>t7</div>
            </div>
            <div id="calendarDays" class="grid grid-cols-7 gap-1">
                <!-- JS Render -->
            </div>
        </div>

        <!-- Danh sách sự kiện -->
        <div class="px-2">
            <h3 id="selectedDateText" class="font-extrabold text-slate-800 text-xs mb-5 uppercase tracking-widest flex items-center gap-3">
                <span class="w-2 h-2 bg-teal-500 rounded-full animate-pulse"></span> Sự kiện trong ngày
            </h3>
            <div id="dayEventsList" class="space-y-4"></div>
        </div>
    </div>

    <!-- Floating Action Button -->
    <button onclick="window.openModal()" class="fixed bottom-8 right-6 w-16 h-16 bg-slate-900 text-white rounded-3xl shadow-2xl shadow-slate-900/40 flex items-center justify-center text-xl z-40 active:scale-90 transition-all">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Modal Nhắc Nhở -->
    <div id="loginReminder" class="fixed inset-0 bg-slate-900/40 hidden items-center justify-center p-6 z-[100] backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[45px] p-8 shadow-2xl">
            <div class="text-center">
                <div class="w-20 h-20 bg-teal-50 text-teal-600 rounded-[30px] flex items-center justify-center text-3xl mb-6 mx-auto"><i class="fas fa-rocket"></i></div>
                <h2 class="text-2xl font-extrabold text-slate-800">Sắp tới có gì?</h2>
                <div id="reminderContent" class="mt-6 space-y-4 text-left"></div>
                <button onclick="window.backToToday()" class="w-full mt-8 bg-slate-900 text-white py-5 rounded-[24px] font-extrabold shadow-xl active:scale-95 transition-all text-xs uppercase tracking-[2px]">
                    TÔI ĐÃ HIỂU
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="eventModal" class="fixed inset-0 bg-slate-900/20 hidden items-center justify-center p-6 z-50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-sm rounded-[40px] p-8 shadow-2xl">
            <h2 class="font-extrabold text-slate-800 text-lg mb-6 tracking-tight">Thêm sự kiện mới</h2>
            <input type="text" id="eventTitle" placeholder="Tiêu đề..." class="w-full p-5 bg-slate-50 rounded-2xl mb-4 font-bold text-sm outline-none border-2 border-transparent focus:border-teal-500 transition-all">
            <textarea id="eventNote" placeholder="Ghi chú thêm..." class="w-full p-5 bg-slate-50 rounded-2xl mb-6 h-32 text-sm font-medium outline-none border-2 border-transparent focus:border-teal-500 transition-all"></textarea>
            <div class="flex gap-3">
                <button onclick="window.closeModal()" class="flex-1 py-4 font-extrabold text-slate-400 text-xs tracking-widest uppercase">Hủy</button>
                <button onclick="window.saveEvent()" class="flex-1 bg-teal-600 text-white py-4 rounded-[20px] font-extrabold text-xs tracking-widest uppercase shadow-lg shadow-teal-600/20">Lưu ngay</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, query, where, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCszKVe3S63aLVdamx47YX1IFKPQi47MFI", authDomain: "everydaybanh.firebaseapp.com", projectId: "everydaybanh", storageBucket: "everydaybanh.firebasestorage.app" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const uid = "USER_LOGGED_IN_ID_123";

        let viewDate = new Date();
        let selectedDateStr = new Date().toISOString().split('T')[0];
        let allEvents = [];
        let pickerYear = viewDate.getFullYear();

        // PHẦN BẠN CẦN: Màu đỏ rực cho số ngày còn lại
        const getDayDiff = (targetDateStr) => {
            const today = new Date(); today.setHours(0,0,0,0);
            const target = new Date(targetDateStr); target.setHours(0,0,0,0);
            const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return `<span class="text-orange-500">★ Hôm nay</span>`;
            if (diffDays === 1) return `<span class="text-red-600 font-extrabold">Ngày mai!</span>`;
            return diffDays > 1 ? `<span class="text-red-600 font-extrabold">Còn ${diffDays} ngày nữa</span>` : `<span class="text-slate-300 font-bold">Đã qua</span>`;
        };

        // Gắn tất cả các hàm vào window để HTML gọi được
        window.renderCalendar = () => {
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            document.getElementById('monthDisplay').innerText = `THÁNG ${String(month + 1).padStart(2, '0')} - ${year}`;
            document.getElementById('pickerYear').innerText = year;

            const firstDay = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();
            const todayStr = new Date().toISOString().split('T')[0];

            let html = '';
            for (let i = 0; i < firstDay; i++) html += `<div></div>`;
            for (let day = 1; day <= totalDays; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const isToday = dateStr === todayStr ? 'today' : '';
                const hasEvent = allEvents.some(e => e.date === dateStr) ? 'has-event' : '';
                const isSelected = dateStr === selectedDateStr ? 'selected-ring' : '';

                html += `
                    <div onclick="window.selectDate('${dateStr}')" class="calendar-day ${isToday} ${hasEvent} ${isSelected}">
                        <span>${day}</span>
                    </div>
                `;
            }
            document.getElementById('calendarDays').innerHTML = html;
        };

        window.selectDate = (date) => {
            selectedDateStr = date;
            document.getElementById('selectedDateText').innerHTML = `<span class="w-2 h-2 bg-teal-500 rounded-full animate-pulse"></span> Sự kiện: ${date}`;
            window.renderCalendar();
            window.renderDayEvents();
        };

        window.renderDayEvents = () => {
            const list = allEvents.filter(e => e.date === selectedDateStr);
            const container = document.getElementById('dayEventsList');
            if (list.length === 0) {
                container.innerHTML = `<div class="bg-white p-12 rounded-[40px] text-center border-2 border-dashed border-slate-100"><p class="text-slate-300 text-[10px] font-black uppercase tracking-widest">Không có lịch trình</p></div>`;
                return;
            }
            container.innerHTML = list.map(e => `
                <div class="bg-white p-6 rounded-[32px] shadow-sm border border-slate-50 flex justify-between items-center group active:scale-[0.98] transition-all">
                    <div class="flex items-center gap-5">
                        <div class="w-1.5 h-12 bg-slate-900 rounded-full"></div>
                        <div>
                            <div class="flex flex-col">
                                <span class="text-[9px] font-black uppercase tracking-widest mb-1">${getDayDiff(e.date)}</span>
                                <h4 class="font-extrabold text-slate-800 text-base leading-tight">${e.title}</h4>
                            </div>
                            <p class="text-xs text-slate-400 font-medium mt-1">${e.note || 'Không có mô tả'}</p>
                        </div>
                    </div>
                    <button onclick="window.deleteEvent('${e.id}')" class="text-slate-200 hover:text-red-500 transition-colors p-2"><i class="fas fa-trash-alt text-sm"></i></button>
                </div>
            `).join('');
        };

        window.toggleCustomPicker = () => {
            const p = document.getElementById('customDatePicker');
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        };

        window.changeYearPicker = (val) => {
            pickerYear += val;
            document.getElementById('pickerYear').innerText = pickerYear;
        };

        window.selectMonthFromPicker = (m) => {
            viewDate = new Date(pickerYear, m, 1);
            window.renderCalendar();
            window.toggleCustomPicker();
        };

        window.backToToday = () => {
            const today = new Date();
            viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
            selectedDateStr = today.toISOString().split('T')[0];
            window.renderCalendar();
            window.renderDayEvents();
            window.closeReminder();
        };

        window.showTopReminders = () => {
            const today = new Date().toISOString().split('T')[0];
            const upcoming = allEvents.filter(e => e.date >= today).sort((a,b) => a.date.localeCompare(b.date)).slice(0, 3);
            if (upcoming.length > 0) {
                document.getElementById('reminderContent').innerHTML = upcoming.map(e => `
                    <div class="p-5 bg-slate-50 rounded-[24px] border border-slate-100">
                        <p class="text-[9px] font-black uppercase mb-1 tracking-widest">${getDayDiff(e.date)}</p>
                        <p class="font-extrabold text-slate-800 text-sm">${e.title}</p>
                        <p class="text-[10px] text-slate-400 font-bold mt-1 uppercase">${e.date}</p>
                    </div>
                `).join('');
                document.getElementById('loginReminder').classList.replace('hidden', 'flex');
            }
        };

        window.saveEvent = async () => {
            const title = document.getElementById('eventTitle').value;
            const note = document.getElementById('eventNote').value;
            if (!title) return alert("Vui lòng nhập tiêu đề!");
            const id = `note_${Date.now()}`;
            await setDoc(doc(db, "notes", id), { uid, title, note, date: selectedDateStr, ts: Date.now() });
            window.closeModal();
            document.getElementById('eventTitle').value = '';
            document.getElementById('eventNote').value = '';
        };

        window.deleteEvent = async (id) => { if (confirm("Bạn muốn xóa sự kiện này?")) await deleteDoc(doc(db, "notes", id)); };
        window.openModal = () => document.getElementById('eventModal').classList.replace('hidden', 'flex');
        window.closeModal = () => document.getElementById('eventModal').classList.replace('flex', 'hidden');
        window.closeReminder = () => document.getElementById('loginReminder').classList.replace('flex', 'hidden');

        // Init
        onSnapshot(query(collection(db, "notes"), where("uid", "==", uid)), snap => {
            allEvents = [];
            snap.forEach(d => allEvents.push({ id: d.id, ...d.data() }));
            window.renderCalendar();
            window.renderDayEvents();
        });

        // Tự động hiện nhắc nhở sau 1 giây
        setTimeout(() => {
            window.showTopReminders();
        }, 1000);

        // Đóng picker khi bấm ra ngoài
        window.addEventListener('click', (e) => {
            const picker = document.getElementById('customDatePicker');
            const display = document.getElementById('monthDisplay');
            if (picker.style.display === 'block' && !picker.contains(e.target) && !display.contains(e.target)) {
                picker.style.display = 'none';
            }
        });

    </script>
</body>

</html>
