<!DOCTYPE html>
<html lang="vi">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
     <title>Diary of Us - Chung một nhà 🌸</title>
     <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
     <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
     <style>
          :root {
               --pink-main: #ff8fab;
               --pink-soft: #ffb7c5;
               --pink-bg: #fff5f7;
          }

          * {
               box-sizing: border-box;
               -webkit-tap-highlight-color: transparent;
          }

          body,
          html {
               margin: 0;
               padding: 0;
               width: 100%;
               height: 100%;
               font-family: 'Quicksand', sans-serif;
               background: var(--pink-bg);
               overflow: hidden;
          }

          .app-container {
               width: 100%;
               height: 100%;
               max-width: 450px;
               margin: 0 auto;
               /* Xóa background: white; và thay bằng: */
               background: url('img/4.png') no-repeat center center;
               background-size: cover;
               position: relative;
               display: flex;
               flex-direction: column;
               box-shadow: 0 0 30px rgba(255, 143, 171, 0.2);
          }

          .content {
               flex: 1;
               overflow-y: auto;
               padding: 20px;
               padding-bottom: 100px;
               scrollbar-width: none;
          }

          .content::-webkit-scrollbar {
               display: none;
          }

          .header {
               display: flex;
               align-items: center;
               padding: 15px 0;
               border-bottom: 1px solid #fdf2f4;
               margin-bottom: 20px;
          }

          .header-title {
               flex: 1;
               text-align: center;
               font-style: italic;
               font-weight: 700;
               color: var(--pink-main);
               font-size: 20px;
          }

          .glass-box {
               background: #fffafb;
               border-radius: 25px;
               padding: 20px;
               border: 2px solid #fff0f3;
               margin-bottom: 20px;
          }

          textarea {
               width: 100%;
               height: 80px;
               border: none;
               outline: none;
               resize: none;
               font-family: 'Quicksand';
               font-size: 15px;
               color: #666;
               background: transparent;
          }

          /* Preview ảnh */
          .preview-grid {
               display: grid;
               grid-template-columns: repeat(4, 1fr);
               gap: 8px;
               margin: 10px 0;
               cursor: pointer;
          }

          .p-slot {
               aspect-ratio: 1;
               border-radius: 12px;
               background: white;
               display: flex;
               align-items: center;
               justify-content: center;
               overflow: hidden;
               border: 1px dashed var(--pink-soft);
          }

          .p-slot img {
               width: 100%;
               height: 100%;
               object-fit: cover;
          }

          /* Voice Bubble & Waveform */
          .voice-bubble {
               background: #ffeef2;
               border-radius: 20px;
               padding: 15px;
               margin: 15px 0;
               display: none;
               align-items: center;
               gap: 12px;
               border: 1px solid #ffdde5;
          }

          .play-btn {
               width: 40px;
               height: 40px;
               border-radius: 50%;
               background: var(--pink-main);
               color: white;
               border: none;
               display: flex;
               align-items: center;
               justify-content: center;
               cursor: pointer;
          }

          .waveform-visual {
               flex: 1;
               display: flex;
               align-items: center;
               gap: 3px;
               height: 30px;
          }

          .wf-bar {
               width: 3px;
               height: 40%;
               background: var(--pink-soft);
               border-radius: 2px;
          }

          .wf-bar.active {
               animation: dance 0.6s infinite alternate;
          }

          @keyframes dance {
               from {
                    height: 20%;
               }

               to {
                    height: 95%;
               }
          }

          .audio-timer {
               font-size: 12px;
               color: var(--pink-main);
               font-weight: 700;
               min-width: 45px;
               text-align: right;
          }

          /* Cảm xúc & Tags */
          .scroll-x {
               display: flex;
               gap: 12px;
               overflow-x: auto;
               padding: 5px 0;
               scrollbar-width: none;
          }

          .choice-item {
               min-width: 65px;
               text-align: center;
               cursor: pointer;
          }

          .choice-icon {
               width: 45px;
               height: 45px;
               background: white;
               border-radius: 15px;
               display: flex;
               align-items: center;
               justify-content: center;
               font-size: 22px;
               margin: 0 auto 5px;
               border: 2px solid #fff0f3;
          }

          .choice-item.active .choice-icon {
               border-color: var(--pink-main);
               background: #fff0f3;
               transform: scale(1.1);
          }

          .tag-group {
               display: flex;
               flex-wrap: wrap;
               gap: 8px;
               margin-top: 5px;
          }

          .tag {
               padding: 8px 15px;
               border-radius: 15px;
               background: #f5f5f5;
               font-size: 12px;
               color: #777;
               cursor: pointer;
               border: 2px solid transparent;
          }

          .tag.active {
               background: #fff0f3;
               border-color: var(--pink-soft);
               color: var(--pink-main);
               font-weight: 700;
          }

          /* Info Row */
          .info-row {
               display: flex;
               align-items: center;
               justify-content: space-between;
               padding: 15px 0;
               border-bottom: 1px solid #fff9fa;
          }

          .i-label {
               font-size: 14px;
               font-weight: 700;
               color: #888;
               display: flex;
               align-items: center;
               gap: 8px;
          }

          .i-val {
               font-size: 13px;
               color: #444;
               text-align: right;
               border: none;
               outline: none;
               background: none;
               width: 65%;
               font-family: 'Quicksand';
          }

          .btn-save {
               width: 100%;
               padding: 18px;
               border: none;
               border-radius: 25px;
               background: linear-gradient(135deg, #ffafbd, #ff748c);
               color: white;
               font-weight: 700;
               font-size: 16px;
               cursor: pointer;
               box-shadow: 0 10px 20px rgba(255, 143, 171, 0.3);
               margin-top: 20px;
          }

          /* Rec Trigger */
          .rec-trigger {
               width: 50px;
               height: 50px;
               border-radius: 50%;
               background: var(--pink-main);
               color: white;
               border: none;
               font-size: 20px;
               cursor: pointer;
               margin: 0 auto;
               display: flex;
               align-items: center;
               justify-content: center;
          }

          .pulse {
               animation: pulse-red 1.5s infinite;
          }

          @keyframes pulse-red {
               0% {
                    box-shadow: 0 0 0 0 rgba(255, 143, 171, 0.7);
               }

               70% {
                    box-shadow: 0 0 0 12px rgba(255, 143, 171, 0);
               }

               100% {
                    box-shadow: 0 0 0 0 rgba(255, 143, 171, 0);
               }
          }

          /* Nav */
          /* --- MENU DƯỚI CÙNG THỐNG NHẤT --- */
          .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0; /* Đảm bảo bám sát lề trái */
    right: 0; /* Đảm bảo bám sát lề phải */
    width: 100%;
    height: 80px; /* Chỉnh lại chiều cao vừa phải */
    background: #fff;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding-bottom: 15px; /* Đẩy icon lên một chút cho thoáng */
    border-top: 1px solid rgba(255, 143, 171, 0.1);
    border-radius: 30px 30px 0 0; /* Bo góc trên cực cute */
    z-index: 1000;
    box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.05);
}

         .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    gap: 2px; /* Khoảng cách giữa icon và chữ */
}

          /* Icon và chữ mặc định màu xám */
          .nav-item i {
               font-size: 20px;
               margin-bottom: 3px;
               color: #ddd;
          }

          .nav-item span {
               font-size: 10px;
               color: #ccc;
               font-weight: 500;
          }

          /* Khi trang đang mở (active) thì icon và chữ hiện màu hồng */
          .nav-item.active i,
          .nav-item.active span {
               color: #ff8fab;
               font-weight: 700;
          }

          /* Nút cộng màu hồng Gradient siêu cute ở giữa */
          .center-btn {
    width: 60px;
    height: 60px;
    background: linear-gradient(45deg, #ffb7c5, #ff8fab);
    border-radius: 50%;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    position: relative;
    top: -35px; /* Nhô lên trên Nav */
    box-shadow: 0 8px 20px rgba(255, 143, 171, 0.4);
    cursor: pointer;
    border: 4px solid #fff; /* Tạo viền trắng tách biệt với Nav */
    transition: 0.3s;
}

          .center-btn:active {
               transform: scale(0.9);
          }

          @keyframes popIn {
               from {
                    opacity: 0;
                    transform: scale(0.8) translateY(20px);
               }

               to {
                    opacity: 1;
                    transform: scale(1) translateY(0);
               }
          }

          .summary-item {
               background: #fffafa;
               border-radius: 20px;
               padding: 12px;
               margin-bottom: 10px;
               display: flex;
               gap: 12px;
               border: 1px solid #fff0f3;
          }

          .summary-thumb {
               width: 55px;
               height: 55px;
               border-radius: 12px;
               object-fit: cover;
               background: #eee;
          }

          .summary-info {
               flex: 1;
               overflow: hidden;
          }

          .summary-text {
               font-size: 13px;
               color: #666;
               white-space: nowrap;
               overflow: hidden;
               text-overflow: ellipsis;
               margin: 3px 0;
          }

          .summary-meta {
               font-size: 11px;
               color: var(--pink-main);
               font-weight: 700;
          }
          @keyframes float {
    0% { transform: translateY(0px) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(5deg); }
    100% { transform: translateY(0px) rotate(0deg); }
}
     </style>
</head>

          const db = getFirestore(app);
async function checkTodayDiary() {
    const todayStr = new Date().toISOString().split('T')[0];
    const docRef = doc(db, "daily_memories", todayStr);
    
    try {
        const snap = await getDoc(docRef);
        if (snap.exists()) {
            const data = snap.data();
            const moments = data.moments || [];
            if (moments.length > 0) {
                renderTodaySummary(moments);
            }
        }
    } catch (e) { console.error("Lỗi check nhật ký:", e); }
}

function renderTodaySummary(moments) {
    const listContainer = document.getElementById('todaySummaryList');
    let html = "";
    
    moments.forEach(m => {
        html += `
            <div class="summary-item">
                <img src="${m.images && m.images[0] ? m.images[0] : 'img/banh.png'}" class="summary-thumb">
                <div class="summary-info">
                    <div class="summary-meta">🕒 ${m.time.split('T')[1] || ''} - ${m.feeling}</div>
                    <div style="font-weight:700; font-size:14px; color:#444;">${m.activity || 'Hoạt động'}</div>
                    <div class="summary-text">${m.content}</div>
                    <div style="font-size: 10px; display:flex; gap: 5px;">
                        ${m.audio ? '<span>🎤 Có Voice</span>' : ''}
                        ${m.images && m.images.length > 1 ? `<span>🖼️ +${m.images.length - 1} ảnh</span>` : ''}
                    </div>
                </div>
            </div>
        `;
    });
    
    listContainer.innerHTML = html;
    document.getElementById('todayWarning').style.display = 'flex';
}

          document.getElementById('diary-time').value = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

               const inp = document.getElementById('diary-addr');

                              inp.dataset.lat = lat;                // Lưu vĩ độ
                              inp.dataset.lon = lon;                // Lưu kinh độ

                              // "Giấu" dữ liệu chi tiết vào đây để saveDiary lấy
                              inp.dataset.fullAddr = data.display_name;
                              inp.dataset.lat = lat;
                              inp.dataset.lon = lon;
                         } catch (e) { inp.value = "Không tìm thấy địa chỉ"; }
                    }, () => { inp.placeholder = "Bé tự gõ nha"; });

          // 2. THU ÂM & FIX TIMER

          const btnRec = document.getElementById('btn-rec'), msg = document.getElementById('rec-msg'),

          function formatTime(s) {
               const m = Math.floor(s / 60);
               const sec = Math.floor(s % 60);
               return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
          }

          btnRec.onclick = async () => {
               if (!mediaRecorder || mediaRecorder.state === "inactive") {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    timerVal = 0;
                    timerDisplay.innerText = "00:00";

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstart = () => {
                         timerInterval = setInterval(() => {
                              timerVal++;
                              timerDisplay.innerText = formatTime(timerVal);
                         }, 1000);
                    };
                    mediaRecorder.onstop = () => {
                         clearInterval(timerInterval);
                         audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                         localPlayer.src = URL.createObjectURL(audioBlob);
                         audioUI.style.display = "flex";
                         btnRec.classList.remove('pulse');
                         msg.innerText = "Nhấn để thu âm lại";
                         localPlayer.onloadedmetadata = () => timerDisplay.innerText = formatTime(localPlayer.duration);
                    };
                    mediaRecorder.start(); btnRec.classList.add('pulse'); msg.innerText = "🔴 Đang lắng nghe bé...";
               } else { mediaRecorder.stop(); }
          };

          // Update timer khi nghe lại
          localPlayer.ontimeupdate = () => {
               if (!localPlayer.paused) timerDisplay.innerText = formatTime(localPlayer.currentTime);
          };

          playBtn.onclick = () => {
               if (localPlayer.paused) {
                    localPlayer.play(); playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
                    document.querySelectorAll('.wf-bar').forEach(b => b.classList.add('active'));
               } else {
                    localPlayer.pause(); playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
                    document.querySelectorAll('.wf-bar').forEach(b => b.classList.remove('active'));
               }
          };
          localPlayer.onended = () => {
               playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
               document.querySelectorAll('.wf-bar').forEach(b => b.classList.remove('active'));
               timerDisplay.innerText = formatTime(localPlayer.duration);
          };

          // 3. ẢNH (Chung Folder với Audio)
          let images = [];
          window.photoWidget = window.cloudinary.createUploadWidget({
               cloudName: CONFIG.cloudName, uploadPreset: CONFIG.uploadPreset,
               maxFiles: 4,
               folder: fullFolderPath // Dùng chung folder thời gian
          }, (error, result) => {
               if (!error && result.event === "success") {
                    images.push(result.info.secure_url);
                    images.forEach((url, i) => { if (i < 4) document.getElementById(`slot-${i}`).innerHTML = `<img src="${url}">`; });
               }
          });

          // 4. CẢM XÚC
          const feelings = [{ n: 'Vui', i: '😊' }, { n: 'Yêu', i: '🥰' }, { n: 'Ngọt', i: '🍭' }, { n: 'Nhớ', i: '☁️' }, { n: 'Dỗi', i: '😤' }];
          let selectedFeel = "Vui";
          const fg = document.getElementById('feelingGrid');
          feelings.forEach(f => {
               const item = document.createElement('div');
               item.className = `choice-item ${f.n === selectedFeel ? 'active' : ''}`;
               item.innerHTML = `<div class="choice-icon">${f.i}</div><div class="choice-name">${f.n}</div>`;
               item.onclick = () => { document.querySelectorAll('.choice-item').forEach(e => e.classList.remove('active')); item.classList.add('active'); selectedFeel = f.n; };
               fg.appendChild(item);
          });
          window.selectTag = (el) => { document.querySelectorAll('.tag').forEach(t => t.classList.remove('active')); el.classList.add('active'); };

          // 5. LƯU (Firebase + Cloudinary cho Audio chung folder)
          // 1. CẬP NHẬT HÀM FETCH GPS (Lấy chi tiết và tọa độ)
          window.fetchGPS = async () => {
               const inp = document.getElementById('diary-addr');
               inp.placeholder = "Đang tìm vị trí...";

               if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(async (pos) => {
                         try {
                              const lat = pos.coords.latitude;
                              const lon = pos.coords.longitude;

                              // Gọi API Nominatim với addressdetails=1 để lấy chi tiết
                              const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&addressdetails=1`);
                              const data = await res.json();

                              // Hiển thị ngắn gọn cho đẹp giao diện
                              const addr = data.address;
                              const shortAddr = addr.road || addr.suburb || addr.quarter || addr.city || "Vị trí bí mật";
                              inp.value = shortAddr;

                              // Lưu dữ liệu chi tiết vào dataset (ẩn) để hàm saveDiary lấy
                              inp.dataset.fullAddr = data.display_name; // Địa chỉ đầy đủ: Số nhà, tên đường, phường, quận...
                              inp.dataset.lat = lat;
                              inp.dataset.lon = lon;

                         } catch (e) {
                              console.error(e);
                              inp.value = "Không tìm thấy địa chỉ";
                         }
                    }, (err) => {
                         console.warn(err);
                         inp.placeholder = "Bé tự gõ nha";
                    }, { enableHighAccuracy: true });
               } else {
                    alert("Trình duyệt của bé không hỗ trợ định vị rồi 🥺");
               }
          };

          // 2. CẬP NHẬT HÀM SAVEDIARY (Lưu đầy đủ thông tin lên Firebase)
        window.saveDiary = async () => {
    // 1. Lấy dữ liệu từ các ô nhập liệu
    const note = document.getElementById('diary-note').value;
    const inpAddr = document.getElementById('diary-addr');
    const act = document.getElementById('diary-act').value;
    const time = document.getElementById('diary-time').value; // VD: "2024-05-20T14:30"
    const companion = document.querySelector('.tag.active')?.innerText || "Một mình";

    // 2. Kiểm tra nếu không có gì để lưu
    if (!note.trim() && images.length === 0 && !audioBlob) {
        return alert("Bé chưa có nội dung gì để lưu hết á! 🥺");
    }

    // Kiểm tra nếu bé chưa chọn thời gian
    if (!time) {
        return alert("Bé chọn thời gian đã nhé! 📅");
    }

    // Hiệu ứng chờ khi đang lưu
    const saveBtn = document.querySelector('.btn-save');
    const originalBtnText = saveBtn.innerText;
    saveBtn.innerText = "Đang gửi lên mây... ☁️";
    saveBtn.disabled = true;

    try {
        // 3. Xử lý Upload Audio (Nếu có) - GIỮ NGUYÊN
        let finalAudioUrl = "";
        if (audioBlob) {
            const fd = new FormData();
            fd.append("file", audioBlob);
            fd.append("upload_preset", CONFIG.uploadPreset);
            fd.append("folder", fullFolderPath);

            const res = await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.cloudName}/upload`, {
                method: "POST",
                body: fd
            });
            const data = await res.json();
            finalAudioUrl = data.secure_url;
        }

        // 4. Lấy dữ liệu GPS (Nếu có) - GIỮ NGUYÊN
        const lat = inpAddr.dataset.lat || "";
        const lon = inpAddr.dataset.lon || "";
        const fullAddr = inpAddr.dataset.fullAddr || inpAddr.value;
        const gMapsLink = lat ? `https://www.google.com/maps?q=${lat},${lon}` : "";

        // 5. Tạo đối tượng kỉ niệm - GIỮ NGUYÊN
        const newMoment = {
            id: Date.now(),
            content: note,
            feeling: selectedFeel,
            companion: companion,
            address: inpAddr.value,
            addressurl: lat ? `https://www.google.com/maps?q=${lat},${lon}` : "",
            activity: act,
            images: images,
            audio: finalAudioUrl,
            time: time,
            assetFolder: fullFolderPath
        };

        // 6. Gửi lên Firebase Firestore
        // SỬA TẠI ĐÂY: Lấy ngày từ biến 'time' mà bé đã nhập/chọn thay vì biến 'dateStr' cố định
        const docId = time.split('T')[0]; 
        
        const docRef = doc(db, "daily_memories", docId);
        const snap = await getDoc(docRef);

        if (snap.exists()) {
            await updateDoc(docRef, { moments: arrayUnion(newMoment) });
        } else {
            // Nếu ngày này chưa có kỉ niệm nào, tạo mới doc với ID là ngày bé chọn
            await setDoc(docRef, { date: docId, moments: [newMoment] });
        }

        alert("Kỉ niệm của chúng mình đã được cất giữ! 💖");
        location.reload();

    } catch (error) {
        console.error("Lỗi:", error);
        alert("Lỗi rồi bé ơi, thử lại nha!");
    } finally {
        saveBtn.innerText = originalBtnText;
        saveBtn.disabled = false;
    }
};
     </script>
