<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Sweet Diary 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            box-shadow: 0 10px 25px rgba(244, 114, 182, 0.1);
        }

        .btn-pink {
            background: linear-gradient(90deg, #f472b6, #fb7185);
            color: white;
            transition: all 0.3s;
        }

        .btn-pink:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(244, 114, 182, 0.4);
        }

        /* Tùy chỉnh thanh cuộn cute */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #fce7f3; }
        ::-webkit-scrollbar-thumb { background: #f472b6; border-radius: 10px; }
    </style>
</head>
<body class="p-4">

    <div id="main-app" class="max-w-2xl mx-auto">
        <!-- Header -->
        <div class="flex items-center gap-3 mb-6">
            <div class="flex-1 bg-white p-4 rounded-3xl shadow-sm border border-pink-100 flex justify-between items-center">
                <div>
                    <h1 class="text-pink-600 font-bold text-lg">Chào công chúa! ✨</h1>
                    <p class="text-pink-400 text-xs">Hôm nay của bạn thế nào?</p>
                </div>
                <button onclick="logout()" class="w-10 h-10 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>

        <!-- Section Up nội dung -->
        <div class="glass-card p-5 mb-6">
            <h3 class="text-pink-600 font-bold mb-3 text-sm flex items-center gap-2">
                <i class="fas fa-pen-fancy"></i> Viết lời tâm sự...
            </h3>
            <textarea id="diary-note" class="w-full p-3 rounded-2xl border-2 border-pink-100 focus:border-pink-300 outline-none text-gray-600 text-sm mb-3" rows="3" placeholder="Ghi lại kỷ niệm đáng yêu này nhé..."></textarea>
            
            <div class="flex gap-2">
                <!-- Nút chọn ảnh (Sẽ gọi Cloudinary) -->
                <button id="upload-widget" class="flex-1 bg-white border-2 border-pink-200 text-pink-500 py-3 rounded-2xl text-xs font-bold flex items-center justify-center gap-2">
                    <i class="fas fa-camera"></i> Thêm ảnh/Video
                </button>
                <button onclick="saveDiary()" class="flex-1 btn-pink py-3 rounded-2xl text-xs font-bold uppercase tracking-wider shadow-lg">
                    Lưu kỷ niệm
                </button>
            </div>
            <!-- Preview ảnh sau khi chọn -->
            <div id="image-preview" class="mt-3 hidden">
                <img src="" id="prev-img" class="w-full h-40 object-cover rounded-xl border-2 border-pink-100">
            </div>
        </div>

        <!-- Danh sách kỷ niệm -->
        <h3 class="text-pink-500 font-bold mb-4 ml-2 flex items-center gap-2">
            <i class="fas fa-heart"></i> Dòng thời gian
        </h3>
        <div id="diary-list" class="space-y-4 mb-10">
            <!-- Dữ liệu sẽ load vào đây -->
            <div class="text-center py-10 text-pink-300">Đang tải kỷ niệm... 🌸</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, query, where, onSnapshot, deleteDoc, orderBy } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        // CẤU HÌNH FIREBASE MỚI CỦA BẠN
        const firebaseConfig = {
            apiKey: "AIzaSyB-Zj-83s3GW09RkAhMS4H8xWmLdi7loSI",
            authDomain: "photodiary-3d469.firebaseapp.com",
            projectId: "photodiary-3d469",
            storageBucket: "photodiary-3d469.firebasestorage.app",
            messagingSenderId: "102477469911",
            appId: "1:102477469911:web:13ed38ab426819fdb43892"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const currentUserId = "GIRL_USER_01"; // ID cố định hoặc từ Auth

        // CẤU HÌNH CLOUDINARY
        const cloudName = "djjinlx7t";
        const uploadPreset = "cunlun"; // Bạn cần tạo Unsigned Upload Preset trong Cloudinary Settings

        let uploadedMediaUrl = "";
        let uploadedMediaType = "";

        // Widget Upload của Cloudinary (Sử dụng thư viện script ngoài)
        const myWidget = window.cloudinary.createUploadWidget({
            cloudName: cloudName, 
            uploadPreset: uploadPreset,
            sources: ['local', 'camera', 'facebook', 'instagram'],
            styles: { palette: { window: "#FFFFFF", windowBorder: "#F472B6", tabIcon: "#F472B6", menuIcons: "#F472B6", textDark: "#000000", textLight: "#FFFFFF", link: "#F472B6", action: "#F472B6", inactiveTabIcon: "#FCE7F3", error: "#F87171", inProgress: "#F472B6", complete: "#22C55E", sourceBg: "#FFF1F2" } }
        }, (error, result) => {
            if (!error && result && result.event === "success") { 
                uploadedMediaUrl = result.info.secure_url;
                uploadedMediaType = result.info.resource_type; // 'image' hoặc 'video'
                document.getElementById('image-preview').classList.remove('hidden');
                document.getElementById('prev-img').src = uploadedMediaUrl;
            }
        });

        document.getElementById("upload-widget").addEventListener("click", () => myWidget.open(), false);

        // Lưu kỷ niệm vào Firebase
        window.saveDiary = async () => {
            const note = document.getElementById("diary-note").value;
            if (!note && !uploadedMediaUrl) return alert("Bạn viết gì đó đi chứ?");

            const id = "diary_" + Date.now();
            await setDoc(doc(db, "memories", id), {
                uid: currentUserId,
                content: note,
                mediaUrl: uploadedMediaUrl,
                mediaType: uploadedMediaType,
                createdAt: new Date().toISOString(),
                ts: Date.now()
            });

            // Reset form
            document.getElementById("diary-note").value = "";
            uploadedMediaUrl = "";
            document.getElementById('image-preview').classList.add('hidden');
            alert("Đã lưu vào nhật ký! 💖");
        };

        // Xóa kỷ niệm
        window.deleteMemory = async (id) => {
            if(confirm("Xóa kỷ niệm này nhé?")) await deleteDoc(doc(db, "memories", id));
        };

        // Load danh sách kỷ niệm realtime
        function loadMemories() {
            const q = query(collection(db, "memories"), where("uid", "==", currentUserId), orderBy("ts", "desc"));
            onSnapshot(q, (snap) => {
                let html = "";
                snap.forEach(d => {
                    const data = d.data();
                    const date = new Date(data.createdAt).toLocaleDateString('vi-VN');
                    html += `
                        <div class="glass-card overflow-hidden border-none shadow-md">
                            ${data.mediaUrl ? (data.mediaType === 'video' ? 
                                `<video src="${data.mediaUrl}" controls class="w-full h-auto"></video>` : 
                                `<img src="${data.mediaUrl}" class="w-full h-auto object-cover">`) : ''}
                            <div class="p-4">
                                <p class="text-gray-700 text-sm mb-2">${data.content}</p>
                                <div class="flex justify-between items-center mt-3 border-t pt-2 border-pink-50">
                                    <span class="text-[10px] text-pink-300 font-bold uppercase"><i class="far fa-calendar-alt"></i> ${date}</span>
                                    <button onclick="deleteMemory('${d.id}')" class="text-pink-200 hover:text-pink-500 text-xs transition">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                document.getElementById("diary-list").innerHTML = html || `<div class="text-center py-10 text-pink-300">Chưa có kỷ niệm nào... Hãy bắt đầu viết nhé! ✨</div>`;
            });
        }

        window.logout = () => { location.href = "index.html"; };

        loadMemories();
    </script>

    <!-- Script hỗ trợ Cloudinary Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</body>
</html>
